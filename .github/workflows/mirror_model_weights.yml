name: Mirror model weights to R2 (one-off)

# Copies externally-licensed model weight files (first use: DINOv3) into our own R2 bucket
# under models/<name>/ with a sha256 manifest, so no production job ever depends on Meta's
# time-limited download links or on a Hugging Face token. Dispatch only. The URLs are pasted as
# a workflow input: they are signed, short-lived links, masked in the job log by the script and
# never stored — the manifest records only the host, file name, size and hash.
# Default is a DRY RUN (download + hash, upload nothing); tick `apply` to upload.

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Weight file URLs, one per line (from Meta's download e-mail)"
        required: true
        type: string
      prefix:
        description: "R2 key prefix"
        required: false
        default: "models/dinov3"
        type: string
      apply:
        description: "Upload to R2 and write the manifest (unticked = dry run)"
        required: false
        default: false
        type: boolean
      note:
        description: "Manifest note, e.g. 'licence accepted by <who> on <date> via <route>'"
        required: false
        default: ""
        type: string

concurrency:
  group: mirror-model-weights
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # Inputs travel through env, never interpolated into the shell (script-injection surface).
      MODEL_WEIGHT_URLS: ${{ inputs.urls }}
      MIRROR_PREFIX: ${{ inputs.prefix }}
      MIRROR_APPLY: ${{ inputs.apply }}
      MIRROR_NOTE: ${{ inputs.note }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      - name: Mirror weights
        run: |
          APPLY=""
          if [ "$MIRROR_APPLY" = "true" ]; then APPLY="--apply"; fi
          python -m scripts.mirror_model_weights --prefix "$MIRROR_PREFIX" --note "$MIRROR_NOTE" $APPLY
