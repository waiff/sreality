name: "Ops: clear the deleted enrichment lane's unmeasured fills (field-capture W7, step iii)"

# Runs scripts/clear_unmeasured_enrichment_fills.py — the operator-approved destructive
# step (iii) of the field-capture program: blank the `floor` values and the silence-based
# `false` booleans the DELETED description-enrichment lane wrote on bazos rows and never
# measured (its own docstring has the counts: ~21k cells, sixteen on active listings).
# dry_run=true (the default) only counts. The real write needs dry_run=false AND
# confirm=APPLY, and the script REFUSES to blank a cell it has not first copied into the
# backup table (listing_id, column_name, value) — a proportionate backup for a table too
# hot for a data-only pg_dump. Same guard shape as reparse.yml.
#
# Required GitHub secret: SUPABASE_DB_URL.

on:
  workflow_dispatch:
    inputs:
      columns:
        description: "Comma-separated subset of floor,has_lift,has_balcony,has_parking (blank = all four)"
        required: false
        default: ""
        type: string
      dry_run:
        description: "true = count only. false = write (needs confirm=APPLY)."
        required: false
        default: true
        type: boolean
      confirm:
        description: Type APPLY to arm the real write. Ignored when dry_run=true.
        required: false
        default: ""
        type: string
      backup_table:
        description: "Where every blanked cell is copied first (a plain identifier)."
        required: false
        default: "listings_w7_clear_backup"
        type: string

concurrency:
  group: reparse
  cancel-in-progress: false

jobs:
  clear:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      - name: Guard the real write
        if: ${{ !inputs.dry_run }}
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "APPLY" ]; then
            echo "::error::dry_run=false requires confirm=APPLY"
            exit 1
          fi

      # Inputs reach the shell as env vars, never interpolated into the script body.
      - name: Clear
        env:
          IN_COLUMNS: ${{ inputs.columns }}
          IN_DRY_RUN: ${{ inputs.dry_run }}
          IN_BACKUP_TABLE: ${{ inputs.backup_table }}
        run: |
          set -euo pipefail
          IN_COLUMNS="${IN_COLUMNS// /}"
          case "$IN_COLUMNS" in
            *[!a-z0-9_,]*) echo "::error::columns may only contain a-z 0-9 _ and commas"; exit 1 ;;
          esac
          case "$IN_BACKUP_TABLE" in
            *[!a-z0-9_]*|"") echo "::error::backup_table must be a plain identifier"; exit 1 ;;
          esac
          ARGS=""
          if [ -n "$IN_COLUMNS" ]; then ARGS="$ARGS --columns $IN_COLUMNS"; fi
          if [ "$IN_DRY_RUN" != "true" ]; then ARGS="$ARGS --apply --backup-table $IN_BACKUP_TABLE"; fi
          python -m scripts.clear_unmeasured_enrichment_fills $ARGS
