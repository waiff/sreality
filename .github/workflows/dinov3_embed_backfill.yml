name: "NEW DEDUP: DINOv3 corpus embedding (RunPod)"

# Embeds stored images with DINOv3 ViT-B/16 on a rented GPU pod, writing one 768-d
# halfvec per image into image_dinov3_embeddings under the six-fact encoder identity
# (model, revision, library, pooling, resolution, preprocessing, dtype). Manual
# dispatch only — this is not a steady-state lane, and it is INERT until the bake-off
# fills in data/dinov3_config.json: the loader refuses to run while any of the six
# facts is null.
#
# THIS LANE WRITES TO A DISK THAT CANNOT SHRINK. A full corpus pass is ~18 GB into a
# live production database. Supabase gp3 disk auto-expands at 90% of allocated disk and
# the project goes READ-ONLY at 95% with the quota exhausted — which takes down the
# scrapers, the API's writes, the SPA and the pipeline, not just this job. That is why
# `max_write_mb_per_hour` is REQUIRED with no default: read the Supabase dashboard's
# live disk-utilisation figure FIRST, then pick a rate against today's headroom. See
# docs/design/new-dedup/ENCODER-DECISION.md §5.0 and §5.5.
#
# Two habits, both cheap: run it with dry_run first (it prints the resolved identity,
# the pending count and the pod plan, and launches nothing), and run a small limit once
# before a large one.
#
# The card is the first rung with capacity of `gpu_allowlist` (in order) x `cloud_type`
# (ANY: community, then secure), under the $1.00/h cap and >=16 GB: G1's ladder, since
# community-only 3090/A5000 found no capacity on 2026-09-27 (run 36316992243). No capacity
# anywhere rents nothing and fails the run; the pod sizes torch's threads from its vCPUs.
#
# Resume is free and needs no state: the target table IS the checkpoint (pending = a
# stored image with no row under this exact config), so a pod dying mid-pass costs
# minutes. With vectors_to=r2 the vectors go to R2 as float16 shard files and the R2
# manifest is the checkpoint; only the head scores are written to Postgres.
#
# The pending scan is paged (min(limit, 200,000) a scan): run 36334588774 re-ran that
# full-table anti-join for every 256 images and managed ~1 image/s on a 4090. The write
# budget counts measured bytes: 2,412 B a vector row, 563 B a head-score row (09-27). Completion is NOT read from the pod — on-demand Pods never flip
# desiredStatus, so run_job always times out and tears the pod down in its `finally`.
# Progress is a SQL question: count(rows for this config) / count(stored images).
#
# The wait window is the CEILING, not the plan: a watchdog asks that same SQL question
# once a minute and tears the pod down if nothing ever appears
# (bootstrap_deadline_seconds) or if it stops appearing (stall_deadline_seconds). The
# sibling bake-off lane paid 8,115s of rent for zero vectors on 2026-09-08 for want of
# it. A watchdog teardown FAILS this job on purpose.
#
# THE POD WORKS ON THE CONTAINER DISK, NOT ON /workspace. /workspace is RunPod's mount
# point for the pod VOLUME, which used to default to 1 GB while a ~5 GB torch install
# was pointed at it — the likeliest cause of the sibling lane's third failed pod. The
# bootstrap now works in /opt/podboot, this lane rents no volume, and container_disk_gb
# is the knob. The bootstrap is also idempotent and ends in a sleep rather than an exit,
# because RunPod re-runs the start command whenever it exits.
#
# Requires migration 480 (PR #1296) to have been applied — the table does not exist
# otherwise.
#
# Required secrets: RUNPOD_API_KEY, SUPABASE_DB_URL, HF_TOKEN, R2_*.

on:
  workflow_dispatch:
    inputs:
      max_write_mb_per_hour:
        description: "REQUIRED. Per-pod ceiling on Postgres growth in MB/hour, charged at measured bytes (vector row 2,412 B, head-score row 563 B; 09-27). No safe default exists — read the Supabase dashboard's live disk utilisation first; 90% auto-expands the disk, 95% with no quota left puts the WHOLE project in read-only."
        required: true
        type: string
      limit:
        description: "Max images this pass."
        required: false
        default: "20000"
        type: string
      shard:
        description: "Shard index (image_id % shards == shard)."
        required: false
        default: "0"
        type: string
      shards:
        description: "Shard count. 1 = no sharding."
        required: false
        default: "1"
        type: string
      workers:
        description: "Parallel R2 download + decode + resize threads inside the pod. 0 = sized from the pod's vCPUs (4 each, 8..48); chunk and batch are always sized on the pod from its RAM."
        required: false
        default: "0"
        type: string
      job_max_seconds:
        description: "The payload's own time budget. The pod's wait window is this plus a 900s startup grace, so teardown lands after a clean stop, never mid-batch."
        required: false
        default: "3600"
        type: string
      bootstrap_deadline_seconds:
        description: "Kill the pod if no vector reaches the database within this long (fetch + 3.12 venv + torch + weights + the first chunk). The 2026-09-08 failure mode: a broken bootstrap billed for the whole window. This lane has no run row for the bootstrap's step heartbeats to land in, so its only proof of life is still the first vector — keep it generous."
        required: false
        default: "1800"
        type: string
      stall_deadline_seconds:
        description: "Kill the pod if a working pod stops writing vectors for this long."
        required: false
        default: "900"
        type: string
      container_disk_gb:
        description: "The pod's CONTAINER disk in GB — where the bootstrap works (/opt/podboot). It must hold the base image, ~5GB of installed torch and the DINOv3 weights. No pod volume is rented: /workspace was a 1GB volume and a 5GB install aimed at it is what killed the sibling lane's 2026-09-08 pod. Minimum 40."
        required: false
        default: "60"
        type: string
      scope:
        description: "all = the corpus; rt = the live lane's scope snapshot (autodedup.rt_scope_ids); ids = listing_ids_file; blocks = an export block spec (blocks input); scored = the images the active tag model already scored (the population gate)."
        required: false
        default: "all"
        type: choice
        options: ["all", "rt", "ids", "blocks", "scored"]
      listing_ids_file:
        description: "scope=ids only: a repo path of listing ids (one per line, .gz allowed) at the dispatched ref."
        required: false
        default: ""
        type: string
      blocks:
        description: "scope=blocks only: export block specs joined by commas, e.g. town:563510,town:577626,quarter:490245."
        required: false
        default: ""
        type: string
      score_heads:
        description: "Also score every written vector with the ACTIVE tag model into image_tag_scores in the same pass."
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      vectors_to:
        description: "postgres = image_dinov3_embeddings (2,412 B a row, measured 09-27). r2 = float16 shard files + a manifest (image_id, shard, row) in R2 under one prefix per encoder identity; only the head scores (563 B a row) reach Postgres, the engine reads only those, and tag_model score --source r2:<prefix> re-scores a later head version without re-embedding."
        required: false
        default: "postgres"
        type: choice
        options: ["postgres", "r2"]
      r2_prefix:
        description: "vectors_to=r2 only: the store's R2 prefix. Empty = dinov3-vectors/<model>/<identity>, shared by every scope and dispatch of this encoder, so a re-dispatch resumes."
        required: false
        default: ""
        type: string
      gpu_allowlist:
        description: "Comma-separated RunPod GPU ids or whole-word names (e.g. NVIDIA RTX A4000 or 3090), tried in this order. Empty = the default ladder (nineteen 16 GB+ Ampere/Ada cards, 3090/A5000/3090 Ti first: dinov3_embed_dispatch.DEFAULT_GPU_ALLOWLIST, the same ladder as G1's)."
        required: false
        default: ""
        type: string
      cloud_type:
        description: "Where to look for each card. ANY = the community cloud, then the secure one, before moving to the next card. Always under the lane's $1.00/h cap; no capacity anywhere rents nothing and fails the run."
        required: false
        default: "ANY"
        type: choice
        options: ["ANY", "COMMUNITY", "SECURE"]
      dry_run:
        description: "Print the resolved identity, the pending count and the pod plan. Launches nothing, writes nothing, spends nothing."
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]

# One group PER SHARD: shards are disjoint (image_id % shards), so N shards are N pods in
# parallel; a second dispatch of the SAME shard queues behind the first instead of racing it.
concurrency:
  group: dinov3-embed-backfill-${{ inputs.shards }}-${{ inputs.shard }}
  cancel-in-progress: false

jobs:
  embed:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # The runner only dispatches — torch and the model live in the pod, so the
      # `clip` extra is deliberately NOT installed here. psycopg/boto3/Pillow are
      # base deps, which is all the dispatcher and the readout need.
      - name: Install
        run: pip install -e .

      - name: Dispatch DINOv3 embedding pass
        env:
          MAX_WRITE_MB_PER_HOUR: ${{ inputs.max_write_mb_per_hour }}
          LIMIT: ${{ inputs.limit }}
          SHARD: ${{ inputs.shard }}
          SHARDS: ${{ inputs.shards }}
          WORKERS: ${{ inputs.workers }}
          JOB_MAX_SECONDS: ${{ inputs.job_max_seconds }}
          BOOTSTRAP_DEADLINE_SECONDS: ${{ inputs.bootstrap_deadline_seconds }}
          STALL_DEADLINE_SECONDS: ${{ inputs.stall_deadline_seconds }}
          CONTAINER_DISK_GB: ${{ inputs.container_disk_gb }}
          DRY_RUN: ${{ inputs.dry_run }}
          SCOPE: ${{ inputs.scope }}
          LISTING_IDS_FILE: ${{ inputs.listing_ids_file }}
          BLOCKS: ${{ inputs.blocks }}
          SCORE_HEADS: ${{ inputs.score_heads }}
          VECTORS_TO: ${{ inputs.vectors_to }}
          R2_PREFIX: ${{ inputs.r2_prefix }}
          GPU_ALLOWLIST: ${{ inputs.gpu_allowlist }}
          CLOUD_TYPE: ${{ inputs.cloud_type }}
        # Inputs travel via env and are case-validated before use, never interpolated
        # into the shell by ${{ }}. ARGS is an array: RunPod GPU ids carry spaces.
        run: |
          set -euo pipefail
          # RunPod ids carry spaces (NVIDIA GeForce RTX 3090); nothing else beyond these.
          case "${GPU_ALLOWLIST:-}" in
            *[!A-Za-z0-9\ ,._-]*) echo "::error::gpu_allowlist must be comma-separated GPU names"; exit 1 ;;
          esac
          case "${CLOUD_TYPE:-ANY}" in
            ANY|COMMUNITY|SECURE) ;;
            *) echo "::error::cloud_type must be ANY, COMMUNITY or SECURE"; exit 1 ;;
          esac
          case "${MAX_WRITE_MB_PER_HOUR}" in
            ''|*[!0-9.]*) echo "::error::max_write_mb_per_hour must be a number — and it must be chosen against the Supabase dashboard's live disk utilisation"; exit 1 ;;
          esac
          case "${LIMIT:-20000}" in
            ''|*[!0-9]*) echo "::error::limit must be a number"; exit 1 ;;
          esac
          case "${SHARD:-0}" in
            ''|*[!0-9]*) echo "::error::shard must be a number"; exit 1 ;;
          esac
          case "${SHARDS:-1}" in
            ''|*[!0-9]*) echo "::error::shards must be a number"; exit 1 ;;
          esac
          case "${WORKERS:-0}" in
            ''|*[!0-9]*) echo "::error::workers must be a number"; exit 1 ;;
          esac
          case "${JOB_MAX_SECONDS:-3600}" in
            ''|*[!0-9]*) echo "::error::job_max_seconds must be a number"; exit 1 ;;
          esac
          case "${BOOTSTRAP_DEADLINE_SECONDS:-1800}" in
            ''|*[!0-9]*) echo "::error::bootstrap_deadline_seconds must be a number"; exit 1 ;;
          esac
          case "${STALL_DEADLINE_SECONDS:-900}" in
            ''|*[!0-9]*) echo "::error::stall_deadline_seconds must be a number"; exit 1 ;;
          esac
          case "${CONTAINER_DISK_GB:-60}" in
            ''|*[!0-9]*) echo "::error::container_disk_gb must be a number"; exit 1 ;;
          esac
          ARGS=(--max-write-mb-per-hour "${MAX_WRITE_MB_PER_HOUR}" --limit "${LIMIT:-20000}")
          ARGS+=(--shard "${SHARD:-0}" --shards "${SHARDS:-1}" --workers "${WORKERS:-0}")
          ARGS+=(--job-max-seconds "${JOB_MAX_SECONDS:-3600}")
          ARGS+=(--bootstrap-deadline-s "${BOOTSTRAP_DEADLINE_SECONDS:-1800}")
          ARGS+=(--stall-deadline-s "${STALL_DEADLINE_SECONDS:-900}")
          ARGS+=(--container-disk-gb "${CONTAINER_DISK_GB:-60}")
          ARGS+=(--cloud-type "${CLOUD_TYPE:-ANY}")
          if [ -n "${GPU_ALLOWLIST:-}" ]; then ARGS+=(--gpu-allowlist "${GPU_ALLOWLIST}"); fi
          case "${SCOPE:-all}" in
            all|rt|ids|blocks|scored) ;;
            *) echo "::error::scope must be all, rt, ids, blocks or scored"; exit 1 ;;
          esac
          case "${LISTING_IDS_FILE:-}" in
            *[!A-Za-z0-9._/-]*) echo "::error::listing_ids_file must be a plain repo path"; exit 1 ;;
          esac
          case "${BLOCKS:-}" in
            *[!a-z0-9:,]*) echo "::error::blocks must be like town:563510,quarter:490245"; exit 1 ;;
          esac
          ARGS+=(--scope "${SCOPE:-all}")
          if [ -n "${BLOCKS:-}" ]; then ARGS+=(--blocks "${BLOCKS}"); fi
          if [ -n "${LISTING_IDS_FILE:-}" ]; then ARGS+=(--listing-ids-file "${LISTING_IDS_FILE}"); fi
          if [ "${SCORE_HEADS:-false}" = "true" ]; then ARGS+=(--score-heads); fi
          case "${VECTORS_TO:-postgres}" in
            postgres|r2) ;;
            *) echo "::error::vectors_to must be postgres or r2"; exit 1 ;;
          esac
          case "${R2_PREFIX:-}" in
            *[!A-Za-z0-9._/-]*) echo "::error::r2_prefix must be a plain key prefix"; exit 1 ;;
          esac
          ARGS+=(--vectors-to "${VECTORS_TO:-postgres}")
          if [ -n "${R2_PREFIX:-}" ]; then ARGS+=(--r2-prefix "${R2_PREFIX}"); fi
          if [ "${DRY_RUN:-true}" = "true" ]; then ARGS+=(--dry-run); fi
          echo "python -m scripts.dinov3_embed_dispatch ${ARGS[*]}"
          python -m scripts.dinov3_embed_dispatch "${ARGS[@]}"

      # The dispatcher never touches the database; this is the operator-facing progress
      # readout, and it is the same SQL anyone can run at any time to answer "how far
      # along is it?" — the target table is the only progress record this lane keeps.
      # Advisory: while data/dinov3_config.json is still provisional it raises the
      # refuse-to-run rail, and while migration 480 is unapplied the table is absent —
      # both are expected states for this lane and neither should fail the run. (The
      # ceiling is a required flag; a dry run writes nothing, so the value is inert.)
      - name: Pending readout (advisory)
        if: always()
        continue-on-error: true
        env:
          VECTORS_TO: ${{ inputs.vectors_to }}
          R2_PREFIX: ${{ inputs.r2_prefix }}
        # R2 mode reads the manifest (vectors stored, identity match) instead of the
        # Postgres anti-join count.
        run: |
          set -euo pipefail
          case "${VECTORS_TO:-postgres}" in postgres|r2) ;; *) exit 1 ;; esac
          case "${R2_PREFIX:-}" in *[!A-Za-z0-9._/-]*) exit 1 ;; esac
          ARGS=(--max-write-mb-per-hour 1 --dry-run --vectors-to "${VECTORS_TO:-postgres}")
          if [ -n "${R2_PREFIX:-}" ]; then ARGS+=(--r2-prefix "${R2_PREFIX}"); fi
          python -m scripts.dinov3_embed_backfill "${ARGS[@]}"
