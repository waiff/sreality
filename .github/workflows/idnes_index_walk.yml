name: "Scraping: iDNES Reality index walk"

# portal: idnes
# The fast half of the iDNES cadence split (architectural rule #19, like sreality).
# Walks the ENTIRE index of every configured category (no --max-pages),
# touch_listings bumps last_seen on still-listed ids, mark_inactive flips delisted
# ones under the completeness guard (source-scoped), and new/price-changed ids are
# enqueued into listing_detail_queue (source='idnes'). No detail fetch — the drain
# (idnes_detail_drain.yml) consumes the queue. Records run_type='index'.
#
# WHY split: iDNES is large (~2400 index pages across byty+domy × prodej+pronájem,
# ~60k listings), so a full index walk takes most of a job's window — a combined
# index+detail run starves the drain. Splitting lets the index complete every cycle
# (so active counts stay accurate) while the drain chips the backlog on its own
# cadence.
#
# Categories live in the `portals` registry row (migrations 110/111); coverage is
# tuned with a SQL update, no workflow edit. Coordinates come from the page, so no
# MAPY_CZ_API_KEY is needed. Required secret: SUPABASE_DB_URL.

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:
    inputs:
      max_pages:
        description: cap index pages per category (ad-hoc partial; suppresses mark_inactive). Blank = full walk.
        required: false
        default: ""
        type: string
      max_seconds:
        description: wall-clock budget; the walk finalizes cleanly before this (blank = 13000 = 217 min).
        required: false
        default: ""
        type: string

concurrency:
  group: idnes-index-walk
  cancel-in-progress: false

jobs:
  index-walk:
    runs-on: ubuntu-latest
    # The full walk normally completes well inside the --max-seconds budget
    # (13000 = 217 min); the budget makes it finalize CLEANLY even on a slow/grown
# WHY 217 and not 150 (2026-09-05): a full walk is ~4,360 pages and per-page
# latency through the residential proxy swings 1.4-4.0 s with the time of day.
# Break-even at 9000 s was ~2.06 s/page: 6 of 12 runs fit (night), 6 hit the
# deadline (afternoon). 13000 s covers 3.0 s/page. The 6 h cron leaves ~2 h slack.
    # day instead of being SIGKILLed, and this timeout is just the generous outer
    # backstop (budget + finalize headroom). Don't re-tune the timeout to the walk
    # size — the --max-seconds clean-stop is what keeps it drift-proof.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      - name: Run idnes index walk
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          # idnes soft-throttles our datacenter egress: ~2.3s/page for 20 requests,
          # then a silent ~390s stall (no 429, no error). 24 stalls ate 143 of a
          # 160-minute run. The residential exit removes it (0.047 -> ~0.6 pages/s)
          # at an UNCHANGED request rate. Unset = direct IP, i.e. the slow status quo.
          SCRAPER_PROXY_URL: ${{ secrets.SCRAPER_PROXY_URL }}
          # W2a payload archive: bodies live in R2, so a page-fetching lane needs the
          # bucket to archive one. Absent, the append warns and archives NOTHING while
          # the scrape stays green. Inert until payload_dual_write is enabled.
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          MAX_PAGES: ${{ inputs.max_pages }}
          MAX_SECONDS: ${{ inputs.max_seconds || '13000' }}
        run: |
          ARGS="--index-only --max-seconds $MAX_SECONDS"
          if [ -n "$MAX_PAGES" ]; then ARGS="$ARGS --max-pages $MAX_PAGES"; fi
          echo "python -m scraper.idnes_main $ARGS"
          eval "python -m scraper.idnes_main $ARGS"
