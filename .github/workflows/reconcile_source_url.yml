name: Reconcile source_url (sreality page URLs from typed columns)

# Dispatch-only reconciler for the portal-URL contract (docs/design/portal-listing-url.md).
# sreality was the only portal whose page URL was not a stored fact — the parser never
# emitted `listings.source_url` and the SPA rebuilt one from display labels that 404. W0
# made every fresh detail fetch emit it; this job fills the ~232k rows written before
# that and, run weekly in dry-run with `report_check`, is the standing drift detector
# (`outbound_url_parity` in pipeline_check_results). It reads NO raw_json: every
# 404-critical segment is a typed column, and the locality is slugified through the same
# assembler ingest uses (`scraper.sreality_url`). Canonical string or nothing — never a
# placeholder. Writes only `listings.source_url`, which is out of every content hash (zero
# snapshots, no trigger). DML, not DDL; waits for a read-model rebuild gap and replays a
# batch that loses a lock fight with the hourly MF recompute. Two gates stop a write
# pass: an unknown category_sub_cb on a row seen in the last 7 days (the codebook moved),
# and `conformance` > 0 finding any 404 on a live sample. NOT a portal ingest workflow,
# so it carries no `# portal:` tag.
#
# The script DEFAULTS TO DRY-RUN: it reports and exits unless `write` is true.
# Operator order: write=false -> read the counters -> conformance=40 -> write=true
# (clear=false) -> later clear=true once `would_clear` is understood.
#
# Required GitHub secret: SUPABASE_DB_URL.

on:
  # Weekly parity (W3): the same walk in DRY-RUN with report_check — rows whose stored
  # URL disagrees with today's derivation on a 404-critical segment, plus the unknown-
  # code histogram — lands in pipeline_check_results as `outbound_url_parity`. It is the
  # only detector that reaches the inactive archive; it writes nothing to listings.
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:
    inputs:
      write:
        description: Actually write. Left false, this only reports what would change.
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      clear:
        description: Also NULL a stored sreality URL whose derivation now declines (read would_clear first)
        required: false
        default: false
        type: boolean
      conformance:
        description: Pre-flight HEAD-probe this many random active rows (0 = skip); any 404 blocks a write
        required: false
        default: "0"
        type: string
      report_check:
        description: Persist one pipeline_check_results row (outbound_url_parity)
        required: false
        default: false
        type: boolean
      limit:
        description: Max listings examined this run (blank = the whole table)
        required: false
        default: ""
        type: string
      after:
        description: Resume from this listings.id cursor (exclusive)
        required: false
        default: "0"
        type: string
      batch_size:
        description: Rows per keyset page
        required: false
        default: "5000"
        type: string
      max_seconds:
        description: Wall-clock budget in seconds (blank = no budget)
        required: false
        default: ""
        type: string
      rebuild_wait_seconds:
        description: How long to wait for a read-model rebuild gap before starting anyway
        required: false
        default: ""
        type: string
      ignore_rebuild:
        description: Start immediately, without waiting for a rebuild gap at all
        required: false
        default: false
        type: boolean
      verbose:
        description: Log every individual write (DEBUG)
        required: false
        default: false
        type: boolean

concurrency:
  group: reconcile-source-url
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      - name: Reconcile source_url
        run: |
          ARGS="--after ${{ inputs.after || '0' }} --batch-size ${{ inputs.batch_size || '5000' }}"
          ARGS="$ARGS --conformance ${{ inputs.conformance || '0' }}"
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          if [ -n "${{ inputs.max_seconds }}" ]; then ARGS="$ARGS --max-seconds ${{ inputs.max_seconds }}"; fi
          if [ "${{ inputs.write }}" = "true" ]; then ARGS="$ARGS --write"; fi
          if [ "${{ inputs.clear }}" = "true" ]; then ARGS="$ARGS --clear"; fi
          if [ "${{ inputs.report_check }}" = "true" ] || [ "${{ github.event_name }}" = "schedule" ]; then ARGS="$ARGS --report-check"; fi
          if [ -n "${{ inputs.rebuild_wait_seconds }}" ]; then ARGS="$ARGS --rebuild-wait-seconds ${{ inputs.rebuild_wait_seconds }}"; fi
          if [ "${{ inputs.ignore_rebuild }}" = "true" ]; then ARGS="$ARGS --ignore-rebuild"; fi
          if [ "${{ inputs.verbose }}" = "true" ]; then ARGS="$ARGS --verbose"; fi
          python -m scripts.reconcile_source_url $ARGS
