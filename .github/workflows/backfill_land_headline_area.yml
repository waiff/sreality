name: Backfill land headline area (the plot three parsers never handed to the rule)

# One-off, dispatch-only heal for W17 ("one headline area"). `listings.area_m2` is
# polymorphic by design — the interior measure for a dwelling, THE PLOT for `pozemek` —
# and `scraper.area.derive_headline_area` is the one rule that picks it. Until W17 the
# sreality, bezrealitky and idnes parsers never handed that rule the plot at all, though
# each of them DID store it in `estate_area`: 52,183 land rows (sreality 44,237 of 44,237,
# idnes 5,292 of 45,500, bezrealitky 2,654 of 2,667; ~32.7k of them active) carry a parcel
# and no headline area, so they have no per-m² price and no area for any consumer that
# reads the headline — including the NEW DEDUP path C candidate rule. The parser change
# fixes every future write; this fixes the rows already stored, with the same value the
# same page already gave us:
#
#   area_m2 = estate_area, area_basis = 'plot'
#   WHERE category_main = 'pozemek' AND (area_m2 IS NULL OR area_m2 <= 0) AND estate_area > 0
#
# ALL rows, active or not — coverage is every listing. Writes NO `listing_snapshots` row:
# `area_m2` is hashed, but correcting our own mis-parse of the SAME stored page is the
# sanctioned exception (the `backfill_idnes_areas` precedent), and a live row's next detail
# refetch appends exactly ONE genuine snapshot, spread over the normal cadence. Idempotent
# with no marker — a healed row fails the predicate for ever after, so the selection empties
# itself. Batched by id (5,000 per UPDATE), each batch in its own transaction with `SET
# LOCAL statement_timeout` + `lock_timeout` and a replay through the shared lock-retry rail.
# DML, not DDL: no ACCESS EXCLUSIVE, so it cannot head-block a writer; it waits for a
# read-model rebuild gap first, bounded, then proceeds anyway since the contention is I/O
# and never a lock conflict. Healed listings are enqueued into `dirty_properties` so the
# singleton `properties.area_m2` mirror is recomputed (rule 20). NOT a portal ingest
# workflow, so it carries no `# portal:` tag.
#
# The script DEFAULTS TO DRY-RUN: it reports the pending count per portal and exits unless
# `write` is true.
#
# Required GitHub secret: SUPABASE_DB_URL.

on:
  workflow_dispatch:
    inputs:
      write:
        description: Actually write. Left false, this only reports what would change.
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      limit:
        description: Max listings healed this run (blank = all of them)
        required: false
        default: ""
        type: string
      after:
        description: Resume from this listings.id cursor (exclusive)
        required: false
        default: "0"
        type: string
      batch_size:
        description: Rows per keyset page, and per UPDATE statement
        required: false
        default: "5000"
        type: string
      max_seconds:
        description: Wall-clock budget in seconds (blank = no budget)
        required: false
        default: ""
        type: string
      rebuild_wait_seconds:
        description: How long to wait for a read-model rebuild gap before starting anyway
        required: false
        default: ""
        type: string
      ignore_rebuild:
        description: Start immediately, without waiting for a rebuild gap at all
        required: false
        default: false
        type: boolean
      verbose:
        description: Log every page's id range and portals (DEBUG)
        required: false
        default: false
        type: boolean

concurrency:
  group: backfill-land-headline-area
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      - name: Heal the land headline area
        run: |
          ARGS="--after ${{ inputs.after || '0' }} --batch-size ${{ inputs.batch_size || '5000' }}"
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          if [ -n "${{ inputs.max_seconds }}" ]; then ARGS="$ARGS --max-seconds ${{ inputs.max_seconds }}"; fi
          if [ "${{ inputs.write }}" = "true" ]; then ARGS="$ARGS --write"; fi
          if [ -n "${{ inputs.rebuild_wait_seconds }}" ]; then ARGS="$ARGS --rebuild-wait-seconds ${{ inputs.rebuild_wait_seconds }}"; fi
          if [ "${{ inputs.ignore_rebuild }}" = "true" ]; then ARGS="$ARGS --ignore-rebuild"; fi
          if [ "${{ inputs.verbose }}" = "true" ]; then ARGS="$ARGS --verbose"; fi
          python -m scripts.backfill_land_headline_area $ARGS
