name: "Ops: re-parse stored rows through the portal's own parser"

# The ONE re-parse seam (`scripts/reparse.py`) — the dispatch that carries a parser fix back
# to rows already in `listings`, replacing the one-off `backfill_*.py` family. It re-runs the
# portal's OWN `parse_detail` / `parse_advert` / `parse_listing` over the substrate declared
# for that portal — `portal_raw_pages.html` on the seven HTML portals (100 % coverage,
# inactive rows included, staged in the same drain transaction that writes the row, so it
# cannot lag it) and `listings.raw_json` on sreality + bezrealitky, which stage no body at
# all. No fetch, no R2, no network.
#
# `fields` is REQUIRED and is the whole safety story: the run writes exactly the columns you
# name and reads the rest only to leave them alone, so healing `has_lift` can never restate
# a price. It never blanks a value the re-derive could not produce, never writes a
# `listing_snapshots` row (a hashed column's one genuine snapshot is DEFERRED to that
# listing's next natural detail fetch — an inactive row never gets one), never touches
# `last_seen_at`, and enqueues `dirty_properties` in the same statement as the UPDATE.
#
# dry_run=true (the default) reports per-field would-change counts and examples and writes
# nothing. The real write needs dry_run=false AND confirm=APPLY, and — for any column in the
# content hash — allow_snapshot_deferral=true, which the script itself refuses to proceed
# without.
#
# Required GitHub secret: SUPABASE_DB_URL.

on:
  workflow_dispatch:
    inputs:
      source:
        description: Portal to replay. Its substrate is declared in the script, not chosen here.
        required: true
        type: choice
        options:
          - bazos
          - bezrealitky
          - ceskereality
          - idnes
          - maxima
          - mmreality
          - realitymix
          - remax
          - sreality
      fields:
        description: "Comma-separated listings columns to re-derive, e.g. has_lift,cellar"
        required: true
        type: string
      dry_run:
        description: "true = report what would change only. false = write (needs confirm=APPLY)."
        required: false
        default: true
        type: boolean
      confirm:
        description: Type APPLY to arm the real write. Ignored when dry_run=true.
        required: false
        default: ""
        type: string
      allow_snapshot_deferral:
        description: Acknowledge that writing a HASHED column defers one snapshot per live row to its next detail fetch
        required: false
        default: false
        type: boolean
      missing:
        description: Only rows where EVERY named column is still NULL (the gap class)
        required: false
        default: false
        type: boolean
      limit:
        description: Max listings EXAMINED this run (blank = all of them)
        required: false
        default: ""
        type: string
      after:
        description: Resume from this listings.id cursor (exclusive)
        required: false
        default: "0"
        type: string
      batch_size:
        description: Rows per keyset page, and per UPDATE statement
        required: false
        default: "200"
        type: string
      max_seconds:
        description: Wall-clock budget in seconds (blank = the script's 9000 s default)
        required: false
        default: ""
        type: string
      verbose:
        description: DEBUG logging (per-row parse failures)
        required: false
        default: false
        type: boolean

concurrency:
  group: reparse
  cancel-in-progress: false

jobs:
  reparse:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      - name: Guard the real write
        if: ${{ !inputs.dry_run }}
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "APPLY" ]; then
            echo "::error::dry_run=false requires confirm=APPLY"
            exit 1
          fi

      # Inputs reach the shell as env vars, never interpolated into the script body.
      - name: Re-parse
        env:
          IN_SOURCE: ${{ inputs.source }}
          IN_FIELDS: ${{ inputs.fields }}
          IN_DRY_RUN: ${{ inputs.dry_run }}
          IN_DEFERRAL: ${{ inputs.allow_snapshot_deferral }}
          IN_MISSING: ${{ inputs.missing }}
          IN_LIMIT: ${{ inputs.limit }}
          IN_AFTER: ${{ inputs.after }}
          IN_BATCH_SIZE: ${{ inputs.batch_size }}
          IN_MAX_SECONDS: ${{ inputs.max_seconds }}
          IN_VERBOSE: ${{ inputs.verbose }}
        run: |
          set -euo pipefail
          case "$IN_FIELDS" in
            *[!a-z0-9_,\ ]*) echo "::error::fields may only contain a-z 0-9 _ and commas"; exit 1 ;;
          esac
          ARGS="--source $IN_SOURCE --fields $IN_FIELDS"
          ARGS="$ARGS --after ${IN_AFTER:-0} --batch-size ${IN_BATCH_SIZE:-200}"
          if [ -n "$IN_LIMIT" ]; then ARGS="$ARGS --limit $IN_LIMIT"; fi
          if [ -n "$IN_MAX_SECONDS" ]; then ARGS="$ARGS --max-seconds $IN_MAX_SECONDS"; fi
          if [ "$IN_MISSING" = "true" ]; then ARGS="$ARGS --missing"; fi
          if [ "$IN_DRY_RUN" != "true" ]; then ARGS="$ARGS --write"; fi
          if [ "$IN_DEFERRAL" = "true" ]; then ARGS="$ARGS --allow-snapshot-deferral"; fi
          if [ "$IN_VERBOSE" = "true" ]; then ARGS="$ARGS --verbose"; fi
          python -m scripts.reparse $ARGS
