name: "AUTODEDUP: engine lane"

# The lane for the autonomous dedup engine programme — one dispatch-only entry point
# (`python -m autodedup.lane`) whose `mode` input selects what it does. Isolated from the
# dedup_sim simulation lane: new package, new workflow, nothing shared. `mode` is validated
# in Python rather than as a YAML choice list, so adding a mode needs no workflow edit.
#
#   census  — READS ONLY. Counts ALL-TIME listings (active + delisted) per region block at
#             two grains (town = obec_kod, quarter = cast_obce_kod): portal breadth, category
#             and deal-type spread, disposition/area/floor/broker coverage, location
#             precision, image / pHash / CLIP coverage, shared-pin share, and the raw
#             in-block pair count under a COARSE block x category key - an upper bound on any
#             finer blocking the engine adopts, not a figure comparable to a live lane. Prints
#             a ranked table and writes out/census.json. This is how the trial region is
#             chosen. It also runs four PROBES per shortlisted block - per-portal
#             image/pHash/CLIP coverage, the same-source re-post base rate, address-level
#             developer density and shared-image density - printed as a second table and
#             attached to each block in census.json. `probes=0` turns them off.
#
#   probes  - READS ONLY. The corpus-wide measurements that do not belong to any one block
#             and so are paid for once, not once per block: the ingest rate (listings first
#             seen in the last 1 and 7 days, by source, the L every monthly cost number
#             scales with) and one portal's location posture (granularity histogram plus pin
#             coverage, `source=` picking the portal, default remax). Prints two small tables
#             and writes out/probes.json.
#
#   export  - READS ONLY. Dumps the trial cohort - two district towns, one Praha quarter and
#             the assembled negative control (Praha address points carrying at least three
#             listings across more than one floor, whole groups largest-first up to
#             negctl_max, 800 by default) - as ONE gzipped JSONL artifact,
#             out/cohort.jsonl.gz: a meta line, then one record per listing (attributes,
#             scrubbed description, location, hashed broker key, price-change path from the
#             snapshots), then one per image (storage path, pHash with its corpus-wide
#             population, the CLIP vector as base64 float16, room tags - the logical tag is
#             a ROOM TYPE, its family comes from toolkit.room_taxonomy). No personal data
#             leaves: broker names, phones and e-mails are never written, only a salted
#             hash, and descriptions are scrubbed of Czech phone, e-mail and name patterns
#             first. That artifact is what makes every later wave free - blocking, features,
#             model fitting and clustering all run locally against the file instead of the
#             database. The file is renamed onto its final name only after the stream closes
#             cleanly, so a failed run uploads summary.json and no artifact rather than a
#             plausible-looking partial one. The one statement that can blow its budget is
#             the corpus-wide pHash population (no index on images.phash, and ruling D8
#             forbids adding one): when it times out the run still ships, every `pop` is
#             written null - UNKNOWN, not zero - and meta carries phash_pop_ok=false plus
#             the error.
#             NOTE the negative control here is the geographic draw this wave was built to,
#             not ruling D1's verbatim label over blocks 1-3 (whose second arm is a dHash on
#             >= 5 distinct listings); that divergence is open and needs a ruling line in
#             PROGRAM.md section 14 before W1 closes.
#
#   score   - READS the artifact, WRITES the engine's own schema. Downloads a finished
#             `export` run's cohort artifact (`gh run download`, which is why the job asks
#             for `actions: read`), runs `harness run` over it in-process - the real-time
#             lane's own run_pass over an in-memory store, the whole cohort claimed as the
#             scope (SW1) - and PERSISTS what it decided into schema autodedup - nothing in public.* is
#             touched and nothing is merged (ruling D4, clusters land with status `proposed`
#             and no property_id). One `autodedup.runs` row wraps the pass: `running` from
#             BEFORE the engine starts - the long phase, and the one that dies - then
#             `success` or `failed` plus the scrubbed error text at the end, with the settings
#             + model + generation digest as its fingerprint. Needs migrations 528 and 529. Every pair at or above
#             `store_floor`, plus every merge and band pair whatever it scored, is UPSERTed
#             into autodedup.pairs (probes, evidence-family bitmask, the PRESENT features
#             only, score, zone, the deciding reason, guard veto, cluster key); the
#             generation's clusters, members and refused unions are then rebuilt WHOLE in ONE
#             transaction - deleted and re-inserted - because union-find reassigns cluster
#             identities every pass and an upsert alone would leave yesterday's members on
#             today's clusters.
#             Operator `must_not_link` rows are read back FIRST and bind this pass's
#             clustering, so a "different" verdict sticks. args: export_run (the artifact run
#             id), cohort (a local artifact path instead of a download), settings (a
#             settings row by name, e.g. w31), model (a model by name, e.g. w6_gold, default
#             the hand prior), generation (the label the UI filters on, default g1)
#             and store_floor (override the settings dial). Writes out/run.json (the full
#             engine summary), out/pairs.jsonl.gz, out/clusters.json and out/score.json.
#             It costs nothing but GitHub minutes and database time.
#
#   labels  - READS the operator's own rulings, writes nothing. Exports every explicit pair
#             verdict in autodedup.verdicts plus every member pair of a group whose latest
#             cluster-grain verdict is `same` (an explicit verdict on a pair always wins over
#             the group that implies it) as out/operator_labels.jsonl, one row per pair with
#             the verdict, the relation, the operator's note and
#             reason chips verbatim, who decided it and when, and the engine's view of that
#             pair at read time (score, zone, decision, cluster key) or null where the engine
#             never stored it - SCOPED TO THE GENERATION asked for, since autodedup.pairs
#             keeps every pass ever scored and an older model's zone is not this one's. An
#             implied label also carries `sample_rank`: where its group sat in the seeded
#             random order the validation UI serves, so the unbiased sample the precision
#             numbers are measured on is reproducible from the file. out/must_not_link.jsonl carries the permanent operator
#             negatives, which are an INPUT to the next generation's clustering. The operator
#             is the TOP label tier - above gold - so `harness evaluate` reads this export
#             directory as its rulings and `harness fit` reads it with --operator-labels,
#             instead of an ad-hoc query nobody can re-run the same way twice. Since migration 564 (E299) a pair ruling a Browse
#             merge wrote leaves as source `browse_merge` with its merge_group_id, and
#             out/operator_merges.jsonl carries the operator's Browse merges at GROUP grain
#             from autodedup.operator_merges (never property_merge_events): every member with
#             its origin side, where it sits today and the export block it lives in, and every
#             pair with its standing. Empty until 564 is applied. out/must_link.jsonl carries the pairs
#             whose NEWEST pair ruling is `same` (E910): the must-links every clustering
#             obeys, for `harness run --must-link`. Every statement is a SELECT.
#
#   rt_equivalence - READS ONLY, and writes NOTHING - not a `public` row, not an `autodedup`
#             row, not a ledger row (K35). `harness run` is the lane's own pass (SW1), so
#             code-path identity holds by construction; what it cannot see is the STORE, where
#             this lane's shipped defects lived (a live pass that issued ZERO K-C, a re-seed
#             that left 15,923 pairs of a superseded scorer behind, a score column that could
#             not carry the number clustering ranks on). So this mode diffs the live
#             generation against a harness run of its export - `run=<directory>` or
#             `score_run=<the GitHub run id of a score dispatch, whose artifact IS one>` - and
#             ATTRIBUTES every difference to a named cause (E119), failing only on the ones
#             nobody can name and on DEFECTS (E120: `store_write_asymmetry`, `clock_anchor`,
#             `store_score_precision`).
#             * Shared pairs that differ, by which FEATURES moved: `drifted_since_export`,
#               `calibration_cohort` (the lane calibrates on rt_scope_ids, the harness on the
#               export cohort), `clock_anchor`, `evidence_hold` (E918: the live lane HOLDS the
#               run's own merge in the band for complete photo evidence, inside the 48 h cap)
#               - and `unexplained`.
#             * One-sided pairs, per side: `scope`, `not_in_live_store` (fails: the build is
#               not finished), `arrival_after_export` (read against the run's cohort artifact
#               and cut at its own exported_at), `store_floor`, `retention`, `unexplained`.
#             * Clusters by connected COMPONENT: `arrival`, `evidence_hold`, `upstream_pair`
#               or `unexplained` (the same edges partitioned differently).
#             args: generation (default rt), run or score_run (exactly one), tol (default
#             1e-6, never finer than the score column's own resolution).
#             `out/rt_equivalence.json` is the deliverable and it carries the verdict.
#
#   rt_seed - READS `public`, WRITES schema `autodedup` only. (Re)builds THE real-time lane's
#             generation (`rt`) from the database (A10, E912): walks every block of the scope
#             (`rt_scope`, else the row the last seed wrote, else the trial blocks), cuts the
#             calibration's cohort statistics and the pHash population over what those blocks
#             hold - read through the lane's own fact reader, and the population is the
#             export's aggregate over public.images - starts the cursors at TODAY and opens
#             the build phase, so every in-scope listing arrives through the worker's passes.
#             args: settings and model (BOTH REQUIRED and NAMED, e.g.
#             settings=w29,model=w6_gold; settings=default,model=prior are the uncalibrated
#             ones - a generation is scored by one scorer and the lane will not pick it for
#             you, E90a), rt_scope, fresh. A seeded generation is rebuilt only with
#             `fresh=true`, which empties it first inside the same transaction (pairs,
#             clusters, members, conflicts, fingerprints, postings, census cells, scope
#             snapshot, scan and retirement ledgers, cursors) - never a verdict, a
#             must-not-link, another generation, a `public` table or a production merge. The
#             seed takes the lane's lease (`autodedup.rt_lease`) and refuses, writing nothing,
#             while a pass holds it: set app_settings.realtime_autodedup_interval_seconds to 0
#             first. It writes rt_seed_version:rt (the lane reconciles, and the review pages
#             default to rt, only under the seed version this build carries, once the build
#             phase ends) and resets the pass rate. The calibration re-cuts ITSELF afterwards,
#             in the worker's pass, whenever the share of photographs whose population it can
#             measure falls below 0.85.
#
#             The real-time PASS is not a mode (E914): the always-on worker's `autodedup` lane
#             runs it, decides, groups and RECONCILES production inside the scope row (A9),
#             and its interval (0 = stop) is its only switch. The GitHub schedule and its
#             repository variable are gone.
#
#   record  - WRITES ONE LEDGER ROW, nothing else. Files a finished `autodedup.iterations`
#             row from its arguments, for work that happened outside a lane run (a migration
#             applied by apply_migration.yml, an operator review session, a wave that closed
#             before the ledger existed) so the /autodedup/progress page is not missing it.
#             `id=<n>` CORRECTS an existing row instead of filing a new one: only the fields
#             named in the same args move (title, status, approach, tools, cost_usd, notes),
#             everything else keeps what it had, and a status of done or failed re-stamps
#             finished_at so a pass that died `running` stops reading as still in flight. It
#             refuses to change `wave` - a row's wave is its identity on the progress page,
#             so a mis-waved entry is a new row, not an edit - and refuses an id no row
#             carries (exit 2, nothing written) rather than reporting a green run that
#             changed nothing. This run does NOT add a ledger row of its own.
#
#   apply   - A1. DRY RUN BY DEFAULT: plans one generation's groups into production merges and
#             writes ONLY autodedup.applied_merges (migration 558) plus out/apply.json. Per
#             group it names the survivor (the one asset-linked property if exactly one is
#             linked; else the property with the most listings, a tie going to the oldest
#             first_seen_at, then the lowest id) and the properties that would retire into it,
#             or records why the group is refused. Every check reads EVERY listing the merge
#             would put on the survivor, not only the members: a member with no property yet,
#             a property not active, an operator negative (a pair verdict or must-not-link
#             with both sides in it, a group verdict with its whole set in it), mixed deal
#             types or incompatible categories (the chokepoint's own helper), a listing
#             outside the scope (inside = LOCATED in a scope block by its live listing_location
#             obec_kod / cast_obce_kod, never the engine's block key; out-of-scope groups are
#             counted per reason in the summary), two properties the operator asset-linked
#             (asset_linked_units), a property the engine split across two groups, a property
#             carrying a listing no group holds (unless this engine already merged it there
#             with a member), a chokepoint refusal on an earlier run, listings of an engine
#             merge the operator took apart, or a property this engine merged once that is
#             active again. Group size is capped by the engine alone, when it builds the
#             group. A group already on one property that an operator negative covers is
#             REPORTED (ruled_different_after_merge, with the unapply args when the engine
#             made that merge), never acted on. The real-time generation (`rt`) may be
#             PLANNED by a dry run (G3's prediction of the lane's first reconcile) and is never
#             applied from here: the worker's lane reconciles it itself, under its lease (A9);
#             that dry run holds the lease too, so no pass moves the plan under it.
#             `dry_run=0` is refused while realtime_autodedup_interval_seconds is above 0 (the
#             lane would race it), takes that same lease (one writer) and merges for real through
#             toolkit.property_identity.merge_properties (source 'autodedup', ONE merge group
#             per engine group) ONLY inside app_settings.autodedup_apply_scope, the ONE
#             rollout control (seeded by migration 558 with no area, edited on /settings),
#             which must ITSELF name category_types and an area (blocks, listing_ids or
#             all_blocks=true; a dispatch cannot supply them) - re-read before every group, so
#             emptying its area stops a run between two groups. Inside each group's own
#             transaction the properties are locked and every check runs again over the locked
#             rows; a change since the plan skips the group. A crash mid-run still writes
#             out/apply.json and the step summary with what DID merge. An empty dry_run= is a
#             dry run. The run's own scope args can NARROW that row, never widen it; on a dry
#             run they replace it key by key. At most max_clusters_per_run groups per run
#             (default 200), in cluster_key order.
#             `retire_legacy=1` (TEMPORARY, sprint A2, kept until W8) first undoes, in the same
#             dispatch and under the same dry_run, the old engine's intact merges
#             (property_merge_events source 'auto') whose adverts ALL sit inside the scope's
#             blocks AND all carry one of its category_types - or whose merge CREATED a
#             sale/rental mix (retired:mixed_deal_type whatever the scope names) - newest first,
#             one transaction per group, as detach_listing loops stamped
#             undone_by='autodedup-legacy-retire:<run>' that write no ruling, pass after pass
#             until no newly intact group appears (a chain R1 -> S -> T; at most 10 passes, then
#             it stops and says so). It is refused before anything moves with listing_ids (it
#             reads blocks only) and for a generation with no proposed group inside the scope.
#             Every other group touching the area is reported, never touched: straddling,
#             outside_scope_categories, operator_ruled_same (the undo would separate an
#             operator "same" pair), operator_ruled_different (it would newly join a pair the
#             operator ruled apart; machine guards do not count), engine_agrees_out_of_scope
#             (every advert sits in ONE engine group this run may not merge - not proposed, or
#             cut by the scope's edge - so undoing it would split what the engine calls one
#             property; left for W6, reported with that group and why), operator_split (the
#             operator already took an advert of it back), built_on, children_moved,
#             survivor_merged_on, listing_gone. A group the engine itself splits (different
#             engine groups, or ungrouped adverts) is undone. Engine groups count only when this run may
#             merge them (proposed, inside the scope); the others touching the retire set are
#             counted apart. max_clusters_per_run caps only the engine's merges: live, undone
#             groups whose engine group it deferred are counted and a re-dispatch merges them;
#             a dry run predicts the deferral. It reads the scope's area once per dispatch and
#             drives every later read from those listing ids through indexes; the summary shows
#             each read's wall time (timings). Writes out/apply/legacy_retire.json and a step
#             summary section; a dry run writes nothing.
#
#   unapply - A1. DRY RUN BY DEFAULT: lists every live merge group a generation, an apply run
#             or a lane pass (run=, e.g. run=rt:<holder>) or a time window (since= / until=)
#             applied, newest first. The brake on the lane: interval 0, then this. `dry_run=0`
#             is refused while realtime_autodedup_interval_seconds is above 0 (the lane would
#             re-merge what it undoes), takes the lane's lease (one writer) and undoes them in
#             that order and marks them
#             undone in
#             autodedup.applied_merges; `cluster_key=` (with generation=) undoes one group.
#             NOT gated by the scope - undo is the way back - and an undone group may merge
#             again on a later apply. A group a later engine merge still builds on (more
#             listings merged onto its survivor, or its survivor retired) is skipped and names
#             the merge to undo first; a group taken apart outside the engine (its survivor
#             merged on by another merge, or nothing of it left to move back) is skipped
#             naming nothing - the dry run reports each group as the live run would treat it;
#             a group the operator already undid is noted as undone by someone else, and its
#             listings stay apart in every later generation's merges.
#
# Every other mode writes its own ledger row automatically - `running` when it starts, a
# terminal status plus its summary, metrics and this run's URL when it ends. A database
# without migration 528 costs the row, never the run.
#
# `args` is a free-form `k=v,k=v` string each mode parses for itself. census accepts
# min_n, max_n, top, detail_top, timeout_s, pin_share_min, probes and hash_share_min;
# probes accepts timeout_s and source; export accepts blocks, timeout_s, phash_timeout_s,
# batch, clip_model and negctl_max (block overrides are SPACE-separated, e.g.
# `blocks=town:563510 quarter:490245`, because the comma already separates k=v pairs);
# record accepts wave, title, status, approach, tools, notes, cost_usd and run_id, or
# id=<n> plus any of title, status, approach, tools, cost_usd and notes to correct that row
# (`tools` is a SEMICOLON or SLASH list - the comma already separates k=v pairs and this
# workflow's charset check rejects `;`, so a dispatched entry writes `a/b/c`); score accepts
# export_run, cohort, settings, model, generation and store_floor; labels accepts generation (which generation's clusters imply
# pair labels, default g4), max_members (the cap on a confirmed group's size before
# its pairs are skipped rather than flooding the label set, default 12),
# sample_seed (the seed the UI's unbiased group order ran under, default v1, which is
# what each implied label's `sample_rank` is a rank UNDER) and timeout_ms; rt_seed accepts
# settings (required), model (required), rt_scope, fresh and release_lease; rt_equivalence accepts
# generation (default rt), run or score_run (exactly one) and tol (the score tolerance,
# default 1e-6); apply accepts generation (REQUIRED),
# dry_run (1, the default, or
# 0), retire_legacy (0, the default, or 1) and the scope fields category_types, blocks (SPACE-separated, e.g. `blocks=town:563510
# quarter:490245`), listing_ids (SPACE-separated), all_blocks and max_clusters_per_run -
# separate args, not one JSON `scope=`, because this workflow's charset check refuses braces
# and quotes; unapply accepts dry_run and at least one of generation (with cluster_key), run
# and since / until (ISO times, e.g. `since=2026-09-25T08:00Z`). rt_seed, apply and unapply
# also accept release_lease=<holder>: a refusal over autodedup.rt_lease names its holder, and
# when that writer is dead (its job ended, its worker restarted) this ends ITS lease first -
# only that holder's; any other is refused.
#
# Every mode costs nothing but GitHub minutes and database time. out/ is uploaded on every
# outcome; out/summary.json is written even when the run fails.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Which lane mode to run (validated in Python). census = the read-only region census; probes = the corpus-wide probes; export = the gzipped cohort artifact; score = one engine pass persisted into schema autodedup; labels = the operator's own verdicts as a label artifact; rt_equivalence = the live store against a harness run; record = one retroactive progress-ledger row, or with id=<n> a correction to an existing one; apply = plan (dry_run=1, default) or write (dry_run=0, inside the scope row) one generation's production merges; unapply = undo them."
        required: true
        default: "census"
        type: string
      args:
        description: "Mode arguments as k=v,k=v — e.g. min_n=800,max_n=8000,top=60,detail_top=12 or export_run=123,settings=w31,model=w6_gold,generation=g16. A record correction is id=12,cost_usd=3.10,status=done."
        required: false
        default: ""
        type: string

concurrency:
  group: autodedup
  cancel-in-progress: false

jobs:
  lane:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
      # `score` and `rt_equivalence` download a previous run's artifact with `gh run download`.
      actions: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Every input travels via env (never `${{ }}` interpolated into a shell) and is
      # charset-checked before it reaches argv. `mode` is only charset-checked here; the
      # registry in autodedup/lane.py is what decides whether it exists. The checked value is
      # re-exported as MODE_SLUG for the artifact name: `mode` is a free-form string, so
      # naming the artifact from the raw input would let an invalid mode fail this step and
      # then fail the always()-upload on an illegal artifact name, burying the real error.
      - name: Validate inputs
        env:
          MODE: ${{ inputs.mode }}
          ARGS: ${{ inputs.args }}
        run: |
          set -euo pipefail
          case "${MODE:-census}" in
            ''|*[!a-z0-9_-]*) echo "::error::mode must be lowercase letters, digits, _ or -"; exit 1 ;;
          esac
          case "${ARGS:-}" in
            *[!a-zA-Z0-9_=,.:/\ -]*) echo "::error::args may only contain letters digits _ = , . : / - and space"; exit 1 ;;
          esac
          echo "MODE_SLUG=${MODE:-census}" >> "$GITHUB_ENV"

      - name: Install
        run: pip install -e .

      - name: Run
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_SESSION_URL: ${{ secrets.SUPABASE_DB_SESSION_URL }}
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
          ARGS: ${{ inputs.args }}
        run: |
          set -euo pipefail
          mkdir -p out
          python -m autodedup.lane --mode "${MODE:-census}" --args "${ARGS:-}" --out out/

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autodedup-${{ env.MODE_SLUG }}-${{ github.run_id }}
          path: out/
          retention-days: 30
          if-no-files-found: ignore
