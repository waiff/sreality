name: "AUTODEDUP: engine lane"

# The lane for the autonomous dedup engine programme — one dispatch-only entry point
# (`python -m autodedup.lane`) whose `mode` input selects what it does. Isolated from the
# dedup_sim simulation lane: new package, new workflow, nothing shared. `mode` is validated
# in Python rather than as a YAML choice list, so adding a mode needs no workflow edit.
#
#   census  — READS ONLY. Counts ALL-TIME listings (active + delisted) per region block at
#             two grains (town = obec_kod, quarter = cast_obce_kod): portal breadth, category
#             and deal-type spread, disposition/area/floor/broker coverage, location
#             precision, image / pHash / CLIP coverage, shared-pin share, and the raw
#             in-block pair count under a COARSE block x category key - an upper bound on any
#             finer blocking the engine adopts, not a figure comparable to a live lane. Prints
#             a ranked table and writes out/census.json. This is how the trial region is
#             chosen. It also runs four PROBES per shortlisted block - per-portal
#             image/pHash/CLIP coverage, the same-source re-post base rate, address-level
#             developer density and shared-image density - printed as a second table and
#             attached to each block in census.json. `probes=0` turns them off.
#
#   probes  - READS ONLY. The corpus-wide measurements that do not belong to any one block
#             and so are paid for once, not once per block: the ingest rate (listings first
#             seen in the last 1 and 7 days, by source, the L every monthly cost number
#             scales with) and one portal's location posture (granularity histogram plus pin
#             coverage, `source=` picking the portal, default remax). Prints two small tables
#             and writes out/probes.json.
#
#   export  - READS ONLY. Dumps the trial cohort - two district towns, one Praha quarter and
#             the assembled negative control (Praha address points carrying at least three
#             listings across more than one floor, whole groups largest-first up to
#             negctl_max, 800 by default) - as ONE gzipped JSONL artifact,
#             out/cohort.jsonl.gz: a meta line, then one record per listing (attributes,
#             scrubbed description, location, hashed broker key, price-change path from the
#             snapshots), then one per image (storage path, pHash with its corpus-wide
#             population, the CLIP vector as base64 float16, room tags - the logical tag is
#             a ROOM TYPE, its family comes from toolkit.room_taxonomy). No personal data
#             leaves: broker names, phones and e-mails are never written, only a salted
#             hash, and descriptions are scrubbed of Czech phone, e-mail and name patterns
#             first. That artifact is what makes every later wave free - blocking, features,
#             model fitting and clustering all run locally against the file instead of the
#             database. The file is renamed onto its final name only after the stream closes
#             cleanly, so a failed run uploads summary.json and no artifact rather than a
#             plausible-looking partial one. The one statement that can blow its budget is
#             the corpus-wide pHash population (no index on images.phash, and ruling D8
#             forbids adding one): when it times out the run still ships, every `pop` is
#             written null - UNKNOWN, not zero - and meta carries phash_pop_ok=false plus
#             the error.
#             NOTE the negative control here is the geographic draw this wave was built to,
#             not ruling D1's verbatim label over blocks 1-3 (whose second arm is a dHash on
#             >= 5 distinct listings); that divergence is open and needs a ruling line in
#             PROGRAM.md section 14 before W1 closes.
#
#   judge   - THE ONE PAID MODE. Downloads a finished `export` run's cohort artifact
#             (`gh run download <export_run> -n autodedup-export-<export_run>`, which is why
#             this job asks for `actions: read` and the step is handed GH_TOKEN), re-runs the
#             whole engine over it in-process, draws a DETERMINISTIC stratified sample of
#             pairs - zone x deciding layer (certificate or model) x cohort block x same/cross
#             portal, with the catalogue-only pairs pulled out whole - and puts each pair to
#             the LLM judge for a four-way verdict (same_property / different_property /
#             same_building_different_unit / insufficient_evidence) through one forced tool.
#             `tier` picks what is asked: smoke = 10 text + 10 vision calls, the first-live
#             verification of paths this repo has never run; text = gpt-5.6-luna on the whole
#             sample; vision = gpt-5-mini with 4+4 images at 768px; gold = three deep votes
#             (two gpt-5-mini with different image selections, one qwen3-vl-30b-a3b-instruct
#             for genuine model-family independence) aggregated into one label. NO personal
#             data crosses the wire: only same_broker / same_firm booleans, and descriptions
#             are re-scrubbed of Czech contact patterns and truncated before they are sent.
#             `max_usd` is REQUIRED and the lane refuses to start without it; it must sit
#             between one pair of the chosen tier and D2's $25 hard per-run cap, so neither a
#             budget too small to launch a single call nor a fat-fingered extra zero starts a
#             pass. The budget binds in the worker BEFORE each call (per CALL, not per pair)
#             and HOLDS its estimate until that call settles, so the cap cannot be overshot by
#             the calls already in flight. The summary reports done / failed / skipped_budget
#             / skipped_fatal / billed_unparsed / persist_failed / spent_usd - a run that drew
#             a sample and read nothing back, hit a dead key, or stored none of what it paid
#             for EXITS NON-ZERO rather than looking green. A gold pair writes a row only when
#             all three votes land (short plans count `gold_incomplete`; pairs a budget stop
#             never reached count `gold_unstarted`, which is not money lost).
#             MIND `n`: the per-stratum floor of 8 is honoured before the target, so a wide
#             cohort DRAWS MORE than `n` - the first real pass turned n=30 into 354 pairs over
#             47 strata. `sample_inflated_by_floor`, `est_cost_usd_for_draw` and
#             `budget_covers_draw` say so at the top of the summary, before a call is made.
#             `dry_run=1` builds every prompt,
#             counts the tokens and images, prints the estimate and calls nothing. Verdicts
#             land in `autodedup.judgements` and in out/judgements.jsonl; the sample, the
#             engine run and the spend summary land beside them.
#             `tier=oss` is the SAME question put to an open-source vision model this program
#             RENTS BY THE HOUR instead of buying by the token - the vision prompt to the
#             character, the same 4+4 images, the same deterministic draw at the same seed, so
#             the paid verdicts pay for themselves twice: once as the programme's labels and
#             once as the yardstick the free arm is measured against. The lane launches a
#             RunPod GPU pod (`oss_model`, default Qwen/Qwen2.5-VL-7B-Instruct; `oss_gpu` pins
#             an ordered list of GPU types and `oss_cloud` the clouds to walk, otherwise the
#             pod module picks community boxes at its own default cap), waits for it to serve, smokes it,
#             judges with `workers` in parallel and TERMINATES IT IN A FINALLY - on a clean
#             pass, a budget stop, a dead provider or a crash alike - then VERIFIES the pod is
#             gone with a second (idempotent) delete, so a teardown that failed reaches the
#             summary as `pod_terminate_failed` instead of one ERROR line in this log. The one
#             path a `finally` cannot cover is the job being killed from OUTSIDE - a cancel or
#             the `timeout-minutes` cap - which leaves the pod billing until someone terminates
#             it in the RunPod console (it is named `autodedup-oss-judge`). That is what the
#             `if: always()` reap step is for: the lane writes out/pod.json the instant a pod
#             exists and deletes it once the pod is CONFIRMED gone, so the step has something
#             to terminate exactly when a `finally` did not run. `always()` covers a cancel, so
#             the console is now the second line of defence, not the first. Needs migrations 530 (the tier vocabulary) and 531 (the
#             `llm_calls` provider vocabulary - without it every oss call 23514s at the
#             RECORDING step, after the GPU time is already paid for), plus RUNPOD_API_KEY; a
#             GATED `oss_model` (meta-llama/...) additionally needs HF_TOKEN, which is passed
#             through when set and is otherwise unused. The money is different in kind: a pod bills
#             by WALL CLOCK, so `max_usd` caps the POD's bill (checked before every call, with
#             one pair's margin, against the clock rather than a token estimate), each verdict
#             is stored with a NULL cost while the pod runs - unknown, not free - and the bill
#             is divided over what the pod actually produced once it is gone (`pod_cost_usd`,
#             `cost_per_pair_usd`, `pod_hours`, `pod_wall_s_per_pair`, `usd_per_hr`, `pod_id`, `gpu` in
#             the summary; `spent_usd_source` reads `pod`, never `llm_calls`, which records $0
#             for a pod call because there is no per-token price to record).
#             `pairs_from=gold` restricts the draw to pairs a gold pass has ALREADY ruled on,
#             which is what makes the comparison set maximal per dollar - a pair with no gold
#             row can be judged for nothing and compared against nothing. The gold rows are
#             read at this run's own `judge_version` unless `gold_version=` names another:
#             a NEW presentation (j2) is measured against the labels an OLD one produced,
#             because the label belongs to the pair and not to the prompt.
#             `pairs_file=<name>` narrows the draw to an EXPLICIT list committed under
#             autodedup/pairs/<name>.json (a JSON list of `[lo, hi]`) - how a targeted pass
#             buys labels for one starved cell, which a stratified draw spends everywhere but.
#             It narrows the POPULATION, not the sample: `n` is still the cost dial. Pairs the
#             engine did not store are reported by id in `pairs_file_missing` rather than
#             quietly shrinking the pass.
#             ONE oss MODEL PER judge_version. The store keys a judgement on (pair,
#             judge_version, tier) and not on the model, so a second `oss_model` at the same
#             `settings=<name>` / `model=<name>` pick a row under autodedup/settings/ and a fitted
#             model under autodedup/models/ so the draw reflects that engine's zones (absent =
#             defaults + hand prior); `judge_version=` keys the per-pair cache.
#             version is skipped as cached (no pod rented, an EMPTY judgements.jsonl, exit 0)
#             or, with `refresh=1`, OVERWRITES the first model's rows. To compare two open
#             models, give the second its own version: `judge_version=<v>-<model-slug>`.
#             `python3 -m autodedup.compare --gold <gold judgements.jsonl> --arm
#             name=<judgements.jsonl> [--arm ...] --out <dir>` then reports, over the pairs
#             gold saw, each arm's four-way and binary same/not-same agreement with gold (both
#             with Cohen's kappa; insufficient_evidence is EXCLUDED from the binary score and
#             counted, so a timid arm cannot buy agreement by abstaining), the confusion
#             matrix, per-stratum agreement, mean confidence, cost per pair and latency, plus
#             the agreement between the arms themselves - as compare.md and compare.json. It
#             reads files only and costs nothing.
#
#   score   - READS the artifact, WRITES the engine's own schema. Downloads a finished
#             `export` run's cohort artifact (same `gh run download` path as judge, which is
#             why the job asks for `actions: read`), runs the whole engine over it in-process
#             and PERSISTS what it decided into schema autodedup - nothing in public.* is
#             touched and nothing is merged (ruling D4, clusters land with status `proposed`
#             and no property_id). One `autodedup.runs` row wraps the pass: `running` from
#             BEFORE the engine starts - the long phase, and the one that dies - then
#             `success` or `failed` plus the scrubbed error text at the end, with the settings
#             + model + generation digest as its fingerprint. Needs migrations 528 and 529. Every pair at or above
#             `store_floor`, plus every merge and band pair whatever it scored, is UPSERTed
#             into autodedup.pairs (probes, evidence-family bitmask, the PRESENT features
#             only, score, zone, the deciding reason, guard veto, cluster key); the
#             generation's clusters, members and refused unions are then rebuilt WHOLE in ONE
#             transaction - deleted and re-inserted - because union-find reassigns cluster
#             identities every pass and an upsert alone would leave yesterday's members on
#             today's clusters.
#             Operator `must_not_link` rows are read back FIRST and bind this pass's
#             clustering, so a "different" verdict sticks. args: export_run (the artifact run
#             id), cohort (a local artifact path instead of a download), settings (a JSON
#             file under autodedup/settings/), model (a model.json under autodedup/models/,
#             default the hand prior), generation (the label the UI filters on, default g1)
#             and store_floor (override the settings dial). Writes out/run.json (the full
#             engine summary), out/pairs.jsonl.gz, out/clusters.json and out/score.json.
#             It costs nothing but GitHub minutes and database time.
#
#   labels  - READS the operator's own rulings, writes nothing. Exports every explicit pair
#             verdict in autodedup.verdicts plus every member pair of a group whose latest
#             cluster-grain verdict is `same` (an explicit verdict on a pair always wins over
#             the group that implies it) as out/operator_labels.jsonl, one row per pair with
#             the verdict, the relation in the judge's own vocabulary, the operator's note and
#             reason chips verbatim, who decided it and when, and the engine's view of that
#             pair at read time (score, zone, decision, cluster key) or null where the engine
#             never stored it - SCOPED TO THE GENERATION asked for, since autodedup.pairs
#             keeps every pass ever scored and an older model's zone is not this one's. An
#             implied label also carries `sample_rank`: where its group sat in the seeded
#             random order the validation UI serves, so the unbiased sample the precision
#             numbers are measured on is reproducible from the file. out/must_not_link.jsonl carries the permanent operator
#             negatives, which are an INPUT to the next generation's clustering. The operator
#             is the TOP label tier - above gold - so `harness fit` and `harness evaluate`
#             read these files with --operator-labels instead of an ad-hoc query nobody can
#             re-run the same way twice. Every statement is a SELECT.
#
#   rt_parity - READS ONLY, and writes NOTHING - not a `public` row, not an `autodedup` row,
#             not even a ledger row. The instrument that asks whether the real-time lane's
#             FACTS are the batch engine's facts. The replay-equivalence proof feeds the
#             incremental path from an export ARTIFACT while the live lane reads through
#             `SqlFacts`, so a difference between those two readings is invisible to it - and
#             the first live pass issued zero K-C certificates against the batch pass's 1,771.
#             For a seeded, source-stratified sample of listings present both in an export
#             run's cohort artifact and in the live database (`export_run=<run id>` or
#             `cohort=<path>`, `n=200`, `seed=1`), it builds each Listing and its gallery
#             twice - once from the artifact, once through SqlFacts - and diffs them field by
#             field, reporting a listing whose content changed after the export as DRIFT
#             rather than as a defect. It then scores `pairs=400` sampled pairs from both fact
#             sets under one settings/model/calibration and reports every feature, score, zone
#             and certificate that moved. out/parity.json is the deliverable. What it found:
#             `autodedup.phash_pop` held ZERO rows and nothing in the repository wrote it, so
#             every image read pop=0, every catalog_ratio went absent and K-C was structurally
#             unreachable - 3 of 3 sampled K-C lost with the model held constant. The GATE that
#             now stops that shipping again is not this mode: `rt_seed` writes a per-listing
#             fact baseline and every scheduled pass re-checks a slice of it before it writes
#             anything (E91). This mode remains the field-by-field report you run when the gate
#             refuses. `population=artifact` makes the live side read the cohort's own pHash
#             counts instead of the frozen table — the exact rows `rt_seed` writes — so a
#             seed's effect on the certificates is measurable read-only, before seeding.
#
#   rt_equivalence - READS ONLY, and writes NOTHING - not a `public` row, not an `autodedup`
#             row, not a ledger row. The check the replay-equivalence proof cannot give.
#             Replay feeds the incremental path from an export ARTIFACT, in one process, from
#             an EMPTY store: it proves the MECHANISM and has proved it four times (44,724 of
#             44,724 pairs, 849 of 849 clusters). What it cannot see is what a real generation
#             HOLDS - and both of this lane's shipped defects lived exactly there (a live pass
#             that issued ZERO K-C against the batch generation's 1,771, and a re-seed that
#             left 15,923 pairs of a superseded scorer where they were). So this mode reads
#             BOTH stores. Given the live generation and `batch=<generation>` scored on the
#             SAME export under the same settings and model, inside the live generation's own
#             scope, it ATTRIBUTES every difference to a named cause (E119) and fails only on
#             the ones nobody can name and on DEFECTS (E120).
#             * Defects make the comparison itself lie, so each one fails on its own:
#               `store_write_asymmetry` (a side whose `decision` strings name a certificate
#               while `pairs.certificate` holds none - `score_lane` did not write the column
#               until W9m, so 3,462 shared pairs read 'K-C' against NULL), `clock_anchor` (the
#               two generations disagree about `live_window_from_sighting`, read from
#               `rt_calibration` and from the batch pass's own `autodedup.runs` row) and
#               `store_score_precision` (`pairs.score` cannot hold the number `edge_rank`
#               ranks on - migration 541).
#             * Shared pairs that differ are attributed by reading which FEATURES moved:
#               `drifted_since_export` (the clock features moved AND the live value is the one
#               that matches `public.listings` as it stands now, recomputed through the
#               engine's own `features.clock_features`), `calibration_cohort` (the
#               corpus-frequency features moved, which two differently-cut calibrations always
#               do), `clock_anchor`, `store_write_asymmetry` - and `unexplained`.
#             * One-sided pairs keep their causes - `scope` (the batch cohort is wider),
#               `not_in_live_store` (a listing the build has not reached, which FAILS the
#               verdict because a mid-build comparison reads as a disagreement),
#               `arrival_after_export`, `store_floor`, `retention`, `unexplained` - now
#               reported PER SIDE as well as summed.
#             * Clusters are compared by connected COMPONENT: `arrival` (a listing the batch
#               cohort never had), `upstream_pair` (the two sides hold different merge edges,
#               so the pair grain already accounted for it) or `unexplained`, which is a
#               component both sides hold the same edges in and partition differently.
#             The score tolerance is never finer than the store's own resolution (`tol`,
#             default 1e-6, raised to 32 units in the score column's last place while that is
#             coarser). `out/rt_equivalence.json` is the deliverable and it carries a verdict:
#             ok only when there are no defects, nothing is unexplained at pair, one-sided or
#             cluster-component grain, and the build is finished.
#
#   rt_seed - READS the artifact and `public`, WRITES schema `autodedup` only. Cuts a
#             generation's FROZEN calibration from an export run's cohort artifact, starts its
#             cursors at TODAY, writes the scope it seeded, materialises the calibration's own
#             pHash population into `autodedup.phash_pop` (the number the export already
#             measured - no scan of public.images), and cuts the parity baseline the schedule
#             is gated on. args: export_run or artifact, settings and model (BOTH REQUIRED and
#             NAMED, e.g. settings=w8,model=w6_gold, or settings=default,model=prior for the
#             uncalibrated ones - a generation is scored by one scorer and the lane will not
#             pick it for you, E90a), generation, rt_scope, backfill, reseed, parity_n,
#             fresh and rt_bootstrap.
#             It is deliberately NOT behind the dark switch: seeding is the step before it.
#             Every seed takes the real-time lane's lease (`autodedup.rt_lease`) for its
#             transaction and refuses, writing nothing, while a pass holds it - the worker's
#             `autodedup` lane ignores the repository variable, so stop both callers with
#             `autodedup.settings` `realtime_enabled = false` before seeding.
#             `fresh=true` (only valid with `reseed=true`) is the CLEAN RESET: inside the same
#             transaction, before anything is written, it deletes THIS generation's pairs,
#             clusters, cluster members, cluster conflicts, fingerprints, postings, census
#             cells, scope snapshot, scan and retirement ledgers and cursors (keeping the
#             seed's own lease) - and nothing else. Operator verdicts, must-not-links, judge
#             verdicts, every other generation and every `public` table are untouched, and the
#             summary reports the rows removed per table. Without it a re-seed re-cuts the
#             calibration and leaves every pair the generation already holds in place, which
#             is how 15,923 rows scored by a superseded scorer survived the 2026-09-20 re-seed.
#             `rt_bootstrap=true` (which requires `backfill=false`) persists the BUILD PHASE
#             as a settings row. A backfilled seed writes the fingerprints and not one pair,
#             so a seeded generation never holds the pairs among the listings that already
#             existed; with `backfill=false` every in-scope listing is an ARRIVAL, which is
#             the one path the replay proof covers. During the phase the entrant claim is the
#             whole `max_listings` rather than a seventh of it and every never-walked scope
#             block is walked in the SAME pass (the cadence is suspended, the rolling-day scan
#             cap is not); the phase ends by itself in the pass that empties the backlog.
#
#   town    - READS ONLY, writes nothing (not even a ledger row). Asks whether ONE property
#             is ever recorded under two different TOWNS, corpus-wide, because the trial
#             cohort is SELECTED by `listing_location.obec_kod` and cannot answer it: when
#             two portals disagree about the town, the second advert falls outside the scope
#             and the pair does not exist for the engine. The probe pages the whole
#             `listings` table (keyset, `id > after`) for bodies whose text may carry an
#             agency order code, extracts the codes with `text_facts.reference_codes`
#             UNCHANGED, keeps E60's population rail (a code on more than 8 listings is a
#             sequence number, not an order key) and drops every pair the rule floor refuses
#             for a non-location reason - so what is left is the population a broker's own
#             statement of identity certifies as ONE unit. Over it, `obec_differ` IS the
#             false-veto rate a different-town veto would pay, measured without a label, a
#             judge or a model; `cast_obce`, `okres` and `kraj` are reported beside it so the
#             KEYING question (which rung of the hierarchy a veto would read) is answered
#             from the same pass. args: batch (5000), max_rows (0 = the whole table),
#             timeout_s (300, per statement), sample (80 cross-town pairs written out for
#             hand reading) and coverage (1 = also report, per portal, how much of the corpus
#             carries a town at all - the denominator E12 needs, since a missing town is
#             never a mismatch). Writes out/town.json. Costs GitHub minutes and one seq scan.
#
#   record  - WRITES ONE LEDGER ROW, nothing else. Files a finished `autodedup.iterations`
#             row from its arguments, for work that happened outside a lane run (a migration
#             applied by apply_migration.yml, an operator review session, a wave that closed
#             before the ledger existed) so the /autodedup/progress page is not missing it.
#             `id=<n>` CORRECTS an existing row instead of filing a new one: only the fields
#             named in the same args move (title, status, approach, tools, cost_usd, notes),
#             everything else keeps what it had, and a status of done or failed re-stamps
#             finished_at so a pass that died `running` stops reading as still in flight. It
#             refuses to change `wave` - a row's wave is its identity on the progress page,
#             so a mis-waved entry is a new row, not an edit - and refuses an id no row
#             carries (exit 2, nothing written) rather than reporting a green run that
#             changed nothing. This run does NOT add a ledger row of its own.
#
#   apply   - A1. DRY RUN BY DEFAULT: plans one generation's groups into production merges and
#             writes ONLY autodedup.applied_merges (migration 558) plus out/apply.json. Per
#             group it names the survivor (the one asset-linked property if exactly one is
#             linked; else the property with the most listings, a tie going to the oldest
#             first_seen_at, then the lowest id) and the properties that would retire into it,
#             or records why the group is refused. Every check reads EVERY listing the merge
#             would put on the survivor, not only the members: a member with no property yet,
#             a property not active, an operator negative (a pair verdict or must-not-link
#             with both sides in it, a group verdict with its whole set in it), mixed deal
#             types or incompatible categories (the chokepoint's own helper), a listing
#             outside the scope, two properties the operator asset-linked
#             (asset_linked_units), a property the engine split across two groups, a property
#             carrying a listing no group holds (unless this engine already merged it there
#             with a member), a chokepoint refusal on an earlier run, listings of an engine
#             merge the operator took apart, or a property this engine merged once that is
#             active again. Group size is capped by the engine alone, when it builds the
#             group. A group already on one property that an operator negative covers is
#             REPORTED (ruled_different_after_merge, with the unapply args when the engine
#             made that merge), never acted on. Real-time lane generations (rt...) are
#             refused. `dry_run=0` merges for real through
#             toolkit.property_identity.merge_properties (source 'autodedup', ONE merge group
#             per engine group) ONLY inside app_settings.autodedup_apply_scope, the ONE
#             rollout control (seeded by migration 558 with no area, edited on /settings),
#             which must ITSELF name category_types and an area (blocks, listing_ids or
#             all_blocks=true; a dispatch cannot supply them) - re-read before every group, so
#             emptying its area stops a run between two groups. Inside each group's own
#             transaction the properties are locked and every check runs again over the locked
#             rows; a change since the plan skips the group. A crash mid-run still writes
#             out/apply.json and the step summary with what DID merge. An empty dry_run= is a
#             dry run. The run's own scope args can NARROW that row, never widen it; on a dry
#             run they replace it key by key. At most max_clusters_per_run groups per run
#             (default 200), in cluster_key order.
#             `retire_legacy=1` (TEMPORARY, sprint A2, deleted in W5) first undoes, in the same
#             dispatch and under the same dry_run, the old engine's intact merges
#             (property_merge_events source 'auto') whose adverts ALL sit inside the scope's
#             blocks AND all carry one of its category_types - or whose merge CREATED a
#             sale/rental mix (retired:mixed_deal_type whatever the scope names) - newest first,
#             one transaction per group, as detach_listing loops stamped
#             undone_by='autodedup-legacy-retire:<run>' that write no ruling, pass after pass
#             until no newly intact group appears (a chain R1 -> S -> T). It is refused before
#             anything moves with listing_ids (it reads blocks only) and for a generation with
#             no proposed group inside the scope. Every other group touching the area is
#             reported, never touched: straddling, outside_scope_categories,
#             operator_ruled_same (the undo would separate an operator "same" pair),
#             operator_split (the operator already took an advert of it back), built_on,
#             children_moved, survivor_merged_on, listing_gone; a detach that would land an
#             advert beside one an operator negative keeps it from refuses the group
#             (refused:ruled_different). max_clusters_per_run caps only the engine's merges:
#             undone groups whose engine group it deferred are counted, and a re-dispatch
#             merges them. Writes out/apply/legacy_retire.json (with the engine groups touching
#             the retire set) and a step summary section; a dry run writes nothing.
#
#   unapply - A1. DRY RUN BY DEFAULT: lists every live merge group a generation, an apply run
#             (run=) or a time window (since= / until=) applied, newest first. `dry_run=0`
#             undoes them through unmerge_group in that order and marks them undone in
#             autodedup.applied_merges; `cluster_key=` (with generation=) undoes one group.
#             NOT gated by the scope - undo is the way back - and an undone group may merge
#             again on a later apply. A group a later engine merge still builds on (more
#             listings merged onto its survivor, or its survivor retired) is skipped and names
#             the merge to undo first; a group taken apart outside the engine (its survivor
#             merged on by another merge, or nothing of it left to move back) is skipped
#             naming nothing - the dry run reports each group as the live run would treat it;
#             a group the operator already undid is noted as undone by someone else, and its
#             listings stay apart in every later generation's merges.
#
# Every other mode writes its own ledger row automatically - `running` when it starts, a
# terminal status plus its summary, metrics and this run's URL when it ends. A database
# without migration 528 costs the row, never the run.
#
# `args` is a free-form `k=v,k=v` string each mode parses for itself. town accepts batch,
# max_rows, timeout_s, sample and coverage; census accepts
# min_n, max_n, top, detail_top, timeout_s, pin_share_min, probes and hash_share_min;
# probes accepts timeout_s and source; export accepts blocks, timeout_s, phash_timeout_s,
# batch, clip_model and negctl_max (block overrides are SPACE-separated, e.g.
# `blocks=town:563510 quarter:490245`, because the comma already separates k=v pairs);
# record accepts wave, title, status, approach, tools, notes, cost_usd and run_id, or
# id=<n> plus any of title, status, approach, tools, cost_usd and notes to correct that row
# (`tools` is a SEMICOLON or SLASH list - the comma already separates k=v pairs and this
# workflow's charset check rejects `;`, so a dispatched entry writes `a/b/c`); judge
# accepts export_run, tier, n, max_usd (required), seed, workers, qwen_workers (the
# SECONDARY DashScope arm's own parallelism, default 1 - `workers` is the primary model's
# and it was never the arm being throttled; W6 lost that arm at six and at three workers
# and finished the pass at one), qwen_min_interval_ms (the gap between two calls of that
# arm, default 0), strata (SPACE-separated
# stratum prefixes), judge_version, refresh, cohort (a local artifact path instead of a
# download), dry_run, pairs_from (`gold` restricts the draw to pairs with a gold row),
# pairs_file (an explicit `[lo, hi]` list under autodedup/pairs/) and,
# for `tier=oss`, oss_model (the served model id, default Qwen/Qwen2.5-VL-7B-Instruct),
# oss_gpu (SPACE-separated RunPod GPU types in preference order, e.g. `H100_80GB A100_80GB
# L40S A6000 A40`, treated as a PIN - a pass fails rather than silently renting a 6x dearer
# box - and matched against both the catalog id and the display name with `_` read as a
# space), oss_cloud (SPACE-separated cloud types walked in order, `secure community`;
# default community only, which is where the cheap cards are and where the 80 GB ones are
# not), oss_max_usd_hr (lifts the $1.00/hr default cap, without which no 80 GB card is even
# eligible), oss_min_gpu_gb (raises the 24 GB floor, so a pattern that also matches a
# smaller variant of the same card cannot rent one too small for the weights),
# oss_image (the vLLM image tag - a model architecture newer than the image is a
# rental that boots into a failure), oss_disk_gb (container disk; the weights AND the image
# land on it, so re-do the sum for a bigger model), oss_max_model_len, oss_dtype (`auto` for
# a pre-quantized FP8/AWQ repo, which carries its own compute dtype - forcing bfloat16
# there is a 25-minute rental spent on a refusal), oss_tool_parser (vLLM
# `--tool-call-parser`; the forced tool call is how a verdict comes back at all) and
# oss_s_per_pair (the pre-flight seconds ONE CALL takes, which the
# estimate divides by `workers`; calibrate it from the previous pass's `latency_s_mean`, NOT
# from `pod_wall_s_per_pair`, which is the rental divided by the pairs and is about a
# `workers`th of it); score accepts export_run, cohort, settings, model, generation
# and store_floor; labels accepts generation (which generation's clusters imply
# pair labels, default g4), max_members (the cap on a confirmed group's size before
# its pairs are skipped rather than flooding the label set, default 12),
# sample_seed (the seed the UI's unbiased group order ran under, default v1, which is
# what each implied label's `sample_rank` is a rank UNDER) and timeout_ms; rt_seed accepts
# export_run, artifact, settings (required), model (required), generation, rt_scope, backfill,
# reseed, fresh (only with reseed=true), rt_bootstrap (only with backfill=false) and parity_n;
# rt_parity accepts export_run, cohort, n, pairs, seed, generation, settings, model and
# population (frozen, the default, or artifact); rt_equivalence accepts generation (default
# rt), batch (REQUIRED - the batch generation to compare against) and tol (the score
# tolerance, default 1e-6); apply accepts generation (REQUIRED), dry_run (1, the default, or
# 0), retire_legacy (0, the default, or 1) and the scope fields category_types, blocks (SPACE-separated, e.g. `blocks=town:563510
# quarter:490245`), listing_ids (SPACE-separated), all_blocks and max_clusters_per_run -
# separate args, not one JSON `scope=`, because this workflow's charset check refuses braces
# and quotes; unapply accepts dry_run and at least one of generation (with cluster_key), run
# and since / until (ISO times, e.g. `since=2026-09-25T08:00Z`).
#
# Every mode but `judge` costs nothing but GitHub minutes and database time; `judge` spends
# real money, capped by its own `max_usd`. out/ is uploaded on every outcome; out/summary.json
# is written even when the run fails.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Which lane mode to run (validated in Python). census = the read-only region census; probes = the corpus-wide probes; export = the gzipped cohort artifact; score = one engine pass persisted into schema autodedup; labels = the operator's own verdicts as a label artifact; judge = the paid LLM judge over a sampled engine pass; record = one retroactive progress-ledger row, or with id=<n> a correction to an existing one; apply = plan (dry_run=1, default) or write (dry_run=0, inside the scope row) one generation's production merges; unapply = undo them."
        required: true
        default: "census"
        type: string
      args:
        description: "Mode arguments as k=v,k=v — e.g. min_n=800,max_n=8000,top=60,detail_top=12, export_run=123,tier=text,n=400,max_usd=5 or export_run=123,tier=oss,n=200,max_usd=3,pairs_from=gold. A record correction is id=12,cost_usd=3.10,status=done."
        required: false
        default: ""
        type: string

concurrency:
  group: autodedup
  cancel-in-progress: false

jobs:
  lane:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
      # `judge` downloads a previous run's cohort artifact with `gh run download`.
      actions: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Every input travels via env (never `${{ }}` interpolated into a shell) and is
      # charset-checked before it reaches argv. `mode` is only charset-checked here; the
      # registry in autodedup/lane.py is what decides whether it exists. The checked value is
      # re-exported as MODE_SLUG for the artifact name: `mode` is a free-form string, so
      # naming the artifact from the raw input would let an invalid mode fail this step and
      # then fail the always()-upload on an illegal artifact name, burying the real error.
      - name: Validate inputs
        env:
          MODE: ${{ inputs.mode }}
          ARGS: ${{ inputs.args }}
        run: |
          set -euo pipefail
          case "${MODE:-census}" in
            ''|*[!a-z0-9_-]*) echo "::error::mode must be lowercase letters, digits, _ or -"; exit 1 ;;
          esac
          case "${ARGS:-}" in
            *[!a-zA-Z0-9_=,.:/\ -]*) echo "::error::args may only contain letters digits _ = , . : / - and space"; exit 1 ;;
          esac
          echo "MODE_SLUG=${MODE:-census}" >> "$GITHUB_ENV"

      - name: Install
        run: pip install -e .

      - name: Run
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_SESSION_URL: ${{ secrets.SUPABASE_DB_SESSION_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
          ARGS: ${{ inputs.args }}
        run: |
          set -euo pipefail
          mkdir -p out
          python -m autodedup.lane --mode "${MODE:-census}" --args "${ARGS:-}" --out out/

      - name: Reap a pod a killed job left behind
        if: always()
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: python -m autodedup.oss_pod --reap out/pod.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autodedup-${{ env.MODE_SLUG }}-${{ github.run_id }}
          path: out/
          retention-days: 30
          if-no-files-found: ignore
