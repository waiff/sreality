name: "Jobs: Location claim intake (W1)"

# Deterministic extraction of location claims from `listings.raw_json`, all nine sources
# (design 06-migration-backfill.md §6.2.1). No model, no network, no re-fetch: it reads the
# payloads the scraper already persists and writes `location_claims` (+ observations,
# absences, refetch cohort) with the §6.1.2 licence ladder applied at the INPUT.
#
# Every run first re-projects the contracts from git into `portal_contracts` /
# `portal_contract_entries` (02 §2.1.8: git is the store of record, the tables are its
# deploy-time projection). That is idempotent per (portal, contract_version) and fails
# loudly if a contract file changed without a version bump — which is the point.
#
# The lane REFUSES to run unless the Mapy affected-set inventory (migration 385) is
# TERMINAL AND COMPLETE — a resumable run with status='completed' in the current restart
# epoch, not merely a non-empty `mapy_affected`. A half-built inventory describes a prefix
# of `listings`, and absence from a prefix is exactly the verdict that admits a
# Mapy-derived `carry_forward` coordinate as first-party (06 §6.1.2). It is a W1 INPUT,
# not an output.
#
# A run that hits its budget stamps `outcome='stopped'`, NOT 'ok'. The incremental
# watermark reads 'ok' only, so a budgeted run leaves the floor where it found it and the
# next run resumes from the keyset cursor on the batch row (migration 387). 'ok' means one
# thing: the scan ran out of rows.
#
# Shadow-only: nothing here is read by Browse, the API or the extension. Required secret:
# SUPABASE_DB_URL.

on:
  workflow_dispatch:
    inputs:
      source:
        description: "one portal only (blank = all nine)"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - sreality
          - bezrealitky
          - bazos
          - idnes
          - mmreality
          - remax
          - ceskereality
          - realitymix
          - maxima
      mode:
        description: "full = walk every listing; incremental = only rows seen since the last ok batch"
        required: false
        default: incremental
        type: choice
        options: [incremental, full]
      max_seconds:
        description: "wall-clock budget; stops between batches (blank = none)"
        required: false
        default: ""
        type: string
      batch_size:
        description: "listings per batch (10000-30000; blank = 20000)"
        required: false
        default: ""
        type: string
      dry_run:
        description: "extract and report; write nothing"
        required: false
        default: false
        type: boolean
  schedule:
    # Hourly, incremental. sreality's index walk is hourly, so this keeps the claim layer
    # at most one cycle behind the payloads it mines.
    - cron: "35 * * * *"

concurrency:
  # OUTER, cross-lane: shared with the registry load, the Mapy inventory and the resolve
  # drain so at most ONE heavy location lane runs at a time (2026-08-10 incident: four of
  # them concurrently dropped backends across the shared production instance and killed
  # this lane's 21:47 run plus both hourly crons with "SSL connection has been closed
  # unexpectedly"). See location_registry_load.yml for the full note.
  group: location-batch
  cancel-in-progress: false

jobs:
  intake:
    runs-on: ubuntu-latest
    concurrency:
      # INNER, per-lane: two concurrent intakes would fight over the same watermark and each
      # re-read the other's window. Never cancel in flight: a cancelled batch rolls back
      # whole, but the batch row of a cancelled run stays `running` and needs no repair.
      group: location-claims
      cancel-in-progress: false
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # The [dev] extra is what carries PyYAML, which only the deploy-time contract
      # projection needs; the extractor itself reads the DB projection.
      - name: Install
        run: pip install -e ".[dev]"

      - name: Project the portal contracts from git
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python -m location_data.contracts --load --git-ref "$GITHUB_SHA"

      - name: Run the claim intake
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SOURCE: ${{ inputs.source }}
          MODE: ${{ inputs.mode }}
          MAX_SECONDS: ${{ inputs.max_seconds }}
          BATCH_SIZE: ${{ inputs.batch_size }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS="--mode ${MODE:-incremental}"
          if [ -n "$SOURCE" ]; then ARGS="$ARGS --source $SOURCE"; fi
          if [ -n "$MAX_SECONDS" ]; then ARGS="$ARGS --max-seconds $MAX_SECONDS"; fi
          if [ -n "$BATCH_SIZE" ]; then ARGS="$ARGS --batch-size $BATCH_SIZE"; fi
          if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          # The scheduled run gets a budget under the job timeout so a long pass stops
          # cleanly between batches. It then stamps `stopped` (never `ok`) and the next
          # hour resumes from the keyset cursor on that batch row — the watermark does not
          # move until a scan actually reaches the end of its range.
          if [ -z "$MAX_SECONDS" ] && [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            ARGS="$ARGS --max-seconds 2700"
          fi
          echo "python -m location_data.claims_intake $ARGS"
          python -m location_data.claims_intake $ARGS
