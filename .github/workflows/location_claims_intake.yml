name: "Jobs: Location claim intake"

# THE claim lane (CLAUDE.md rule 25: one store, one lane). Deterministic extraction of
# location claims from BOTH substrates we hold for a listing, all nine portals:
#
#   * `listings.raw_json` plus the class-B legacy columns — the ten payload readers;
#   * the latest stored detail body in `portal_raw_payloads`, fetched from R2 and scoped by
#     the contract's exclusion zones — the fourteen page readers.
#
# No model. TWO HALVES, in this order, both inside one budget (W1-a2):
#
#   * BODIES FIRST — the unmined latest detail bodies of ACTIVE page-portal listings,
#     drained in 1 500-id WINDOWS of `portal_raw_payloads`' primary key, until the backlog
#     is empty or half the budget is gone. The keyset (not the mined-at stamp) is what
#     carries the pass past a body it can never stamp, so a handful of bad objects cannot
#     stall the whole backlog behind them, and the cursor is the WINDOW's max id (W1-a4).
#   * THEN THE CHANGED LISTINGS — a keyset walk of `listing_snapshots.id`, the
#     append-on-content-change log, standing 15 MINUTES BEHIND THE CLOCK: a bigserial id is
#     allocated at INSERT and visible at COMMIT, so a concurrent `write_detail_batch`
#     transaction can land a row below a cursor that has already moved, and a keyset never
#     looks back. A run opens an hour's CHANGE, not every listing the index walks happened
#     to re-sight: the `last_seen_at` watermark it replaces opened ~180 000 listings an
#     hour to re-mine claims that already existed.
#
# A batch's page bodies are EXTRACTED ACROSS PROCESSES, `os.cpu_count()` wide (W1-a3):
# the parse is pure CPU, threads cannot share it, and on one core a 1 500-body batch took
# 143-313 s against ~48 s to fetch the same bodies. The pool is an accelerator only — same
# claims, same order, a body's failure still costs that one listing's page entries, and a
# pool that dies is finished on the main thread. Each batch logs its own `N bodies/s`.
# `LOCATION_INTAKE_WORKERS` overrides the width and exists for ONE case: a runner whose CPU
# count is misreported. Nothing sets it here.
#
# THE LANE SELF-CHAINS WHILE IT HAS A BACKLOG (W1-a3). The hourly cron is not hourly:
# GitHub fires it ~7 times a day on a busy repo (no tick at 02:35 or 03:35 on 2026-09-12),
# so a 250 000-body backlog — which is what EVERY contract bump creates, since a bump makes
# the whole corpus unmined again — drains at ~6 000 bodies a fired tick and takes weeks. The
# last step therefore dispatches ONE successor when the run's own summary says work is left
# AND that this run moved it: `bodies_pass_complete=false` with `bodies_mined>0`, or a
# listing scan short of its end with `listings>0`. NOTHING otherwise — the steady state is
# cron-only, a failed run does not chain, and a run that achieved nothing does not hand the
# next one the same nothing (the progress term is what stops a lane with no page-capable
# portal or no R2 credential from chaining clean short runs for ever).
#
# The chain YIELDS before it dispatches. `location-batch` keeps one pending slot and GitHub
# supersedes the OLDER pending run, so a hop dispatched in a run's last seconds evicts
# whatever was waiting — that is how the hourly intake and an operator's full-resolve were
# both cancelled on 2026-09-10, and why the previous self-chaining lane was removed. If any
# member of the group is already waiting, the chain ends and lets it through; the backlog
# loses nothing, because the waiting run does the same work.
#
# WITH ONE EXCEPTION, measured in production: `location_resolve.yml` is in the group only
# when a full-resolve is DISPATCHED (or on its 03:17 cron) — its `*/15` drain ticks run in
# `location-resolve-lane` — and `gh run list` cannot report which group a queued run will
# take. Counting every queued resolve run stopped the chain on a routine 07:58 drain tick
# (hop 34681906422 yielding to run 34682089264) and handed a 212 000-body backlog back to a
# cron that fires ~7 times a day. So for that workflow, and only that one, the yield counts
# `workflow_dispatch` runs.
#
# The page half is HASH-GATED: a body is mined only while
# `portal_raw_payloads.contract_version IS DISTINCT FROM` the portal's active contract
# version, and the batch stamps the ones it mined — so the steady-state cost is bounded by
# page CHURN (~50-80 new bodies an hour fleet-wide), not by corpus size. If R2 is
# unconfigured the page half is skipped with one warning and the payload half runs
# unchanged.
#
# It writes `location_claims`, `dirty_locations` and its own `location_claim_batches`
# ledger, with the §6.1.2 licence ladder applied at the INPUT. Refusals are logged with a
# count, never written as rows.
#
# Every run first re-projects the contracts from git into `portal_contracts` /
# `portal_contract_entries` (02 §2.1.8: git is the store of record, the tables are its
# deploy-time projection). That is idempotent per (portal, contract_version) and fails
# loudly if a contract file changed without a version bump — which is the point.
#
# EVERY run has a budget, dispatches included. An unbudgeted run walks until
# `timeout-minutes` kills it, is CANCELLED before it can stamp anything, and leaves the
# next run to repeat it from the same cursor — which is what the first production run of
# this lane did (run 34658123746). A run that hits its budget stamps `outcome='stopped'`,
# NOT 'ok', and both keep the keyset cursor on the batch row (migration 387): in
# incremental mode that cursor is a `listing_snapshots.id`, a position in an append-only
# log, so a completed run resumes from the end of the log rather than from zero. 'ok' still
# means one thing: the scan ran out of rows.
#
# Required secrets: SUPABASE_DB_URL, plus R2_* for the page half.

on:
  workflow_dispatch:
    inputs:
      source:
        description: "one portal only (blank = all nine)"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - sreality
          - bezrealitky
          - bazos
          - idnes
          - mmreality
          - remax
          - ceskereality
          - realitymix
          - maxima
      mode:
        description: "full = walk every listing; incremental = only rows seen since the last ok batch"
        required: false
        default: incremental
        type: choice
        options: [incremental, full]
      max_seconds:
        description: "wall-clock budget; stops between batches, never mid-batch"
        required: false
        default: "2400"
        type: string
      batch_size:
        description: "listings per batch (10000-30000; blank = 20000)"
        required: false
        default: ""
        type: string
      dry_run:
        description: "extract and report; write nothing"
        required: false
        default: false
        type: boolean
      chain:
        description: "dispatch one successor when this run leaves work behind (untick for a one-shot run; crons always chain)"
        required: false
        default: true
        type: boolean
  schedule:
    # Hourly, incremental. sreality's index walk is hourly, so this keeps the claim layer
    # at most one cycle behind the payloads it mines.
    #
    # This cron was PAUSED 2026-08-18 and restored 2026-08-19, for the W3 history backfill
    # (the same move W1's backfill made with the resolve cron — see location_resolve.yml).
    # The lane holds `location-batch` for ~45 min of every hour and the group allows one
    # pending run, so while this ticked, every W3 dispatch was superseded before it could
    # acquire a runner. Pausing it was safe because the lane is incremental off a
    # watermark: the first run back mined the whole gap in one pass.
    - cron: "35 * * * *"

concurrency:
  # OUTER, cross-lane: shared with the registry load so at most ONE
  # heavy location lane runs at a time (2026-08-10 incident: four of
  # them concurrently dropped backends across the shared production instance and killed
  # this lane's 21:47 run plus both hourly crons with "SSL connection has been closed
  # unexpectedly"). See location_registry_load.yml for the full note.
  group: location-batch
  cancel-in-progress: false

jobs:
  intake:
    runs-on: ubuntu-latest
    concurrency:
      # INNER, per-lane: two concurrent intakes would fight over the same watermark and each
      # re-read the other's window. Never cancel in flight: a cancelled batch rolls back
      # whole, but the batch row of a cancelled run stays `running` and needs no repair.
      group: location-claims
      cancel-in-progress: false
    timeout-minutes: 55
    permissions:
      contents: read
      # The chain step re-dispatches THIS workflow with the job token. `workflow_dispatch`
      # is one of the two events a GITHUB_TOKEN-triggered action is allowed to create, so no
      # PAT is involved. That also means a chained run chains again — nothing in the platform
      # stops the sequence, which is why the work-left check and the yield are the only things
      # that end it.
      actions: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # PyYAML is a core dependency (W2a-3e): the scrape reads each contract's
      # `persistence.volatile_paths` out of git at fetch time, so it is no longer a
      # deploy-time-only need. The [dev] extra stays for the projection's own tooling;
      # the extractor itself reads the DB projection.
      - name: Install
        run: pip install -e ".[dev]"

      - name: Project the portal contracts from git
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python -m location_data.contracts --load --git-ref "$GITHUB_SHA"

      - name: Run the claim intake
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          # The page bodies' HOME, not an optional extra: 99.7 % of them are spilled to the
          # bucket. Missing credentials do NOT fail the run — `_open_body_store` warns once
          # and the payload half carries on for all nine portals — but a lane that mined no
          # page body all week is a silent coverage hole, and this repo has shipped "flag
          # on, credentials absent" twice already.
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          # THE CLAMP CEILING (W1-a4). At the default 16 the bucket answered a 1 500-body
          # batch in ~35 s wall (23 ms/body effective from a GitHub runner) — the largest
          # per-batch cost now that the selection is a keyset walk. 32 is the maximum
          # `page_readers.body_fetch_workers` will honour.
          LOCATION_BODY_FETCH_WORKERS: "32"
          SOURCE: ${{ inputs.source }}
          MODE: ${{ inputs.mode }}
          MAX_SECONDS: ${{ inputs.max_seconds }}
          BATCH_SIZE: ${{ inputs.batch_size }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -o pipefail   # `| tee` must not hide a failed lane behind tee's exit 0
          # The budget stops the run cleanly BETWEEN batches; it then stamps `stopped`
          # (never `ok`) and the next run resumes from the keyset cursor on that batch row.
          # It must leave the 55-minute job ceiling room for one WORST-CASE batch: after
          # the W2 activations (69 -> 112 executable entries fleet-wide) a 20k-listing
          # batch over a dense sreality slice measured 18 minutes (run 34159613249,
          # 2026-09-07). At 2700 s + 20k that batch overran the ceiling and the run was
          # CANCELLED before it could stamp a resumable `stopped`. 2400 s + 10k batches:
          # worst case ~9 min inside 15 min of headroom — and the lane now refuses to START
          # a batch that its predecessor's measured duration says will not finish in time.
          #
          # `--max-seconds` also defaults to 2400 inside the CLI, so a dispatch that blanks
          # this input still gets a budget. Both are here on purpose: the default is the
          # rail, this line is the knob.
          MODE="${MODE:-incremental}"
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            MAX_SECONDS="${MAX_SECONDS:-2400}"
            BATCH_SIZE="${BATCH_SIZE:-10000}"
          fi
          ARGS="--mode $MODE"
          if [ -n "$SOURCE" ]; then ARGS="$ARGS --source $SOURCE"; fi
          if [ -n "$MAX_SECONDS" ]; then ARGS="$ARGS --max-seconds $MAX_SECONDS"; fi
          if [ -n "$BATCH_SIZE" ]; then ARGS="$ARGS --batch-size $BATCH_SIZE"; fi
          if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          # THE SUCCESSOR RUNS WHAT THIS RUN RAN. A chained dispatch is a `workflow_dispatch`
          # event, so it never takes the `schedule` defaults above — passing the values
          # resolved here is what keeps a chain of runs on the calibrated 2400 s + 10k pair
          # instead of silently widening to the CLI's 20k on the first hop.
          {
            echo "CHAIN_SOURCE=$SOURCE"
            echo "CHAIN_MODE=$MODE"
            echo "CHAIN_MAX_SECONDS=$MAX_SECONDS"
            echo "CHAIN_BATCH_SIZE=$BATCH_SIZE"
          } >> "$GITHUB_ENV"
          echo "python -m location_data.claims_intake $ARGS"
          python -m location_data.claims_intake $ARGS 2>&1 | tee intake.log

      # ONE SUCCESSOR, ONLY WHILE THERE IS WORK LEFT, AND NEVER OVER SOMETHING WAITING.
      # The run's own terminal JSON decides: `bodies_pass_complete=false` means the
      # bodies-first keyset stopped short of its end, `reached_end=false` means the payload
      # scan did. Both true is the steady state and chains nothing — the cron owns the hour.
      #
      # NO `${{ }}` IN THE SCRIPT. Everything it reads is an env var, so
      # `tests/location_data/test_location_batch_hardening.py` can execute this exact text
      # against a stub `gh` — a chain whose yield is wrong is the kind of defect that only
      # shows up as somebody else's cancelled run three hours later.
      - name: Chain the next run
        if: (github.event_name == 'schedule' || inputs.chain) && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
          # EVERY workflow that can hold `location-batch`, `location_resolve.yml` included:
          # its group is a mode-conditional expression, so it joins whenever a full-resolve
          # is dispatched or its own cron fires — and a full-resolve is exactly what a chain
          # hop evicted on 2026-09-10. `test_location_batch_hardening.py` derives this list
          # from the workflows' own concurrency blocks, so a new member cannot be missed.
          GROUP_WORKFLOWS: "location_claims_intake.yml location_registry_load.yml location_resolve.yml"
          # …but for the resolve lane, only a DISPATCHED run counts. Its group is decided by
          # the run's own mode and `gh run list` cannot report a group, so "a queued resolve
          # run" and "a queued resolve run that will hold location-batch" are not the same
          # question: the lane's `*/15` drain ticks sit in `location-resolve-lane` and are
          # queued a good share of the time. On 2026-09-12 hop 34681906422 yielded to run
          # 34682089264 — a routine 07:58 schedule tick, mode=drain — and with 212 000 bodies
          # left the backlog went back to waiting for a cron that fires ~7 times a day.
          # A manual full-resolve or epoch mint IS in the group and still stops the chain; the
          # 03:17 daily sweep is one windowed INSERT with a lock-wait retry and tolerates the
          # overlap, which is the trade this line makes.
          DISPATCH_ONLY_WORKFLOWS: "location_resolve.yml"
          WORKFLOW: location_claims_intake.yml
        run: |
          summary=$(grep -o 'INTAKE done {.*' intake.log | tail -1 | sed 's/^INTAKE done //')
          left=$(printf '%s' "$summary" | python3 -c "import json,sys; s=json.load(sys.stdin); print('yes' if (not s.get('bodies_pass_complete') and s.get('bodies_mined', 0) > 0) or (not s.get('reached_end') and s.get('listings', 0) > 0) else 'no')" 2>/dev/null || echo "unknown")
          echo "work left: $left"
          if [ "$left" != "yes" ]; then
            # WORK LEFT IS NOT ENOUGH; THIS RUN MUST HAVE MADE PROGRESS ON IT. A successor is
            # only worth a slot if its predecessor moved a cursor: a run that mined no body
            # and opened no listing would hand the next one the same nothing, for ever, and
            # hold `location-batch` while doing it. The unfinished half must also be the half
            # that moved — `bodies_mined` for the drain, `listings` for the scan.
            echo "chain ends: nothing left that this run made progress on"
            exit 0
          fi
          # YIELD FIRST. `location-batch` keeps ONE pending slot and GitHub supersedes the
          # OLDER pending run, so a hop dispatched in this run's last seconds evicts whatever
          # was waiting — on 2026-09-10 that cancelled the hourly intake and an operator's
          # full-resolve, and it is why the previous self-chaining lane was removed outright.
          # A chain may only take a slot nobody else wants: if any member of the group has a
          # run waiting (the cron tick among them), the chain ENDS and the backlog waits for
          # that run instead, which loses nothing — the successor's work is the same work.
          # The exception is the resolve lane, whose queued runs are mostly drain ticks in
          # ANOTHER group: there, only a `workflow_dispatch` counts (see the env above).
          for wf in $GROUP_WORKFLOWS; do
            picked='select(.status == "queued" or .status == "pending" or .status == "waiting" or .status == "requested")'
            case " $DISPATCH_ONLY_WORKFLOWS " in
              *" $wf "*) picked="$picked | select(.event == \"workflow_dispatch\")" ;;
            esac
            waiting=$(gh run list --workflow="$wf" --limit 10 --json databaseId,status,event \
              -q ".[] | $picked | .databaseId" \
              | head -1)
            if [ -n "$waiting" ]; then
              echo "chain yields: $wf run $waiting is already waiting on the location-batch group"
              exit 0
            fi
          done
          # And never stack on a sibling intake. The inner `location-claims` group should
          # make this impossible, but a chain that assumed so would be the one thing that
          # discovered otherwise — two intakes share one watermark and re-read each other's
          # window.
          running=$(gh run list --workflow="$WORKFLOW" --limit 10 --json databaseId,status \
            -q '.[] | select(.status == "in_progress") | .databaseId' \
            | grep -v "^${GITHUB_RUN_ID}$" | head -1)
          if [ -n "$running" ]; then
            echo "chain yields: intake run $running is still in progress"
            exit 0
          fi
          gh workflow run "$WORKFLOW" --ref "$GITHUB_REF_NAME" \
            -f source="$CHAIN_SOURCE" -f mode="$CHAIN_MODE" \
            -f max_seconds="$CHAIN_MAX_SECONDS" -f batch_size="$CHAIN_BATCH_SIZE" \
            -f chain=true
          echo "chained: one successor dispatched on $GITHUB_REF_NAME"
