name: "Jobs: Location claim intake"

# THE claim lane (CLAUDE.md rule 25: one store, one lane). Deterministic extraction of
# location claims from BOTH substrates we hold for a listing, all nine portals:
#
#   * `listings.raw_json` plus the class-B legacy columns — the ten payload readers;
#   * the latest stored detail body in `portal_raw_payloads`, fetched from R2 and scoped by
#     the contract's exclusion zones — the fourteen page readers.
#
# No model. TWO HALVES, in this order, both inside one budget (W1-a2):
#
#   * BODIES FIRST — the unmined latest detail bodies of ACTIVE page-portal listings,
#     drained directly in 1 500-row batches until the backlog is empty or half the budget
#     is gone. No cursor: the mined-at stamp IS the progress.
#   * THEN THE CHANGED LISTINGS — a keyset walk of `listing_snapshots.id`, the
#     append-on-content-change log. A run opens an hour's CHANGE, not every listing the
#     index walks happened to re-sight: the `last_seen_at` watermark it replaces opened
#     ~180 000 listings an hour to re-mine claims that already existed.
#
# The page half is HASH-GATED: a body is mined only while
# `portal_raw_payloads.contract_version IS DISTINCT FROM` the portal's active contract
# version, and the batch stamps the ones it mined — so the steady-state cost is bounded by
# page CHURN (~50-80 new bodies an hour fleet-wide), not by corpus size. If R2 is
# unconfigured the page half is skipped with one warning and the payload half runs
# unchanged.
#
# It writes `location_claims`, `dirty_locations` and its own `location_claim_batches`
# ledger, with the §6.1.2 licence ladder applied at the INPUT. Refusals are logged with a
# count, never written as rows.
#
# Every run first re-projects the contracts from git into `portal_contracts` /
# `portal_contract_entries` (02 §2.1.8: git is the store of record, the tables are its
# deploy-time projection). That is idempotent per (portal, contract_version) and fails
# loudly if a contract file changed without a version bump — which is the point.
#
# The lane REFUSES to run unless the Mapy affected-set inventory (migration 385) is
# TERMINAL AND COMPLETE — a resumable run with status='completed' in the current restart
# epoch, not merely a non-empty `mapy_affected`. A half-built inventory describes a prefix
# of `listings`, and absence from a prefix is exactly the verdict that admits a
# Mapy-derived `carry_forward` coordinate as first-party (06 §6.1.2). It is a W1 INPUT,
# not an output.
#
# EVERY run has a budget, dispatches included. An unbudgeted run walks until
# `timeout-minutes` kills it, is CANCELLED before it can stamp anything, and leaves the
# next run to repeat it from the same cursor — which is what the first production run of
# this lane did (run 34658123746). A run that hits its budget stamps `outcome='stopped'`,
# NOT 'ok', and both keep the keyset cursor on the batch row (migration 387): in
# incremental mode that cursor is a `listing_snapshots.id`, a position in an append-only
# log, so a completed run resumes from the end of the log rather than from zero. 'ok' still
# means one thing: the scan ran out of rows.
#
# Required secrets: SUPABASE_DB_URL, plus R2_* for the page half.

on:
  workflow_dispatch:
    inputs:
      source:
        description: "one portal only (blank = all nine)"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - sreality
          - bezrealitky
          - bazos
          - idnes
          - mmreality
          - remax
          - ceskereality
          - realitymix
          - maxima
      mode:
        description: "full = walk every listing; incremental = only rows seen since the last ok batch"
        required: false
        default: incremental
        type: choice
        options: [incremental, full]
      max_seconds:
        description: "wall-clock budget; stops between batches, never mid-batch"
        required: false
        default: "2400"
        type: string
      batch_size:
        description: "listings per batch (10000-30000; blank = 20000)"
        required: false
        default: ""
        type: string
      dry_run:
        description: "extract and report; write nothing"
        required: false
        default: false
        type: boolean
  schedule:
    # Hourly, incremental. sreality's index walk is hourly, so this keeps the claim layer
    # at most one cycle behind the payloads it mines.
    #
    # This cron was PAUSED 2026-08-18 and restored 2026-08-19, for the W3 history backfill
    # (the same move W1's backfill made with the resolve cron — see location_resolve.yml).
    # The lane holds `location-batch` for ~45 min of every hour and the group allows one
    # pending run, so while this ticked, every W3 dispatch was superseded before it could
    # acquire a runner. Pausing it was safe because the lane is incremental off a
    # watermark: the first run back mined the whole gap in one pass.
    - cron: "35 * * * *"

concurrency:
  # OUTER, cross-lane: shared with the registry load and the Mapy inventory so at most ONE
  # heavy location lane runs at a time (2026-08-10 incident: four of
  # them concurrently dropped backends across the shared production instance and killed
  # this lane's 21:47 run plus both hourly crons with "SSL connection has been closed
  # unexpectedly"). See location_registry_load.yml for the full note.
  group: location-batch
  cancel-in-progress: false

jobs:
  intake:
    runs-on: ubuntu-latest
    concurrency:
      # INNER, per-lane: two concurrent intakes would fight over the same watermark and each
      # re-read the other's window. Never cancel in flight: a cancelled batch rolls back
      # whole, but the batch row of a cancelled run stays `running` and needs no repair.
      group: location-claims
      cancel-in-progress: false
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # PyYAML is a core dependency (W2a-3e): the scrape reads each contract's
      # `persistence.volatile_paths` out of git at fetch time, so it is no longer a
      # deploy-time-only need. The [dev] extra stays for the projection's own tooling;
      # the extractor itself reads the DB projection.
      - name: Install
        run: pip install -e ".[dev]"

      - name: Project the portal contracts from git
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python -m location_data.contracts --load --git-ref "$GITHUB_SHA"

      - name: Run the claim intake
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          # The page bodies' HOME, not an optional extra: 99.7 % of them are spilled to the
          # bucket. Missing credentials do NOT fail the run — `_open_body_store` warns once
          # and the payload half carries on for all nine portals — but a lane that mined no
          # page body all week is a silent coverage hole, and this repo has shipped "flag
          # on, credentials absent" twice already.
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          SOURCE: ${{ inputs.source }}
          MODE: ${{ inputs.mode }}
          MAX_SECONDS: ${{ inputs.max_seconds }}
          BATCH_SIZE: ${{ inputs.batch_size }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS="--mode ${MODE:-incremental}"
          if [ -n "$SOURCE" ]; then ARGS="$ARGS --source $SOURCE"; fi
          if [ -n "$MAX_SECONDS" ]; then ARGS="$ARGS --max-seconds $MAX_SECONDS"; fi
          if [ -n "$BATCH_SIZE" ]; then ARGS="$ARGS --batch-size $BATCH_SIZE"; fi
          if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          # The budget stops the run cleanly BETWEEN batches; it then stamps `stopped`
          # (never `ok`) and the next run resumes from the keyset cursor on that batch row.
          # It must leave the 55-minute job ceiling room for one WORST-CASE batch: after
          # the W2 activations (69 -> 112 executable entries fleet-wide) a 20k-listing
          # batch over a dense sreality slice measured 18 minutes (run 34159613249,
          # 2026-09-07). At 2700 s + 20k that batch overran the ceiling and the run was
          # CANCELLED before it could stamp a resumable `stopped`. 2400 s + 10k batches:
          # worst case ~9 min inside 15 min of headroom — and the lane now refuses to START
          # a batch that its predecessor's measured duration says will not finish in time.
          #
          # `--max-seconds` also defaults to 2400 inside the CLI, so a dispatch that blanks
          # this input still gets a budget. Both are here on purpose: the default is the
          # rail, this line is the knob.
          if [ -z "$MAX_SECONDS" ] && [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            ARGS="$ARGS --max-seconds 2400"
          fi
          if [ -z "$BATCH_SIZE" ] && [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            ARGS="$ARGS --batch-size 10000"
          fi
          echo "python -m location_data.claims_intake $ARGS"
          python -m location_data.claims_intake $ARGS
