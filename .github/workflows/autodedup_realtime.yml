name: "AUTODEDUP: realtime shadow lane"

# The real-time half of the autonomous dedup engine: the SAME decisions the cohort lane makes
# over a whole export, made incrementally as listings arrive. It runs every 10 minutes and is
# DARK BY DEFAULT — the first step exits 0 unless the repository variable
# AUTODEDUP_REALTIME_ENABLED is exactly `true`, and `autodedup/incremental_lane.py` re-reads
# the same variable, so neither a schedule nor a manual dispatch can start a pass the operator
# has not switched on. Nothing outside schema `autodedup` is written (ruling D4): no
# `public.listings` row, no `property_id`, no merge. It spends $0 by construction — ruling D19
# gives no LLM judge merge authority on the band, so this lane calls no provider at all.
#
# What one pass does. Three index-served watermark cursors (`listings_pkey` for new rows,
# `listing_snapshots_pkey` for content changes, `listings_inactive_at_idx` for activity flips)
# hand it a bounded slice of listings. For each one it rebuilds the fingerprint, refreshes the
# probe postings in `autodedup.fp_key`, widens to the probe-key NEIGHBOURHOOD (E66 — a fan-out
# cap makes retrieval order-dependent unless every listing that probes a changed key is
# re-probed too), retrieves candidates with the same six probes the cohort lane uses, computes
# the same features under the generation's FROZEN calibration (E65), takes the same decision —
# certificates, E45/E46/E47's gates, E61's veto, E48's per-stratum cut, E63's promotion — and
# re-clusters only the connected components whose merge edges moved (E67), constrained
# union-find, must-not-link and E57's bridge rule included. E64's rail then re-opens to the
# band any stamped promotion the live census has since overtaken; certificates are exempt.
#
# Idempotent and safe to re-run: a listing whose fingerprint digest and probe keys are
# unchanged costs a digest comparison and nothing else, every write is an upsert keyed inside
# the generation, and the watermark only advances on what the pass actually claimed. Two runs
# cannot overlap — a lease row in `autodedup.rt_lease` is taken by CAS (never
# `pg_advisory_lock`, which strands over the transaction pooler) and a run that cannot take it
# exits green as `skipped: leased`.
#
# REQUIRES migration 539 (`autodedup.fp_key`, `rt_calibration`, `rt_block_cell`, `rt_lease`
# plus the pair-grain columns) and a frozen calibration row for the generation, seeded from a
# cohort pass. Without either the lane exits non-zero rather than running on a guess.
#
# The run summary (out/incremental.json, uploaded on every outcome and echoed into the job
# summary) carries the counts, the per-listing latency from arrival to decision with p50/p95,
# the components it re-clustered, the rail's plan and the measured spend.

on:
  schedule:
    # Every 10 minutes. GitHub's cron is best effort and this fleet has measured 80-256 minute
    # gaps under load, which is exactly why the lane is watermark-driven rather than
    # window-driven: a late run claims everything since the cursor, never a fixed window.
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      args:
        description: "Pass arguments as k=v,k=v — generation (default rt), max_listings, max_pairs, max_component, settings, model."
        required: false
        default: ""
        type: string

# Its OWN group, so a long cohort pass on the `autodedup` group can never evict a real-time
# pass and a real-time pass can never evict a paid judge run.
concurrency:
  group: autodedup-realtime
  cancel-in-progress: false

jobs:
  pass:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      # The dark switch, BEFORE checkout: a lane that is off should cost a runner-second, not
      # a checkout and a pip install. `vars` is empty for an unset variable, so the default is
      # off and stays off when the variable is deleted.
      - name: Dark switch
        env:
          ENABLED: ${{ vars.AUTODEDUP_REALTIME_ENABLED }}
        run: |
          set -euo pipefail
          if [ "${ENABLED:-}" != "true" ]; then
            echo "AUTODEDUP_REALTIME_ENABLED is not 'true' — lane is dark, exiting." \
              >> "$GITHUB_STEP_SUMMARY"
            echo "RT_ENABLED=0" >> "$GITHUB_ENV"
          else
            echo "RT_ENABLED=1" >> "$GITHUB_ENV"
          fi

      - if: env.RT_ENABLED == '1'
        uses: actions/checkout@v6
      - if: env.RT_ENABLED == '1'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # The same charset check the engine lane runs: every input travels via env, never
      # interpolated into a shell, and is validated before it reaches argv.
      - name: Validate inputs
        if: env.RT_ENABLED == '1'
        env:
          ARGS: ${{ inputs.args }}
        run: |
          set -euo pipefail
          case "${ARGS:-}" in
            *[!a-zA-Z0-9_=,.:/\ -]*) echo "::error::args may only contain letters digits _ = , . : / - and space"; exit 1 ;;
          esac

      - name: Install
        if: env.RT_ENABLED == '1'
        run: pip install -e .

      - name: Pass
        if: env.RT_ENABLED == '1'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_SESSION_URL: ${{ secrets.SUPABASE_DB_SESSION_URL }}
          AUTODEDUP_REALTIME_ENABLED: ${{ vars.AUTODEDUP_REALTIME_ENABLED }}
          ARGS: ${{ inputs.args }}
        run: |
          set -euo pipefail
          mkdir -p out
          python -m autodedup.lane --mode incremental --args "${ARGS:-}" --out out/

      # The numbers the rollout conversation needs, on the run itself rather than inside an
      # artifact nobody opens: how much was claimed, what it decided, how long a listing waited
      # between arriving and being decided, and what it spent (zero — D19).
      - name: Run summary
        if: always() && env.RT_ENABLED == '1'
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          path = pathlib.Path("out/incremental.json")
          if not path.is_file():
              print("### autodedup realtime\n\nNo pass summary — see out/summary.json.")
              raise SystemExit(0)
          data = json.loads(path.read_text(encoding="utf-8"))
          counts = data.get("counts", {})
          lat = data.get("latency_s", {})
          print("### autodedup realtime — generation "
                f"`{data.get('generation')}` (calibration `{data.get('calibration_digest')}`)\n")
          print("| metric | value |\n| --- | --- |")
          for key in ("claimed", "dirty", "pairs_scored", "pairs_written", "pairs_deleted",
                      "components", "clusters_written", "clusters_dropped"):
              print(f"| {key} | {counts.get(key, 0)} |")
          for key, label in (("merge", "zone merge"), ("band", "zone band"),
                             ("reject", "zone reject"), ("veto", "zone veto")):
              print(f"| {label} | {data.get('zones', {}).get(key, 0)} |")
          print(f"| latency p50 s | {lat.get('p50', '-')} |")
          print(f"| latency p95 s | {lat.get('p95', '-')} |")
          print(f"| latency max s | {lat.get('max', '-')} |")
          print(f"| rail re-opened | {data.get('rail', {}).get('reopened', 0)} |")
          print(f"| LLM spend USD | {data.get('spent_usd', 0.0)} |")
          PY

      - name: Upload report
        if: always() && env.RT_ENABLED == '1'
        uses: actions/upload-artifact@v4
        with:
          name: autodedup-realtime-${{ github.run_id }}
          path: out/
          retention-days: 14
          if-no-files-found: ignore
