name: "AUTODEDUP: realtime shadow lane"

# The real-time half of the autonomous dedup engine: the SAME decisions the cohort lane makes
# over a whole export, made incrementally as listings arrive. It runs every 10 minutes and is
# DARK BY DEFAULT — the first step exits 0 unless the repository variable
# AUTODEDUP_REALTIME_ENABLED is exactly `true`, and `autodedup/incremental_lane.py` re-reads
# the same variable, so neither a schedule nor a manual dispatch can start a pass the operator
# has not switched on. Nothing outside schema `autodedup` is written (ruling D4): no
# `public.listings` row, no `property_id`, no merge. It spends $0 by construction — ruling D19
# gives no LLM judge merge authority on the band, so this lane calls no provider at all.
#
# What one pass does. SEVEN bounded watermark feeds hand it a slice of listings, and every one of
# them is restricted to `rt_scope` (E79 — the lane holds three blocks, not the corpus): new rows
# off `listings_pkey`, content changes off `listing_snapshots_pkey`, activity flips off the
# partial `listings_inactive_at_idx` paged on `(inactive_at, id)`, a round-robin sweep for
# REVIVALS — `touch_listings` un-delists in place and appends no snapshot, so no forward cursor
# can see one — a round-robin sweep for listings the geocoder MOVED out of the scope, which
# are retired rather than left half-indexed, and its mirror image: the ENTRANTS, listings whose
# location resolved INTO the scope after their arrival window had already passed (W9d-3 —
# `listing_location` is written asynchronously from the scrape). The entrant feed costs the
# production instance NOTHING per pass (E81): it claims out of `autodedup.rt_scope_ids`, the
# scope's membership snapshot, and the wide walk of a block on `public` — the quarter's is 231 MB
# of cold heap reads, measured — runs on a cadence that is data (`rt_enter_interval_hours`, 6 h a
# quarter and 1 h a town) under a rolling-day cap that is data (`rt_enter_max_scans_per_day`).
# The retiring direction carries a rail of its own: retirement is measured over a ROLLING DAY
# against the store as it stood when that day opened, and over `rt_max_retire_fraction` of it the
# lane stops instead (E82).
# The SEVENTH feed is the EVIDENCE sweep (E92), and it exists because none of the six above is
# keyed on a photograph becoming evidence: images land about a minute after `first_seen_at`,
# their pHash is written by an hourly job at :20 and their CLIP vector and tags by another at
# :40 (measured p50 2.47 h, p90 4.51 h to a first tag), while this lane claims the listing at
# `first_seen_at + 5..15 min`. Roughly 80% of arrivals were therefore decided with every
# `phash` NULL, 78% never carry a second snapshot, and the listing's stored index keys never
# gained a pHash posting at all — so no other listing's photo probe could reach it either. The
# sweep round-robins this generation's own `rt_fp` rows whose recorded evidence is incomplete
# or whose first decision is inside `rt_evidence_horizon_hours` (48 h), probes `public.images`
# by listing id through `images_listing_id_idx` — 12 buffers a listing, ~150 listings a pass on
# the trial scope, ~2.0 GB a day, and no join to the CLIP tables because `images.clip_tagged_at`
# is the CLIP job's own stamp — and re-claims every listing whose photographs no longer match
# what its stored decision rested on. Its second arm asks for the merges HELD in the band for
# want of photographs whose horizon has run out, because nothing about those has moved.
# AND A MERGE DOES NOT ACT ON EVIDENCE THE LANE DOES NOT HAVE YET (E93): while a side's gallery
# exists and carries no hash at all, a merge that does not rest on K-B (the re-post) or K-R (a
# shared order code) — the two certificates that need no photograph — is held in the band with
# reason `evidence_pending` and re-decided when the evidence lands or the horizon passes.
# Rejects are never held. Text-and-certificate decisions therefore still complete within one
# pass; a photo-dependent merge waits for the hourly producers, which is a latency cost the
# production fix (hashing on download, in the image worker) would remove and which is the
# operator's call, not this program's.
# Each forward feed reads a bounded WINDOW off its own
# index, resolves the scope for that window through `listing_location_pkey`, and advances its
# cursor over the window rather than over the survivors. Before any of it, the pass reads what
# schema `autodedup` costs and REFUSES over `rt_max_schema_mb` (default 400). Every feed ignores rows younger than a settle lag and the new-row feed carries an
# anti-join straggler sweep, because `id` is assigned at INSERT and two overlapping batch
# transactions can commit out of id order (E73). For each one it rebuilds the fingerprint, refreshes the
# probe postings in `autodedup.fp_key`, widens to the probe-key NEIGHBOURHOOD (E71 — a fan-out
# cap makes retrieval order-dependent unless every listing that probes a changed key is
# re-probed too), retrieves candidates with the same six probes the cohort lane uses, computes
# the same features under the generation's FROZEN calibration (E70), takes the same decision —
# certificates, E45/E46/E47's gates, E61's veto, E48's per-stratum cut, E63's promotion — and
# re-clusters only the connected components whose merge edges moved (E72), constrained
# union-find, must-not-link and E57's bridge rule included. E64's rail then re-opens to the
# band any stamped promotion the live census has since overtaken; certificates are exempt.
#
# Idempotent, atomic and safe to re-run: a listing whose fingerprint digest and probe keys are
# unchanged costs a digest comparison and nothing else, the whole pass is ONE transaction, and
# the watermark advances only over what the pass actually decided. A pass whose pair set does
# not fit `max_pairs` writes NOTHING and re-claims a smaller slice rather than truncating —
# a partial pair set re-clusters from a partial edge set and the watermark would then step over
# the difference for ever (E75). Two runs cannot overlap: a lease row in `autodedup.rt_lease` is
# taken by CAS (never `pg_advisory_lock`, which strands over the transaction pooler), its TTL
# outlives this job's timeout, and a run that cannot take it exits green as `skipped: leased`.
#
# The scope, the budget and the two entrant numbers are `autodedup.settings` rows
# (`rt_scope:<generation>`, `rt_max_schema_mb`, `rt_max_retire_fraction`,
# `rt_enter_max_scans_per_day`, `rt_enter_interval_hours`), so none needs a migration and none
# needs a deploy to change; `--mode rt_seed` writes the scope it seeded, and that row — not the
# dispatch argument — is what a pass runs under (W9d-2). The scope row is PER GENERATION (E82),
# an empty scope is a hard error, never a whole-corpus run, and a dispatch argument that differs
# from the seeded scope is refused unless `rt_rescope=true` moves the generation to it. Every
# other control number is a settings row and NOT a plain dispatch argument (E82): it is accepted
# on a dispatch only beside `rt_rescope=true`, and a value that is not a number stops the lane
# rather than reverting to a default.
#
# THE FACTS ARE THE EXPORT'S FACTS, AND A GATE SAYS SO EVERY PASS (E91). The lane reads a
# listing through the export's own statements and builders, and the one input it cannot recount
# — the corpus-wide pHash population E9 subtracts catalogue photos with — is FROZEN into
# `autodedup.phash_pop` by the seed, which copies the number the export already measured. W9f
# ran a whole live pass with that table EMPTY and no writer anywhere in the repository: every
# image read a population of 0, every `catalog_ratio` went absent, and K-C — the certificate
# that rests on exact photo matches — could not fire at all (1,024 K-B, 75 K-R, ZERO K-C against
# the batch generation's 1,771). So `rt_seed` now cuts a per-listing fact baseline beside the
# calibration and EVERY pass re-checks a slice of it before it opens its transaction: a stored
# fact or a frozen statistic that differs on a listing nothing has changed stops the pass —
# non-zero, nothing written, no cursor moved. pHash and CLIP are producers that re-run on their
# own cadence, and `last_seen_at` / `is_active` are the scraper's clock, which appends no
# snapshot at all — both are reported and neither is refused; a hash the frozen population never
# saw is UNKNOWN (never 0), and `population.images_unmeasured` in the summary is what says when
# the generation is due a fresh export and re-seed.
#
# AND THE GATE CANNOT PASS ON NOTHING (E94/E95). W9g's gate counted breaches and nothing else,
# so `checked` 0 with `breaches` 0 was a green pass — reachable by drifting or deleting the
# baseline, and drift is monotone in export age, so the gate self-weakened as the export aged.
# It now REFUSES below a floor (`rt_parity_min_checked`, 15, and `rt_parity_min_checked_share`,
# 60% of the slice), beyond `rt_calibration_max_age_days` (14 days of EXPORT age — a frozen
# population can only undercount, and an undercount is the anti-conservative direction), and
# over `rt_parity_max_unknown_pop_share` (15% of the phash-bearing images it read carrying a
# hash the calibration never measured). The population is compared PER IMAGE, so one re-hashed
# frame excuses itself and not its fourteen neighbours. Every pass reports the calibration's
# age and the population's coverage whether or not they refuse.
#
# REQUIRES migrations 539 (`autodedup.fp_key`, `rt_fp`, `rt_calibration`, `rt_block_cell`,
# `rt_lease`, `rt_scope_ids`, `rt_scope_scan`, `rt_retire_event` plus the pair-grain columns) and
# 540 (`rt_fp.ev_images` / `ev_phash` / `ev_clip` / `ev_tags` / `ev_complete` /
# `first_decided_at` plus the three indexes the evidence sweep reads), and
# a SEEDED generation. Without the migration the lane exits non-zero; without the seed it exits 0
# as `skipped: unseeded` rather than failing every ten minutes (E80).
#
# TURNING IT ON — the exact sequence, in this order (E80):
#   1. Apply `migrations/539_autodedup_realtime_lane.sql` and
#      `migrations/540_autodedup_evidence_arrival.sql` (both additive, schema `autodedup` only).
#   2. Merge this branch. Nothing starts: the schedule stays dark until step 5.
#   3. Seed the generation — this works WHILE THE LANE IS DARK, which is the point of it:
#        gh workflow run autodedup.yml --ref main -f mode=rt_seed \
#          -f args=export_run=35200225251,settings=w8,model=w6_gold,backfill=true,reseed=true,rt_scope=obec:563510 obec:577626 cast_obce:490245
#      35200225251 is the export run whose 5,687-listing cohort the batch pass scored; the seed
#      downloads that artifact, keeps the 4,887 listings of it the scope holds, cuts the frozen
#      calibration over them (E70), materialises their pHash population, cuts the parity
#      baseline and starts the cursors at TODAY. `settings` and `model` are REQUIRED and NAMED
#      (E90a): they are the generation's scorer, every pass runs it and every stored row is
#      stamped with it, and W9f seeded and ran on the uncalibrated prior because an empty
#      argument was allowed to mean one. `rt_scope` here is the default spelled out — leave it
#      off and the same three trial blocks are used; the budget default is 400 MB
#      (`rt_max_schema_mb=<n>` moves it). A second seed of a seeded generation is refused unless
#      `reseed=true`, and a re-seed is how a generation changes its scorer or refreshes its
#      frozen population from a newer export.
#   4. Verify: `rt_seed.json` reports the calibration digest, `in_scope_listings`, `backfilled`,
#      `model_version`, `population.hashes_written` and `parity` (breaches 0 over the listings
#      it checked); in the database `autodedup.settings` carries `rt_scope:rt` and
#      `rt_parity_baseline:rt`, `autodedup.phash_pop` is no longer empty and
#      `autodedup.rt_calibration` has one row for generation `rt` carrying the settings and the
#      model version.
#   5. Flip the switch: `gh variable set AUTODEDUP_REALTIME_ENABLED --body true`. Reversing it
#      is the same flip the other way; `autodedup.settings.realtime_enabled = false` stops a
#      running lane with no repository change at all.
#
# The run summary (out/incremental.json, uploaded on every outcome and echoed into the job
# summary) carries the counts, the per-listing latency from arrival to decision with p50/p95,
# the components it re-clustered, the rail's plan and the measured spend — plus `parity` (what
# the gate checked, what drifted and what the producers moved), `population` (how many images
# carried a hash the frozen table could not measure), `model_version` and the settings the
# generation was seeded with.

on:
  schedule:
    # Every 10 minutes. GitHub's cron is best effort and this fleet has measured 80-256 minute
    # gaps under load, which is exactly why the lane is watermark-driven rather than
    # window-driven: a late run claims everything since the cursor, never a fixed window.
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      args:
        description: "Pass arguments as k=v,k=v — generation (default rt), rt_parity_sample (how many baseline listings the gate re-checks, default 25), rt_scope (e.g. 'obec:563510 cast_obce:490245' or all; refused unless it matches the seeded scope or rt_rescope=true), rt_rescope, max_listings, max_pairs, max_component, settle_lag, straggler_window, revive_slice, feed_window, drift_slice, enter_slice, settings and model (a pass may NAME the generation's own scorer, never a different one — changing it is a re-seed). The rails (rt_max_schema_mb, rt_max_retire_fraction, rt_enter_max_scans_per_day, rt_enter_interval_hours) are autodedup.settings rows and are accepted here only beside rt_rescope=true."
        required: false
        default: ""
        type: string

# Its OWN group, so a long cohort pass on the `autodedup` group can never evict a real-time
# pass and a real-time pass can never evict a paid judge run.
concurrency:
  group: autodedup-realtime
  cancel-in-progress: false

jobs:
  pass:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      # The dark switch, BEFORE checkout: a lane that is off should cost a runner-second, not
      # a checkout and a pip install. `vars` is empty for an unset variable, so the default is
      # off and stays off when the variable is deleted.
      - name: Dark switch
        env:
          ENABLED: ${{ vars.AUTODEDUP_REALTIME_ENABLED }}
        run: |
          set -euo pipefail
          if [ "${ENABLED:-}" != "true" ]; then
            echo "AUTODEDUP_REALTIME_ENABLED is not 'true' — lane is dark, exiting." \
              >> "$GITHUB_STEP_SUMMARY"
            echo "RT_ENABLED=0" >> "$GITHUB_ENV"
          else
            echo "RT_ENABLED=1" >> "$GITHUB_ENV"
          fi

      - if: env.RT_ENABLED == '1'
        uses: actions/checkout@v6
      - if: env.RT_ENABLED == '1'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # The same charset check the engine lane runs: every input travels via env, never
      # interpolated into a shell, and is validated before it reaches argv.
      - name: Validate inputs
        if: env.RT_ENABLED == '1'
        env:
          ARGS: ${{ inputs.args }}
        run: |
          set -euo pipefail
          case "${ARGS:-}" in
            *[!a-zA-Z0-9_=,.:/\ -]*) echo "::error::args may only contain letters digits _ = , . : / - and space"; exit 1 ;;
          esac

      - name: Install
        if: env.RT_ENABLED == '1'
        run: pip install -e .

      - name: Pass
        if: env.RT_ENABLED == '1'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_SESSION_URL: ${{ secrets.SUPABASE_DB_SESSION_URL }}
          AUTODEDUP_REALTIME_ENABLED: ${{ vars.AUTODEDUP_REALTIME_ENABLED }}
          ARGS: ${{ inputs.args }}
        run: |
          set -euo pipefail
          mkdir -p out
          python -m autodedup.lane --mode incremental --args "${ARGS:-}" --out out/

      # The numbers the rollout conversation needs, on the run itself rather than inside an
      # artifact nobody opens: how much was claimed, what it decided, how long a listing waited
      # between arriving and being decided, and what it spent (zero — D19).
      - name: Run summary
        if: always() && env.RT_ENABLED == '1'
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          path = pathlib.Path("out/incremental.json")
          if not path.is_file():
              print("### autodedup realtime\n\nNo pass summary — see out/summary.json.")
              raise SystemExit(0)
          data = json.loads(path.read_text(encoding="utf-8"))
          counts = data.get("counts", {})
          lat = data.get("latency_s", {})
          print("### autodedup realtime — generation "
                f"`{data.get('generation')}` (calibration `{data.get('calibration_digest')}`)\n")
          print("| metric | value |\n| --- | --- |")
          for key in ("claimed", "dirty", "pairs_scored", "pairs_written", "pairs_deleted",
                      "components", "clusters_written", "clusters_dropped", "wanted_pairs",
                      "attempts"):
              print(f"| {key} | {counts.get(key, 0)} |")
          for feed, seen in sorted((data.get("feeds") or {}).items()):
              print(f"| feed {feed} | {seen} |")
          for key, label in (("merge", "zone merge"), ("band", "zone band"),
                             ("reject", "zone reject"), ("veto", "zone veto")):
              print(f"| {label} | {data.get('zones', {}).get(key, 0)} |")
          print(f"| latency p50 s | {lat.get('p50', '-')} |")
          print(f"| latency p95 s | {lat.get('p95', '-')} |")
          print(f"| latency max s | {lat.get('max', '-')} |")
          print(f"| rail re-opened | {data.get('rail', {}).get('reopened', 0)} |")
          print(f"| SQL statements | {data.get('statements', '-')} |")
          print(f"| fact reads | {data.get('fact_reads', '-')} |")
          print(f"| store rows | {data.get('store_rows', '-')} |")
          print(f"| refused | {data.get('aborted') or 'no'} |")
          print(f"| LLM spend USD | {data.get('spent_usd', 0.0)} |")
          PY

      - name: Upload report
        if: always() && env.RT_ENABLED == '1'
        uses: actions/upload-artifact@v4
        with:
          name: autodedup-realtime-${{ github.run_id }}
          path: out/
          retention-days: 14
          if-no-files-found: ignore
