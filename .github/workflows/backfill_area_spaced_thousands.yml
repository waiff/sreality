name: Backfill areas truncated on a spaced thousands group (W19)

# One-off, dispatch-only heal. Until W19 the ceskereality, realitymix, remax and maxima
# parsers each carried a private copy of the naive area regex: it matched the FIRST bare
# digit run before an `m²`, so the Czech thousands format every one of them renders
# ("5 870 m²", "1 063 m²" with a no-break space) parsed from INSIDE the number and stored
# 870 / 63. Measured on production 2026-09-17:
#
#   ceskereality  98,126 rows  17,207 carry the truncation fingerprint (stored area =
#                              title area mod 1000); of 19,088 land rows NOT ONE has an
#                              area_m2 of 1000 or more (max 999)
#   realitymix    83,051 rows  13,164 fingerprints, 1,828 correct (its spec cells are
#                              unspaced, so only the TITLE fallback truncates)
#   remax         13,797 rows  not fingerprintable from titles — but the archived capture
#                              proves its spec cells do it ("Plocha parcely: 1 063 m²")
#   maxima           540 rows  87 land rows, max 987 m² — the same signature
#
# The corruption reaches every consumer: the per-m² measure (rule 23), Browse filters and
# sort, comparables and estimates, dedup's area rung, and W17's land heal (which copied a
# truncated `estate_area` into `area_m2` on exactly these portals). `scraper.area` now owns
# ONE grammar for all nine portals (rule 21) and fixes every future write; this fixes the
# rows already stored, by re-parsing each listing's OWN archived detail body with the fixed
# parser — the same page, read correctly. Because the re-parse fixes `area_m2` and
# `estate_area` together, W17's land heal needs no separate re-run.
#
# The substrate is `portal_raw_payloads` (migration 382/403/406), not the latest-wins
# `portal_raw_pages` the idnes precedent read: the latest successful `detail` payload per
# listing, whose body lives in R2 above a 2 KB threshold. R2_* is therefore REQUIRED — a
# run without a store would find essentially every payload spilled and report coverage over
# nothing, so the script refuses up front rather than mining the database-resident rump.
# One bad object costs one listing, never the batch.
#
# Selection is complete by construction and touches no wide column: a truncation keeps the
# last three digits, so the stored value is always under 1000 — unless those digits were
# "000", in which case the write boundary NULLed the 0 and the row carries no area at all.
# Hence "any area non-NULL and < 1000, OR all four NULL". The `raw_json->>'title'` probe
# the idnes backfill used is deliberately absent: it covers nothing that predicate misses
# and detoasts every candidate row (the cost that killed `backfill_mmreality_areas`'s first
# live dispatch on a 120 s statement_timeout).
#
# Writes NO `listing_snapshots` row. The area columns ARE hashed, but correcting our own
# mis-parse of the SAME stored page is the sanctioned rule-2 exception (the
# `backfill_idnes_areas` / `backfill_land_headline_area` precedent); each healed LIVE row's
# next successful detail fetch then appends exactly ONE genuine snapshot, spread over the
# normal cadence. An inactive row is never refetched, so the heal is the only write it
# gets. Price is never rewritten — a staged body can lag the live row.
#
# Idempotent: a healed row re-parses to the same values and writes nothing. There is no
# `raw_json` marker on purpose (stamping one would rewrite the widest TOAST column on the
# hottest table for every row examined), so a re-run re-reads the bodies it already
# examined — that is what `--after` and `--max-seconds` are for. Batched by `listings.id`,
# one `UPDATE ... FROM unnest(...)` per page inside its own transaction with
# `SET LOCAL statement_timeout` (120 s) + `lock_timeout` (30 s), replayed through the
# shared lock-retry rail whose window is sized for the ~90 s of row locks the hourly
# MF-yield recompute holds on `listings`. DML, never DDL: no ACCESS EXCLUSIVE, so it cannot
# head-block a writer; a WRITING pass waits for a read-model rebuild gap first, bounded,
# then proceeds anyway (a dry run never waits). Healed listings are enqueued into
# `dirty_properties` so the singleton `properties` area mirror is recomputed (rule 20).
# NOT a portal ingest workflow, so it carries no `# portal:` tag.
#
# The script DEFAULTS TO DRY-RUN: it reports per-portal suspects / would-change /
# unchanged / body-missing / parse-errors and exits unless `write` is true.
#
# Required GitHub secrets: SUPABASE_DB_URL, R2_ACCOUNT_ID, R2_ACCESS_KEY_ID,
# R2_SECRET_ACCESS_KEY, R2_BUCKET_NAME.

on:
  workflow_dispatch:
    inputs:
      write:
        description: Actually write. Left false, this only reports what would change.
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      sources:
        description: Comma-separated portals to heal (blank = all four)
        required: false
        default: ""
        type: string
      limit:
        description: Max listings EXAMINED this run (blank = all of them)
        required: false
        default: ""
        type: string
      after:
        description: Resume from this listings.id cursor (exclusive)
        required: false
        default: "0"
        type: string
      batch_size:
        description: Rows per keyset page — also the R2 fan-out and UPDATE width
        required: false
        default: "500"
        type: string
      max_seconds:
        description: Wall-clock budget in seconds (blank = no budget)
        required: false
        default: ""
        type: string
      rebuild_wait_seconds:
        description: How long a WRITING pass waits for a read-model rebuild gap before starting anyway
        required: false
        default: ""
        type: string
      ignore_rebuild:
        description: Start immediately, without waiting for a rebuild gap at all
        required: false
        default: false
        type: boolean
      verbose:
        description: Log every healed row's before/after areas (DEBUG)
        required: false
        default: false
        type: boolean

concurrency:
  group: backfill-area-spaced-thousands
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      # Inputs reach the shell as env vars, never interpolated into the script body.
      - name: Re-parse the truncated areas
        env:
          IN_WRITE: ${{ inputs.write }}
          IN_SOURCES: ${{ inputs.sources }}
          IN_LIMIT: ${{ inputs.limit }}
          IN_AFTER: ${{ inputs.after }}
          IN_BATCH_SIZE: ${{ inputs.batch_size }}
          IN_MAX_SECONDS: ${{ inputs.max_seconds }}
          IN_REBUILD_WAIT_SECONDS: ${{ inputs.rebuild_wait_seconds }}
          IN_IGNORE_REBUILD: ${{ inputs.ignore_rebuild }}
          IN_VERBOSE: ${{ inputs.verbose }}
        run: |
          ARGS="--after ${IN_AFTER:-0} --batch-size ${IN_BATCH_SIZE:-500}"
          if [ -n "$IN_SOURCES" ]; then ARGS="$ARGS --sources $IN_SOURCES"; fi
          if [ -n "$IN_LIMIT" ]; then ARGS="$ARGS --limit $IN_LIMIT"; fi
          if [ -n "$IN_MAX_SECONDS" ]; then ARGS="$ARGS --max-seconds $IN_MAX_SECONDS"; fi
          if [ "$IN_WRITE" = "true" ]; then ARGS="$ARGS --write"; fi
          if [ -n "$IN_REBUILD_WAIT_SECONDS" ]; then ARGS="$ARGS --rebuild-wait-seconds $IN_REBUILD_WAIT_SECONDS"; fi
          if [ "$IN_IGNORE_REBUILD" = "true" ]; then ARGS="$ARGS --ignore-rebuild"; fi
          if [ "$IN_VERBOSE" = "true" ]; then ARGS="$ARGS --verbose"; fi
          python -m scripts.backfill_area_spaced_thousands $ARGS
