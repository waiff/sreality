name: "CI: schema replay + SQL correctness"

# Two gates on one throwaway Postgres, hermetic (no secrets, never touches prod):
#
# 1. SCHEMA REPLAY — applies the full migrations/ chain (001 -> latest) to a fresh
#    PostGIS container in numeric order under ON_ERROR_STOP, catching a migration
#    that does not apply cleanly before it reaches the production Supabase database
#    (there is no staging DB). It pre-creates the Supabase roles the migrations
#    GRANT to (anon / authenticated / service_role) + pg_trgm via
#    ci_db_bootstrap.sql, and installs pgvector into the container so the guarded
#    clip/embedding objects (migration 226) actually get built — giving a schema
#    that matches prod's shape.
#
# 2. SQL CORRECTNESS — with that real schema in place, PREPAREs every SQL statement
#    the runtime code executes (auto-discovered by tests/sql_corpus.py) against it.
#    PREPARE parses + name-resolves + type-checks each query WITHOUT running it, so
#    a missing/renamed column, an illegal construct (e.g. count(DISTINCT) OVER), a
#    syntax error, or a bad function signature fails the PR — the class the fake DB
#    connections in the unit tests structurally cannot catch, and that has shipped
#    to prod. See tests/test_sql_schema_prepare.py.
#
# Advisory until added to branch protection as a required check.

on:
  push:
    paths:
      - "**/*.py"
      - "migrations/**"
      - "scripts/ci_db_bootstrap.sql"
      - "pyproject.toml"
      - ".github/workflows/migrations.yml"
  pull_request:
    paths:
      - "**/*.py"
      - "migrations/**"
      - "scripts/ci_db_bootstrap.sql"
      - "pyproject.toml"
      - ".github/workflows/migrations.yml"
  workflow_dispatch:

jobs:
  schema-and-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v6

      - name: Build + start Postgres (PostGIS + pgvector)
        # Build the image so pgvector is installed at BUILD time — the server
        # binary and every contrib .so (pg_trgm, postgis) then come from one
        # consistent apt transaction and the container starts fresh on that
        # binary. (Installing pgvector into an ALREADY-RUNNING container instead
        # upgrades contrib under the live server -> "undefined symbol" on load.)
        # pgvector must be present so migration 226's clip/embedding objects —
        # referenced by ~10 runtime files — actually build, or the sweep false-fails.
        run: |
          set -euo pipefail
          cat > /tmp/Dockerfile.ci <<'DOCKER'
          FROM postgis/postgis:17-3.4
          # Match production (17.x). The replay ran 15 for a long time, which silently
          # made every PG17-only check unassertable — MAINTAIN grants in particular, so
          # migration 331's revoke could drift back for a day without CI noticing.
          # Install server + PostGIS + pgvector in ONE apt transaction so the
          # binary and every contrib .so land at the same (newest) 17.x minor —
          # a partial upgrade is what triggers "undefined symbol" on load.
          RUN apt-get update \
            && apt-get install -y --no-install-recommends \
                 postgresql-17 postgresql-17-postgis-3 postgresql-17-pgvector \
            && rm -rf /var/lib/apt/lists/*
          DOCKER
          docker build -t ci-postgis-pgvector -f /tmp/Dockerfile.ci /tmp
          docker run -d --name ci-pg -e POSTGRES_PASSWORD=postgres -p 5432:5432 ci-postgis-pgvector
          for _ in $(seq 1 45); do
            if docker exec ci-pg pg_isready -U postgres -h localhost >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec ci-pg pg_isready -U postgres -h localhost

      - name: Bootstrap roles + extensions
        run: psql -v ON_ERROR_STOP=1 -f scripts/ci_db_bootstrap.sql

      - name: Apply migrations in numeric order
        run: |
          set -euo pipefail
          for f in $(ls migrations/*.sql | sort); do
            # 295 is gated on the operator's first signup having run the legacy
            # backfill (294's trigger). Simulate that signup at the exact point
            # production sequences it — this also exercises the signup trigger,
            # the atomic claim, and the backfill end-to-end in the replay.
            if [[ "$(basename "$f")" == 295_* ]]; then
              echo ">>> simulating the first signup (294 trigger: claim + legacy backfill)"
              psql -v ON_ERROR_STOP=1 -q -c \
                "insert into auth.users (email) values ('ci-operator@replay.local');"
            fi
            echo ">>> applying $f"
            psql -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: Sanity check (key relations exist + queryable)
        run: |
          psql -v ON_ERROR_STOP=1 \
            -c "select 'listings'::regclass, 'listing_snapshots'::regclass, 'properties'::regclass;" \
            -c "select 'listings_public'::regclass, 'properties_public'::regclass;" \
            -c "select 'image_clip_embeddings'::regclass;" \
            -c "select count(*) as listings_rows from listings;"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Python deps (for import-resolved SQL + the sweep)
        run: pip install -e ".[dev,api,geo]"

      # test_broker_sources joins the sweep because its statements are GENERATED
      # from the source registry, so no `*_SQL` constant exists for sql_corpus to
      # discover — they would be the one executed-SQL family nothing type-checks.
      - name: PREPARE every SQL statement against the replayed schema
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: pytest tests/test_sql_schema_prepare.py tests/test_broker_sources.py -q

      - name: Tenant-isolation sweep (RLS cross-tenant denial, Phase 1)
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: pytest tests/test_tenant_isolation_live.py -q

      # The location drain's bulk member read was the platform's single largest disk
      # consumer — 39,488 calls x 69,327 blocks = 2.74 BILLION blocks, because
      # listing_location_current carried 15 indexes and none led on property_id. The
      # statement type-checks either way, so the PREPARE sweep above passes with or
      # without migration 429's index, and the fake connections cannot produce a plan at
      # all. Only EXPLAIN against a real schema can tell the two apart.
      #
      # DB_RAILS_REQUIRED=1 is what makes this a rail rather than a wish: without it a
      # missing TEST_DATABASE_URL would report `skipped` and this step would stay green
      # while asserting nothing. With it, a misconfigured lane goes RED.
      - name: Location drain's bulk read stays index-servable (migration 429)
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          DB_RAILS_REQUIRED: "1"
        run: pytest tests/test_location_drain_index_plan.py -q

      # The admin gate is SECURITY DEFINER and, in all 10 tenancy policies, sits inside an
      # OR with column references — so it is not pseudoconstant and the executor calls it
      # once per candidate row (llm_calls: 293,551 rows). Migration 431 hoists it into an
      # InitPlan. Nothing else fails if that regresses: the rows returned are identical and
      # only the cost changes, and ALTER POLICY leaves no trace in the file that created
      # the policy — so only the replayed catalog can see it.
      - name: Admin gate stays hoisted on every policy (migration 431)
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          DB_RAILS_REQUIRED: "1"
        run: pytest tests/test_admin_gate_policies_live.py -q

      # The /costs rollups are only indexable because their bucket expressions name a
      # zone explicitly — a bare `called_at::date` is STABLE, and Postgres refuses to
      # index it (42P17). Revert either view and the index stops matching silently: the
      # plan falls back to the seq scan that discarded 231,189 rows for 93, with nothing
      # else failing. Only the replayed schema can see that the two still agree.
      - name: /costs rollups stay indexable (migration 421)
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: pytest tests/test_llm_cost_rollup_indexable.py -q

      # 422 replaced /health's `distinct on` with a recursive key-hop, which is subtle in
      # ways a shape assertion cannot see: the hop terminates by emitting a NULL, the seek
      # is a strict `>`, and an empty table must yield no rows rather than error. Executed
      # against the replayed schema, in a transaction that always rolls back.
      - name: /health pipeline checks stay latest-per-key (migration 422)
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: pytest tests/test_pipeline_checks_latest_per_key.py -q

      # The W2a-0 churn counters are an INSTRUMENT whose numbers decide a
      # tens-of-GB storage question, and their whole behaviour lives in one
      # ON CONFLICT clause. PREPARE proves it compiles; only executing it proves
      # the arithmetic (first fetch = 1/0, identical refetch = +1/+0, changed
      # refetch = +1/+1, replayed observation = +0/+0, version bump = new cohort).
      - name: Payload-churn counter arithmetic (executed, not just PREPAREd)
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: pytest tests/test_payload_churn_live.py -q

      # The W2 contract SHADOW gate is one predicate inside one view: a contract
      # that fails its frozen-sample floors writes claims that the resolver must
      # not see, and un-shadowing must bring the SAME rows back with no backfill.
      # PREPARE proves the view compiles; only executing it proves the predicate
      # excludes what it should, composes with the retraction predicate, and
      # leaves contract-less claims alone.
      - name: Contract-shadow view predicate (executed, not just PREPAREd)
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: pytest tests/location_data/test_contract_shadow_live.py -q

      # 06 W2a gate (b) — "a deliberately changed page appends a second body; an
      # unchanged refetch appends none" — is a property of one ON CONFLICT clause
      # and two retention statements. PREPARE proves they compile; only executing
      # them proves the collision, the version cap, the pin predicate and the
      # prp_body_present CHECK. Same lane, same reasoning as the churn step above.
      - name: Payload append-on-change semantics (executed, not just PREPAREd)
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: pytest tests/location_data/test_payloads.py -q

      # W2a-2 wires that store into the scrape chokepoint. The hermetic suite
      # proves WHICH fetches reach it; only real SQL proves the parameters it
      # passes satisfy the enum + CHECK + UNIQUE constraints, and that a replayed
      # drain batch collides instead of appending a second version.
      - name: Payload dual-write through the scrape chokepoint (executed)
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: pytest tests/test_payload_dual_write_live.py -q

      # W2a-5's pruner sweeps the same store on a cadence, and every property that
      # matters about it is a property of real constraints: that the cap re-asserts
      # over a group no append is coming to fix, that the edge pins and the claim FK
      # survive an age-based removal as well as a count-based one, and that the
      # ops-calendar row is created DISABLED on a fresh schema. A fake connection can
      # show the statement ran; only this can show the row is still there.
      - name: Payload archive pruner semantics (executed, not just PREPAREd)
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: pytest tests/location_data/test_payload_prune.py -q

      # W3's whole claim is that ONE row backs the property-grain per-m2: the
      # representative child's price over that same child's area. That lives in
      # which CTE feeds which SET item across a 300-line statement -- PREPARE
      # proves it compiles, the fake connections prove it ran, and neither can
      # see that the pair came from one listing or that the basis stamp is set.
      # Executed against the replayed schema, in a transaction that always rolls
      # back.
      - name: Property per-m2 measure keeps one source row (migration 424)
        timeout-minutes: 5
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: pytest tests/test_property_per_m2_source_live.py -q

      # W4's whole claim is that SIX relations publish ONE number. Nothing else
      # in CI can see that: the fake connections cannot evaluate SQL, and PREPARE
      # type-checks a statement without ever computing a value -- so a view left
      # on the UNROUNDED form compiles, passes the sweep, and silently skips rows
      # at the SPA's keyset page seam (migration 200). This seeds one property and
      # reads its Kc/m2 back through listings_public, properties_public,
      # browse_projection, listing_feed_public, browse_stats_properties and
      # pipeline_board_public, requiring byte identity -- plus the EXPLAIN
      # assertions that measure_price_per_m2 still INLINES (a `SET search_path`
      # added to it would turn every predicate into a per-row call) and that
      # browse_list's covering indexes survived the rebuild. Executed against the
      # replayed schema, in a transaction that always rolls back.
      - name: One measure, one definition, one label (migration 425)
        timeout-minutes: 5
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: pytest tests/test_measure_price_per_m2.py -q

      # W5's five per-m2 call sites are the one executed-SQL family the sweep
      # above CANNOT see: all five are assembled by in-function concatenation
      # into a local variable, so sql_corpus discovery reaches none of them
      # (verified: 760 discovered items, zero containing the per-m2 expression;
      # comparables.py -> 0 items, neighborhoods.py -> 0). `l.price_per_m2`
      # against the `listings` TABLE, which has no such column, is a 42703 that
      # no fake connection can raise -- it would ship green. This PREPAREs each
      # rendered statement against the replayed schema.
      - name: Per-m2 call sites PREPARE against the schema (W5)
        timeout-minutes: 5
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: pytest tests/test_measure_sql_prepare.py -q
