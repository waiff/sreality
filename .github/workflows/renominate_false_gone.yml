name: "Ops: re-check crawler listings a sreality check falsely delisted"

# Runs scripts/renominate_false_gone_crawler_rows.py (operator decision 2026-10-02): crawler
# listings (bazos, idnes, ...) carry a synthetic negative sreality_id, and until item 3 a
# sreality freshness fetch of that id read "not found" and flipped them inactive. This sends
# each such row to its OWN portal's detail drain as a presence check (QUEUE_PRIORITY_VERIFY),
# so a live page reactivates it and a gone page leaves it inactive with its inactive_at
# untouched. apply=false (the default) only prints the per-source counts.
#
# PILOT FIRST. The selection (2,061 rows on 2026-10-01) is an UPPER BOUND: the old writer
# also re-stamped rows their own portal had closed long before, and for those this is the
# first time the drain reads a page removed weeks ago -- ceskereality, realitymix and
# mmreality answer such URLs with HTTP 200 (archive page, substitute card). So:
#   1. apply=true with the default limit=25 (per source). The log prints a readout_since.
#   2. Once the drains have run, dispatch again with that readout_since (read-only). Stop
#      unless written_unseen=0 on every source, every "READOUT ROW ... CHECK=" row opens as
#      that listing's live detail page, and erroring_or_given_up is negligible -- a given-up
#      row on an inactive listing is re-armed by every walk, forever (fix the re-arm in
#      db.enqueue_presence_checks first). CHECK marks EVERY ceskereality, realitymix and
#      mmreality row (removed_url_200, at most 25 each), plus any row whose filled raw_json
#      values, spec cells or image URLs dropped against its snapshot from before, whose price
#      was lost, or that has no such snapshot. Content, not key counts: the HTML parsers
#      build the same keys for an archive page as for a live one.
#   3. Release the rest: apply=true, limit=all.
# Finish all passes within 7 days of the first: the "already read as gone by its portal"
# skip reads detail_queue_completions, which keeps 7 days, so a later pass re-fetches those
# pages (no data harm -- the rows are already inactive -- just wasted requests). The
# readout reads the same ledger, so read it back within the week too.
#
# Non-destructive: it only adds queue rows, deduplicated against rows already queued; the
# drains do every write through their usual paths (rule 3: page-verified, never deleted).
# NOT a portal ingest workflow, so it carries no `# portal:` tag.
#
# Required GitHub secret: SUPABASE_DB_URL.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "false = count only. true = enqueue the page checks."
        required: false
        default: false
        type: boolean
      limit:
        description: "Max rows enqueued PER SOURCE, newest flip first. 25 = the pilot; 'all' = release the rest"
        required: false
        default: "25"
        type: string
      source:
        description: "One crawler source (blank = every source but sreality)"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - bazos
          - bezrealitky
          - ceskereality
          - idnes
          - maxima
          - mmreality
          - realitymix
          - remax
      readout_since:
        description: "Read-only readout of the rows queued since this UTC time (the apply log prints it); leave apply=false"
        required: false
        default: ""
        type: string

concurrency:
  group: renominate-false-gone
  cancel-in-progress: false

jobs:
  renominate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      # Inputs reach the shell as env vars, never interpolated into the script body.
      - name: Re-nominate
        env:
          IN_APPLY: ${{ inputs.apply }}
          IN_LIMIT: ${{ inputs.limit }}
          IN_SOURCE: ${{ inputs.source }}
          IN_READOUT_SINCE: ${{ inputs.readout_since }}
        run: |
          set -euo pipefail
          IN_LIMIT="${IN_LIMIT// /}"
          case "$IN_LIMIT" in
            all|ALL) ;;
            ""|*[!0-9]*) echo "::error::limit must be a positive whole number or 'all'"; exit 1 ;;
          esac
          case "$IN_READOUT_SINCE" in
            *[!0-9TZ:+.\ -]*) echo "::error::readout_since must be an ISO timestamp, e.g. 2026-10-02T10:00Z"; exit 1 ;;
          esac
          if [ -n "$IN_READOUT_SINCE" ] && [ "$IN_APPLY" = "true" ]; then
            echo "::error::readout_since only reads; dispatch it with apply=false"; exit 1
          fi
          ARGS=(--limit "$IN_LIMIT")
          if [ -n "$IN_SOURCE" ]; then ARGS+=(--source "$IN_SOURCE"); fi
          if [ -n "$IN_READOUT_SINCE" ]; then ARGS+=(--readout-since "$IN_READOUT_SINCE"); fi
          if [ "$IN_APPLY" = "true" ]; then ARGS+=(--apply); fi
          python -m scripts.renominate_false_gone_crawler_rows "${ARGS[@]}"
