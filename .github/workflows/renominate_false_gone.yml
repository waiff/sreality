name: "Ops: re-check crawler listings a sreality check falsely delisted"

# Runs scripts/renominate_false_gone_crawler_rows.py (operator decision 2026-10-02): crawler
# listings (bazos, idnes, ...) carry a synthetic negative sreality_id, and until item 3 a
# sreality freshness fetch of that id read "not found" and flipped them inactive. This sends
# each such row to its OWN portal's detail drain as a presence check (QUEUE_PRIORITY_VERIFY),
# so a live page reactivates it and a gone page leaves it inactive with its inactive_at
# untouched. apply=false (the default) only prints the per-source counts.
#
# Non-destructive: it only adds queue rows, deduplicated against rows already queued; the
# drains do every write through their usual paths (rule 3: page-verified, never deleted).
# Re-running is safe: queued rows and rows the drain has since read as gone are skipped.
# NOT a portal ingest workflow, so it carries no `# portal:` tag.
#
# Required GitHub secret: SUPABASE_DB_URL.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "false = count only. true = enqueue the page checks."
        required: false
        default: false
        type: boolean
      limit:
        description: "Max rows enqueued PER SOURCE this run, newest flip first (blank = all)"
        required: false
        default: ""
        type: string
      source:
        description: "One crawler source (blank = every source but sreality)"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - bazos
          - bezrealitky
          - ceskereality
          - idnes
          - maxima
          - mmreality
          - realitymix
          - remax

concurrency:
  group: renominate-false-gone
  cancel-in-progress: false

jobs:
  renominate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      # Inputs reach the shell as env vars, never interpolated into the script body.
      - name: Re-nominate
        env:
          IN_APPLY: ${{ inputs.apply }}
          IN_LIMIT: ${{ inputs.limit }}
          IN_SOURCE: ${{ inputs.source }}
        run: |
          set -euo pipefail
          IN_LIMIT="${IN_LIMIT// /}"
          case "$IN_LIMIT" in
            *[!0-9]*) echo "::error::limit must be a positive whole number (or blank)"; exit 1 ;;
          esac
          ARGS=""
          if [ -n "$IN_LIMIT" ]; then ARGS="$ARGS --limit $IN_LIMIT"; fi
          if [ -n "$IN_SOURCE" ]; then ARGS="$ARGS --source $IN_SOURCE"; fi
          if [ "$IN_APPLY" = "true" ]; then ARGS="$ARGS --apply"; fi
          python -m scripts.renominate_false_gone_crawler_rows $ARGS
