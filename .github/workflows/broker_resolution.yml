name: Broker resolution (incremental)

# Broker intelligence: the THROTTLED BACKSTOP of the incremental identity
# resolver (Broker Unify W3). The primary host is the realtime worker's
# broker_maintenance lane; both call THE same driver,
# scripts.resolve_brokers.run_incremental_pass — drain the dirty_broker_listings
# queue until empty (new + content-changed listings enqueued at write time by
# the detail writers, plus delist/revive flips mirrored in by the property
# drain), attribute to per-source broker_identities, ensure firms, attach
# singleton canonical brokers, recompute ONLY the affected brokers' rollups +
# memberships (one merged statement), and republish the leaderboard matview
# CONCURRENTLY when its derived_artifacts stamp is older than ~an hour. So this
# cron matters exactly when the worker is down. O(changes); source-agnostic
# maintenance job, so it carries NO `# portal:` tag. Shares the broker-resolution
# concurrency group with the full sweep so the two never mutate at once.
#
# Required secret: SUPABASE_DB_URL.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

# Per-workflow group (NOT shared with the full sweep) so neither cancels the other's
# pending run. Cross-workflow mutual exclusion is the DB lock (broker_resolution_lock,
# migration 192): this incremental skips cleanly when the full sweep holds it.
concurrency:
  group: broker-resolution-incremental
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    # <= resolve_brokers._LOCK_STALE_MIN (20). The pass heartbeats the lock inside
    # every retried phase, so this kill lands no later than the lock's own staleness
    # window: a live incremental can never be declared stale and have its lock stolen,
    # and its heartbeat can never raise the lost-lock abort. Keep the two equal.
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[api]"
      - name: Resolve brokers (incremental)
        run: python -m scripts.resolve_brokers --incremental
