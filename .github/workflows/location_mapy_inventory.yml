name: "Jobs: Mapy affected-set inventory (location W1 / R2)"

# DISPATCH-ONLY evidence job for the Mapy.cz licensing remediation. Materialises
# the five-arm affected set of the location design (04-connectors-ops.md C7.2 R2)
# into the immutable tables of migration 385: per-listing arm evidence, the
# geocode_cache identity ledger, and the property closure. It records IDENTITY
# and REASON CODES only — never a coordinate, matched_type or confidence, which
# would be the same storage violation the remediation exists to end.
#
# It is a W1 INPUT: the first location claim must not be written before this has
# run to completion, and W4's purge uses the same rows as its before/after ledger.
# Read-only against listings/geocode_cache; writes only the new tables.
#
# The scan walks every listing (active AND inactive) by keyset and detoasts
# raw_json per row, so it is I/O-heavy and resumable — re-dispatch until the log
# prints `complete`. Re-runs never duplicate.
#
# Required secret: SUPABASE_DB_URL.

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: listings per batch (10000-30000; blank = 20000)
        required: false
        default: ""
        type: string
      limit:
        description: max listings scanned this run (blank = the whole table)
        required: false
        default: ""
        type: string
      max_seconds:
        description: wall-clock budget; stops between batches (blank = none)
        required: false
        default: ""
        type: string
      restart:
        description: "rescan from the first listing instead of resuming"
        required: false
        default: false
        type: boolean
      note:
        description: free-text note stamped on the run row
        required: false
        default: ""
        type: string
      dry_run:
        description: "scan and report the arm counts without writing anything"
        required: false
        default: false
        type: boolean

concurrency:
  # Its own group: two concurrent inventory runs would fight over the same keyset
  # high-water mark and each re-scan the other's batches. Never cancel a run
  # in-flight — a cancelled run keeps its progress, but a cancelled batch is
  # rolled back whole.
  group: location-mapy-inventory
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      - name: Run the Mapy affected-set inventory
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BATCH_SIZE: ${{ inputs.batch_size }}
          LIMIT: ${{ inputs.limit }}
          MAX_SECONDS: ${{ inputs.max_seconds }}
          RESTART: ${{ inputs.restart }}
          NOTE: ${{ inputs.note }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=""
          if [ -n "$BATCH_SIZE" ]; then ARGS="$ARGS --batch-size $BATCH_SIZE"; fi
          if [ -n "$LIMIT" ]; then ARGS="$ARGS --limit $LIMIT"; fi
          if [ -n "$MAX_SECONDS" ]; then ARGS="$ARGS --max-seconds $MAX_SECONDS"; fi
          if [ "$RESTART" = "true" ]; then ARGS="$ARGS --restart"; fi
          if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          echo "python -m scripts.location_mapy_inventory $ARGS --note <note>"
          if [ -n "$NOTE" ]; then
            python -m scripts.location_mapy_inventory $ARGS --note "$NOTE"
          else
            python -m scripts.location_mapy_inventory $ARGS
          fi
