name: "Location: resolve"

# The steady-state resolution lane of the location subsystem (design 03 §3.14.1). Without
# it a newly scraped listing gets claims and never gets a resolution — no row in
# listing_location_current, invisible to Browse, map, watchdog and dedup.
#
#   mode=drain         `location_resolve_incremental` — claims dirty_locations in bounded
#                      slices (FOR UPDATE SKIP LOCKED), resolves S1-S9 and rebuilds the
#                      projection row in the SAME transaction. Runs every 15 minutes; judge
#                      the queue by oldest-row AGE, not by length. The run measures itself:
#                      every batch logs `BATCH n=… rate=…/s` and the phase split.
#   mode=epoch         `pin_collision_recompute` — mints a NEW immutable pin_cluster_epochs
#                      row plus its pin_clusters, then enqueues only the listings whose
#                      bucket changed. An epoch that never advances silently freezes
#                      precision.
#   mode=full-resolve  `location_resolve_sweep` — the reconcile backstop: enqueue everything
#                      whose projection is missing or built at a stale version tuple, then
#                      drain it.
#
# Both jobs take a lease-row CAS on location_jobs, never a session advisory lock (a lock
# taken on one transaction-pooler backend and released on another strands), and the
# concurrency group below is the second guard. The CAS is correct on either pooler mode,
# which is why the drain can take the SESSION pooler for its prepared-statement throughput.
#
# The two budgets are deliberately different. The `*/15` CRON keeps a 600 s budget so a tick
# always finishes well inside its own cadence; a DISPATCH defaults to 2400 s, which is the
# corpus-shaped setting (the queue is worked down by dispatching, not by waiting for cron).
# `timeout-minutes` has to stay above the largest budget plus checkout/install, or the job is
# killed mid-batch and the slice's rows come back on the next tick.
#
# Required secrets: SUPABASE_DB_URL, SUPABASE_DB_SESSION_URL (the session-mode pooler the
# drain's hot loop wants — without it the drain still runs, several times slower, and says so).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "what to run"
        required: true
        default: drain
        type: choice
        options:
          - drain
          - epoch
          - full-resolve
      max_seconds:
        description: "drain budget in seconds (drain / full-resolve); cron uses 600"
        required: false
        default: "2400"
        type: string
      batch_size:
        description: "listings claimed per slice (one transaction — bigger is not better)"
        required: false
        default: "250"
        type: string
      sources:
        description: "epoch mode: comma-separated portals; blank = every source"
        required: false
        default: ""
        type: string
      dry_run:
        description: "resolve and log, write nothing"
        required: false
        default: false
        type: boolean
  schedule:
    # Steady state: every 15 minutes, `mode=drain` on the cron budget (the env block below
    # falls back to 600 s / batch 250 when a run carries no dispatch inputs). The queue is a
    # few hundred newly scraped listings per tick; judge it by oldest-row AGE, not length.
    #
    # This cron was REMOVED for the duration of the W1 backfill and restored when the corpus
    # sweep finished. The reason it had to go, in case a future backfill needs the same move:
    # the outer `location-batch` group holds ONE pending slot, GitHub supersedes the older
    # pending entry, and while a driver dispatches back-to-back 55-minute runs the entry a
    # tick displaces is the driver's own next dispatch. A `*/15` tick added nothing to a
    # 630 k queue it was draining from the same front — it only took the slot.
    - cron: "*/15 * * * *"

concurrency:
  # OUTER, cross-lane: shared with the registry load, the claim intake and the Mapy
  # inventory so at most ONE heavy location lane runs at a time. On 2026-08-10 this drain
  # (run 31439340945) wedged mid-batch for 30 minutes with no error while a registry
  # boundary pack, a claims intake and an inventory scan hammered the same instance. The
  # drain is cadenced, so queueing behind a long registry load is the intended trade: the
  # queue IS the cursor, a skipped tick costs nothing, and GitHub supersedes an older
  # pending run so ticks collapse instead of piling up. See location_registry_load.yml.
  group: location-batch
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    concurrency:
      # INNER, per-lane: 00 §14's `location-resolve` group. The epoch job declares
      # `location-collision` in its own lease row; it shares this group so a recompute never
      # overlaps a drain that is reading the epoch it is replacing.
      group: location-resolve
      cancel-in-progress: false
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_DB_SESSION_URL: ${{ secrets.SUPABASE_DB_SESSION_URL }}
      MODE: ${{ inputs.mode || 'drain' }}
      MAX_SECONDS: ${{ inputs.max_seconds || '600' }}
      BATCH_SIZE: ${{ inputs.batch_size || '250' }}
      SOURCES: ${{ inputs.sources }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e "."

      - name: Run
        run: |
          set -euo pipefail
          ARGS=""
          if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          case "$MODE" in
            drain)
              python -m location_data.resolver.drain \
                --max-seconds "$MAX_SECONDS" --batch-size "$BATCH_SIZE" $ARGS
              ;;
            epoch)
              python -m location_data.resolver.epoch_job --sources "$SOURCES" $ARGS
              ;;
            full-resolve)
              python -m location_data.resolver.drain --full-sweep \
                --max-seconds "$MAX_SECONDS" --batch-size "$BATCH_SIZE" $ARGS
              ;;
            *)
              echo "unknown mode: $MODE" >&2
              exit 2
              ;;
          esac
