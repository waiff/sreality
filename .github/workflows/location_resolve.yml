name: "Location: resolve"

# The steady-state resolution lane of the location subsystem. Without it a newly scraped
# listing gets claims and never gets an answer row in `listing_location` — invisible to
# every consumer of the location programme.
#
#   mode=drain         `location_resolve_incremental` — claims dirty_locations in bounded
#                      slices (FOR UPDATE SKIP LOCKED), runs bind -> fill -> grade -> check
#                      and writes the answer row in the SAME transaction. Runs every 15
#                      minutes; judge the queue by oldest-row AGE, not by length. The run
#                      measures itself: every batch logs `BATCH n=… rate=…/s` and the phase
#                      split.
#   mode=full-resolve  `location_resolve_sweep` — the reconcile backstop AND the way a
#                      version bump reaches the corpus: ONE statement off `listings`
#                      enqueues every active listing whose answer row is missing or carries
#                      a stale (resolver_version, registry_version) pair, then the drain
#                      works it.
#
# `mode=epoch` (`pin_collision_recompute`) and its Sunday cron were REMOVED in W2-a with the
# pin-collision engine itself: `collision_epoch_id` was the fifth version input of a
# resolution identity that now has three, `pin_clusters` fed a precision axis the answer
# table does not carry, and the job had been unscheduled since 2026-08-11 anyway.
#
# Both jobs take a lease-row CAS on location_jobs, never a session advisory lock (a lock
# taken on one transaction-pooler backend and released on another strands), and the
# concurrency group below is the second guard. The CAS is correct on either pooler mode,
# which is why the drain can take the SESSION pooler for its prepared-statement throughput.
#
# The two budgets are deliberately different. The CRON keeps a budget that finishes well
# inside its own cadence — and the cadence is NOT 15 minutes: GitHub fires this repo's
# schedules ~hourly at best (measured 2026-07-07 fleet-wide, re-measured 2026-09-10: 7 ticks
# in 24 h), so the 600 s budget that fit a 15-minute tick drained ~500 listings per tick at
# the measured 0.7 listings/s and ~4k a day. 1800 s still ends well inside an hourly tick and
# triples that. A DISPATCH defaults to 2400 s, the corpus-shaped setting (the queue is worked
# down by dispatching, not by waiting for cron).
# `timeout-minutes` has to stay above the largest budget plus checkout/install, or the job is
# killed mid-batch and the slice's rows come back on the next tick.
#
# Required secrets: SUPABASE_DB_URL, SUPABASE_DB_SESSION_URL (the session-mode pooler the
# drain's hot loop wants — without it the drain still runs, several times slower, and says so).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "what to run"
        required: true
        default: drain
        type: choice
        options:
          - drain
          - full-resolve
      max_seconds:
        description: "drain budget in seconds (drain / full-resolve); cron uses 1800"
        required: false
        default: "2400"
        type: string
      batch_size:
        description: "listings claimed per slice (one transaction — bigger is not better)"
        required: false
        default: "250"
        type: string
      dry_run:
        description: "resolve and log, write nothing"
        required: false
        default: false
        type: boolean
  schedule:
    # Steady state: every 15 minutes, `mode=drain` on the cron budget (the env block below
    # falls back to 1800 s / batch 250 when a run carries no dispatch inputs). The queue is a
    # few hundred newly scraped listings per tick; judge it by oldest-row AGE, not length.
    #
    # This cron was REMOVED for the duration of the W1 backfill and restored when the corpus
    # sweep finished, then paused again 2026-08-18 and restored 2026-08-19 for W3's. The
    # reason it has to go each time: the outer `location-batch` group holds ONE pending slot,
    # GitHub supersedes the older pending entry, and while a driver dispatches back-to-back
    # 55-minute runs the entry a tick displaces is the driver's own next dispatch.
    #
    # W3 added the measurement W1 only asserted. Over eleven ticks on 2026-08-18 a run here
    # occupied the group 11-27 minutes on this 15-minute cadence, so the lane oversubscribes
    # `location-batch` BY ITSELF: about one tick in three completed and the rest superseded
    # each other. That is why pausing the hourly claim intake alone did not free a slot, and
    # why a backfill that needs this group should expect to pause both.
    - cron: "*/15 * * * *"
    # The DAILY reconcile backstop (`mode=full-resolve`, one sweep off `listings`). It existed
    # only behind `workflow_dispatch` until 2026-09-11, so the net every other repair mechanism
    # leans on was never deployed (audit finding projection-6). The env block below maps the
    # cron expression to its mode; a cron carries no inputs, so the expression is the only
    # thing that can name it. The Sunday `41 4 * * 0` epoch tick went with the epoch job.
    - cron: "17 3 * * *"

# The group depends on the MODE, because the two modes are not the same animal.
#
# `drain` left the outer `location-batch` group on 2026-09-10. `full-resolve`
# did NOT, and the reason is a production failure the same afternoon: its FIRST step is one
# corpus-wide `INSERT ... ON CONFLICT` into `dirty_locations`, and the archived-HTML sweep
# bulk-inserts into that same table with overlapping listing ids. Two transactions inserting
# the same key means the second WAITS for the first to commit, so the sweep died on
# `LockNotAvailable: canceling statement due to lock timeout` (run 34456211996, 09:17Z) and
# its self-chain stopped with it. The enqueue is a heavy corpus-wide writer — exactly what
# the outer group is for — even though the drain that follows it is not.
#
# `github.event.inputs.mode` is empty on a schedule, so a cron tick takes the drain branch.
concurrency:
  group: ${{ (github.event.inputs.mode == 'full-resolve' || github.event.schedule == '17 3 * * *') && 'location-batch' || 'location-resolve-lane' }}
  cancel-in-progress: false

# Why the DRAIN left that group on 2026-09-10 (operator decision), reversing the 2026-08-10
# incident response for this one member. What that group buys and what it cost here:
#
#   The group serializes the heavy location lanes so at most one hammers the shared instance
#   — the answer to the night four of them dropped backends and wedged this drain mid-batch
#   (run 31439340945, 30 minutes of silence). The trade was stated as free: "the drain is
#   cadenced, the queue IS the cursor, a skipped tick costs nothing."
#
#   That trade stopped being free when the queue stopped being small. Measured 2026-09-10:
#   the drain resolves 0.7 listings/s (11 registry round-trips per listing at ~120 ms from a
#   US runner to the EU instance), GitHub fires this schedule ~7x/day, and the W2-13 archived
#   HTML sweeps now hold the group for ~55 minutes at a time BACK TO BACK (they self-chain).
#   Between 05:59Z and 08:57Z the lane got zero ticks while the queue stood above 100k rows.
#   A skipped tick costs nothing only when the next tick catches up; here they never do.
#
#   Leaving the group is safe for the DRAIN because it is the light one: 11 small indexed
#   reads plus one projection write per listing, no COPY, no corpus scan, no detoast — it is
#   latency-bound, not instance-bound, which is also why it gains so little from queueing and
#   loses so much. It READS the claim spine the intake and the archive sweep write, so it
#   does not carry their "must never overlap" constraint; those two stay in the group.
#
#   That argument was first written as if it covered the whole LANE, and it does not — the
#   `full-resolve` mode opens with a corpus-wide bulk INSERT that is instance-heavy by every
#   measure the sentence above uses to excuse the drain. Correcting that cost a sweep run
#   and its chain the same afternoon; see the mode-conditional group above.
#
# Two guards remain and are the real ones: the job-level `location-resolve` group below
# (this lane never overlaps ITSELF) and the `location_jobs` lease-row CAS in the drain
# (a second drainer — including the Railway worker lane — finds the lease held and exits).
# Rails: tests/location_data/test_location_batch_hardening.py.

jobs:
  resolve:
    runs-on: ubuntu-latest
    concurrency:
      # INNER, per-lane: the `location-resolve` group. This lane never overlaps ITSELF.
      group: location-resolve
      cancel-in-progress: false
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_DB_SESSION_URL: ${{ secrets.SUPABASE_DB_SESSION_URL }}
      MODE: ${{ inputs.mode || (github.event.schedule == '17 3 * * *' && 'full-resolve') || 'drain' }}
      MAX_SECONDS: ${{ inputs.max_seconds || '1800' }}
      BATCH_SIZE: ${{ inputs.batch_size || '250' }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e "."

      - name: Run
        run: |
          set -euo pipefail
          ARGS=""
          if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          case "$MODE" in
            drain)
              python -m location_data.resolver.drain \
                --max-seconds "$MAX_SECONDS" --batch-size "$BATCH_SIZE" $ARGS
              ;;
            full-resolve)
              python -m location_data.resolver.drain --full-sweep \
                --max-seconds "$MAX_SECONDS" --batch-size "$BATCH_SIZE" $ARGS
              ;;
            *)
              echo "unknown mode: $MODE" >&2
              exit 2
              ;;
          esac
