name: Backfill area_basis (the provenance stamp migration 423 never filled)

# One-off, dispatch-only backfill for the per-m² measure program's open item 2.
# Migration 423 added `listings.area_basis` with no backfill, so it fills only as
# rows are detail-drained — 24.1% of the table, and ZERO rows anywhere carry
# `plot`, which leaves every gate written on `area_basis` alone inert and reading
# "not land" for every parcel in the database. This does NOT re-derive the
# headline area: `scraper.area.derive_headline_area` stays the single definition
# of the precedence and the token vocabulary, and the script CALLS it, feeding it
# the one measure the stored columns prove was the winner. Three inferences are
# exact — land (`plot` is a function of area_m2 alone), a NULL area (the function
# returned no basis), and the `usable_area` column on the six portals that store
# it un-collapsed, plus bazos whose only arm is `fallback`. idnes and
# ceskereality are DECLINED by design: both collapse usable/floor/total into that
# one column, so a match there would fabricate a provenance claim on ~183k rows.
# Writes nothing but `listings.area_basis`, which is out of every content hash —
# so NO snapshot, no value change, and neither trigger on `listings` fires. DML,
# not DDL: no ACCESS EXCLUSIVE, so it cannot head-block a writer; it still
# refuses to start while a read-model rebuild is active. Keyset-paginated over a
# narrow projection that detoasts nothing; idempotent without a marker, and
# `--after` resumes. NOT a portal ingest workflow, so it carries no `# portal:`
# tag.
#
# The script DEFAULTS TO DRY-RUN: it reports and exits unless `write` is true.
#
# Required GitHub secret: SUPABASE_DB_URL.

on:
  workflow_dispatch:
    inputs:
      write:
        description: Actually write. Left false, this only reports what would change.
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      limit:
        description: Max listings examined this run (blank = the whole table)
        required: false
        default: ""
        type: string
      after:
        description: Resume from this listings.id cursor (exclusive)
        required: false
        default: "0"
        type: string
      batch_size:
        description: Rows per keyset page
        required: false
        default: "5000"
        type: string
      max_seconds:
        description: Wall-clock budget in seconds (blank = no budget)
        required: false
        default: ""
        type: string
      ignore_rebuild:
        description: Start even while a read-model rebuild is active
        required: false
        default: false
        type: boolean
      verbose:
        description: Log every individual stamp (DEBUG)
        required: false
        default: false
        type: boolean

concurrency:
  group: backfill-area-basis
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      - name: Stamp area_basis
        run: |
          ARGS="--after ${{ inputs.after || '0' }} --batch-size ${{ inputs.batch_size || '5000' }}"
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          if [ -n "${{ inputs.max_seconds }}" ]; then ARGS="$ARGS --max-seconds ${{ inputs.max_seconds }}"; fi
          if [ "${{ inputs.write }}" = "true" ]; then ARGS="$ARGS --write"; fi
          if [ "${{ inputs.ignore_rebuild }}" = "true" ]; then ARGS="$ARGS --ignore-rebuild"; fi
          if [ "${{ inputs.verbose }}" = "true" ]; then ARGS="$ARGS --verbose"; fi
          python -m scripts.backfill_area_basis $ARGS
