name: "Ops: retire claims under old contract versions"

# Deletes every `location_claims` row written under a RETIRED contract version
# (`portal_contracts.is_active = false`) — W6-a of the location simplification
# sprint, ~9.5 M of ~13.2 M rows measured 2026-09-13. The resolver has never read
# them: it admits a claim only under an ACTIVE contract header, or an operator
# claim with no contract entry at all. So no verdict moves and NOTHING is enqueued
# into `dirty_locations` — which is what separates this from
# `contracts.py --retract`, the mechanism that withdraws a version's evidence
# BECAUSE it was wrong and must re-resolve every listing it touched.
#
# TWO STEPS, in this order, and the first is the point of the workflow:
#
#   1. THE BACKUP (CLAUDE.md rule 1's pg_dump equivalent). `\copy` of the doomed
#      rows — the exact join the delete uses — to a gzipped CSV, uploaded as an
#      artifact with 90-day retention. The step prints the file size; a backup
#      nobody sized is a backup nobody checked. It runs on dry_run too, so the
#      operator can hold the CSV before arming anything.
#   2. THE DELETE. `scripts.location_claims_retire`, 20,000-row id-keyset batches,
#      `lock_timeout 5s` + `statement_timeout 120s` per batch, 0.5 s between them,
#      resumable: a re-dispatch continues from wherever the last run stopped,
#      because the cursor is re-derived from the same predicate.
#
# dry_run=true (the default) resolves the doomed set, counts it and deletes
# nothing. The real delete needs dry_run=false AND confirm=RETIRE.
#
# A budget-exhausted run exits NON-ZERO on purpose (`--max-seconds`, default
# 20,000 s inside a 5.5 h job): a red run is the honest signal that work is left,
# and re-dispatching finishes it. Nothing is left half-applied — the budget is
# checked between batches, never inside one.
#
# Required secrets: SUPABASE_DB_URL (SUPABASE_DB_SESSION_URL preferred for the
# `\copy`, which is one long-running statement).

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = back up + count only. false = delete (needs confirm=RETIRE)."
        required: false
        default: true
        type: boolean
      confirm:
        description: "Type RETIRE to arm the delete. Ignored when dry_run=true."
        required: false
        default: ""
        type: string
      batch_size:
        description: "rows per DELETE statement"
        required: false
        default: "20000"
        type: string
      max_seconds:
        description: "wall-clock budget; stops between batches, never mid-batch"
        required: false
        default: "20000"
        type: string

concurrency:
  # The shared cross-lane group (see location_registry_load.yml): at most ONE heavy
  # location lane at a time. A 9.5 M-row delete beside the hourly intake and the
  # */15 resolve drain is exactly the 2026-08-10 incident this group exists to stop.
  group: location-batch
  cancel-in-progress: false

jobs:
  retire:
    runs-on: ubuntu-latest
    concurrency:
      # INNER, per-lane: two concurrent retires would walk the same keyset and each
      # re-scan the rows the other deleted. Never cancel in flight — a cancelled
      # batch rolls back whole, and the run's committed batches are real progress.
      group: location-claims-retire
      cancel-in-progress: false
    # The delete's own budget is 20,000 s; this leaves room for the `\copy` of a
    # multi-GB CSV ahead of it and stays inside GitHub's 6 h job ceiling.
    timeout-minutes: 340
    permissions:
      contents: read
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      DATABASE_URL: ${{ secrets.SUPABASE_DB_SESSION_URL || secrets.SUPABASE_DB_URL }}
      PGCONNECT_TIMEOUT: "15"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      # THE BACKUP. The predicate is the delete's predicate, written as the join
      # rather than as a subquery so that a reader can see it is the same set.
      # `c.*` — every column, so the CSV is a restorable copy and not a summary.
      - name: Back up the doomed rows (gzipped CSV)
        run: |
          set -o pipefail
          psql -X -v ON_ERROR_STOP=1 "$DATABASE_URL" \
            -c "\copy (select c.* from location_claims c join portal_contract_entries e on e.id = c.contract_entry_id join portal_contracts pc on pc.id = e.contract_id where not pc.is_active) to stdout csv header" \
            | gzip > retired_claims.csv.gz
          ls -l retired_claims.csv.gz
          echo "backup size: $(du -h retired_claims.csv.gz | cut -f1) ($(stat -c%s retired_claims.csv.gz) bytes)"

      - name: Upload the backup
        uses: actions/upload-artifact@v4
        with:
          name: retired-claims-backup
          path: retired_claims.csv.gz
          retention-days: 90
          if-no-files-found: error

      - name: Guard the real delete
        if: ${{ !inputs.dry_run }}
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "RETIRE" ]; then
            echo "::error::dry_run=false requires confirm=RETIRE"
            exit 1
          fi

      - name: Plan + count (delete nothing)
        if: ${{ inputs.dry_run }}
        run: python3 -m scripts.location_claims_retire --dry-run

      - name: Delete in bounded batches
        if: ${{ !inputs.dry_run }}
        env:
          BATCH_SIZE: ${{ inputs.batch_size }}
          MAX_SECONDS: ${{ inputs.max_seconds }}
        run: |
          set -o pipefail
          python3 -m scripts.location_claims_retire \
            --confirm RETIRE \
            --batch-size "$BATCH_SIZE" \
            --max-seconds "$MAX_SECONDS"

      # Reported, never asserted: autovacuum reclaims the space on its own schedule
      # and a VACUUM here would be a second heavy statement on a hot table.
      - name: Report what the table looks like afterwards
        if: ${{ !inputs.dry_run }}
        run: |
          psql -X -v ON_ERROR_STOP=1 "$DATABASE_URL" -c \
            "select n_live_tup, n_dead_tup, last_autovacuum, last_autoanalyze
               from pg_stat_user_tables where relname = 'location_claims';"
          psql -X -v ON_ERROR_STOP=1 "$DATABASE_URL" -c \
            "select pg_size_pretty(pg_total_relation_size('location_claims')) as total,
                    pg_size_pretty(pg_table_size('location_claims')) as heap;"
