name: "CI: frontend build"

# Builds the frontend/ Vite SPA on every push or pull request that touches
# frontend code, to catch build/type errors before deploy. Type-checks, lints
# for Rules of Hooks, builds the production bundle, reports every chunk's
# gzipped size, and enforces a blocking first-visit JS budget that also fails
# if maplibre or recharts return to the pre-lazy-import path. Does not deploy.

on:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-build.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm install
      - run: npm run typecheck
      # Rules of Hooks (a runtime React contract tsc can't see). Catches a hook
      # called conditionally / after an early return — the bug that blanked
      # Listing Detail. Errors fail the build; exhaustive-deps stays a warning.
      - run: npm run lint
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-build-only
      - name: All chunk sizes (informational)
        run: |
          du -sh dist
          for f in dist/assets/*.js; do
            sz=$(gzip -c "$f" | wc -c)
            printf '  %-50s %10s bytes gzip\n' "$(basename "$f")" "$sz"
          done
      # BLOCKING. The previous budget summed `index-*.js` alone and called it "what loads
      # before any lazy import", noting maplibre/recharts "only count when their route is
      # opened" — which was false: both were modulepreloaded on every route, so it read
      # ~239 kB and stayed green while a first visit cost ~608 kB. This measures the entry
      # PLUS every preload PLUS their static imports, and fails if either heavy library is
      # back on that path (matched by content, not filename — Rollup renames auto-split
      # chunks). See frontend/scripts/bundle-budget.mjs.
      - name: First-visit JS budget
        run: node scripts/bundle-budget.mjs
