name: Dedup — CLIP image tagging (sharded)

# Backfills image_clip_tags + image_clip_embeddings: the self-hosted CLIP zero-shot
# tag per stored image (free replacement for the paid room classifier on the coarse
# dedup-relevant tags, and the FIRST tagger for dum/pozemek/komercni). Runs GLOBAL
# full-scale by default (the Středočeský priority drain is complete; pass region_id
# on dispatch to re-prioritise a kraj). ACTIVE-listing images first; idempotent +
# resumable (a tagged image drops out of the next select), so once caught up the
# hourly runs are cheap no-ops that just keep pace with new inflow.
# Horizontally sharded into 4 parallel jobs (image_id %% 4), each with its own
# runner + cap, like images.yml. Installs CPU torch + the `clip` extra
# (transformers); the production CLIP could move to int8-ONNX later as an
# optimization. NOT a portal ingest job (untagged, portal: null).
#
# G4 (2026-09-27): each shard then gives the live autodedup lane's scope (autodedup.rt_scope_ids)
# its DINOv3 v1 head tags — the vector under v1's own identity (dinov3-b16@768, letterbox_pad, bf16:
# bf16 on CPU, so the population is the heads' own) and the active tag model's winner in
# image_tag_scores, which `image_tags = heads` reads and the F3 hold waits for. Scoped, not global:
# the trial scope takes in ~400-950 images a day (~20-40 an hour) and one shard embeds ~40 in its
# 1,500 s budget (bf16 on a CPU without native bf16: ~37 s an image on 4 threads, measured on an
# i7-1260P; unmeasured on the runner), so the four shards carry ~160 an hour; the corpus and any
# scope growth are backfilled on a GPU (dinov3_embed_backfill.yml, scope rt / all).
#
# Required secrets: SUPABASE_DB_URL + the R2_* set (same as compute_image_phash.yml), HF_TOKEN
# (the DINOv3 weights are licence-gated).

on:
  schedule:
    - cron: "40 * * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: Max images tagged per shard per run
        required: false
        default: "20000"
        type: string
      workers:
        description: Parallel R2 downloads
        required: false
        default: "16"
        type: string
      region_id:
        description: Priority kraj id to drain first, then fall through to global ("none" = global full-scale, the default now that Středočeský is complete).
        required: false
        default: "none"
        type: string
      categories:
        description: Comma category_main list to scope with region_id (e.g. dum,komercni)
        required: false
        default: "dum,komercni"
        type: string
      dry_run:
        description: Report the pending count and exit without tagging
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: clip-tag
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      HF_HUB_DOWNLOAD_TIMEOUT: "60"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Cache the ~600 MB CLIP weights so the 4 parallel shards stop re-downloading
      # them from HuggingFace every run (the concurrent pulls 503'd, failing 2/4
      # shards). After the first run populates it, every shard restores warm.
      - name: Cache CLIP model (HuggingFace hub)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-clip-vit-base-patch32-dinov3-vitb16-v1

      - name: Install (CPU torch + torchvision + clip extra)
        # torchvision: the DINOv3 checkpoints resolve to a fast image processor that needs it
        # (pod_bootstrap.py, rule 8), from the SAME index as torch.
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[clip]"

      - name: Tag images
        run: |
          ARGS="--limit ${{ inputs.limit || '20000' }} --workers ${{ inputs.workers || '16' }} --shard ${{ matrix.shard }} --shards 4"
          # 'none' on a schedule trigger (inputs.region_id is empty on non-dispatch
          # events, so this fallback governs cron) => global full-scale, the default.
          REGION="${{ inputs.region_id || 'none' }}"
          if [ -n "$REGION" ] && [ "$REGION" != "none" ] && [ "$REGION" != "0" ]; then
            ARGS="$ARGS --region-id $REGION --categories ${{ inputs.categories || 'dum,komercni' }}"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python -m scripts.clip_tag_backfill $ARGS

      - name: Head tags for the live lane's scope (DINOv3 v1, CPU)
        if: ${{ inputs.dry_run != 'true' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        # 20 MB/h: ~3.0 kB an image (vector row 2,412 B + head-score row 563 B, measured
        # 2026-09-27), so ~7k images an hour, far above the ~40 a shard embeds here per run.
        # --chunk 8: the time budget is checked between chunks, and one bf16 CPU image is ~37 s, so a
        # chunk overshoots the 1,500 s budget by at most ~5 min, inside the job's 55.
        run: |
          python -m scripts.dinov3_embed_backfill --scope rt --score-heads --device cpu \
            --threads 4 --workers 4 --batch-size 4 --chunk 8 --limit 2000 \
            --shard ${{ matrix.shard }} --shards 4 --max-seconds 1500 \
            --max-write-mb-per-hour 20
