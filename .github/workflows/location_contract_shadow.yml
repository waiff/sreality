name: "Jobs: location contract shadow / un-shadow (W2 gate switch)"

# DISPATCH-ONLY. The operator's per-portal un-shadow switch, and its reverse.
#
# A shadowed contract (migration 404, `portal_contracts.shadow`) has its claims mined and
# stored but excluded from `location_claims_live`, so the resolver never sees them; the
# flag is header-grain, so it also parks every NEW listing on that portal without a live
# claim (measured 2026-09-08: 9,864 of 10,023 listings first seen on the seven shadowed
# portals since 2026-09-05). The gate for clearing it is the operator's portal-by-portal
# joint-review ruling (2026-09-08 — NOT the frozen labelled samples), so this lane runs
# only when dispatched, and only for the targets named.
#
# What one flip does (`location_data.contracts.set_shadow`, one transaction per target):
# writes the DB column (never the YAML — `shadow:` in git is the INITIAL value only),
# and enqueues that contract's listings into `dirty_locations` so the `*/15` resolve
# drain rebuilds `listing_location_current`. Nothing is re-mined here: un-shadowing
# admits claims that already exist; the archived-HTML sweep
# (`location_claims_remine_archive.yml`) is a separate, budgeted dispatch.
#
# Idempotent: a target already in the requested state reports `moved=False` and
# enqueues 0. A target that was never projected fails loud (`not projected — nothing
# to flip`) and stops the loop; re-dispatch with the rest.
#
# Required secret: SUPABASE_DB_URL.

on:
  workflow_dispatch:
    inputs:
      verb:
        description: "unshadow (make the contract's claims resolver inputs) | shadow (take it back out of serving)"
        required: false
        default: "unshadow"
        type: choice
        options:
          - unshadow
          - shadow
      targets:
        description: "space-separated <portal>@<version>, e.g. 'remax@3 ceskereality@5' (the version on disk in contracts/portals/<portal>.yaml)"
        required: true
        type: string

concurrency:
  group: location-contract-shadow
  cancel-in-progress: false

jobs:
  contract-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      - name: Flip each target
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          VERB: ${{ inputs.verb }}
          TARGETS: ${{ inputs.targets }}
        run: |
          # Inputs reach bash through env vars, never by template substitution into the
          # script, so a dispatch input cannot inject shell; the regex is the second rail.
          if ! [[ "$TARGETS" =~ ^[a-z]+@[0-9]+([[:space:]]+[a-z]+@[0-9]+)*$ ]]; then
            echo "::error::targets must be space-separated <portal>@<version>, got: $TARGETS"
            exit 2
          fi
          for target in $TARGETS; do
            echo "::group::--$VERB $target"
            python -m location_data.contracts "--$VERB" "$target"
            echo "::endgroup::"
          done
