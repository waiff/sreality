name: "Location: RÚIAN registry load"

# The monthly RÚIAN registry load (design 04 §4.4.2): ONE `full` load per vintage, 1st 10:00
# UTC. It HEAD-probes the vintage, archives both CSV zips AND the 253 MB state SHP boundary
# pack to R2, then stage -> blocking assertions -> merge -> boundaries (three geometries per
# unit, unchanged units carried from the previous version) -> gazetteer -> completeness
# assertion -> pointer swap into ONE new registry_version. A version publishes only when every
# obec and katastrální území has its geometry, so a killed or incomplete run leaves an inert
# staged version that the next dispatch resumes.
#
# 10:00 UTC on the 1st is comfortably after the measured generation times (OB_ADR 08:04,
# strukt_ADR 23:43 the prior day). The boundary pack has no vintage in its URL and ČÚZK
# refreshes it in place, so its sha256 is recorded with the version: a resume that downloads
# different bytes refuses (exit 1) rather than build one version out of two packs — re-dispatch
# a killed run promptly. `registry liveness` in `location_town_coverage` goes red when the
# current version is over 40 days old or a newer one has sat staged over 24 h. Everything here
# is CC BY 4.0 ČÚZK open data — free, no key, no registration.
#
# Required secrets: LOCATION_DB_DIRECT_URL (a direct 5432 URL) or SUPABASE_DB_SESSION_URL —
# a registry load wants a session it owns, never the transaction pooler — plus the R2_*
# vars, because the vintage archive (04 §C1.8) is what keeps a past registry_version
# reproducible after ČÚZK rotates the directory.

on:
  workflow_dispatch:
    inputs:
      vintage:
        description: "YYYYMMDD (blank = HEAD-probe the newest published)"
        required: false
        default: ""
        type: string
      dry_run:
        description: "download + parse + assert, write nothing"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 10 1 * *"

concurrency:
  # OUTER, cross-lane: every heavy location batch lane (registry load, claim intake, the
  # churn probe, the payload backfill/prune and both re-mine sweeps) shares
  # ONE group so at most one of them runs at a time. The RESOLVE DRAIN left the group on
  # 2026-09-10: it is latency-bound rather than instance-bound (11 small indexed reads and
  # one projection write per listing, no COPY, no scan, no detoast), so it contributed
  # least to the incident below and lost most to the queueing — the self-chaining archive
  # sweeps starved it to zero ticks in three hours. See location_resolve.yml. On
  # 2026-08-10 four of them ran concurrently against the shared 75 GB production instance
  # and took the whole database with them — backends dropped ("SSL connection has been
  # closed unexpectedly" plus one AdminShutdown), two lanes wedged mid-statement for hours,
  # and the live Browse rebuild degraded to multi-minute DataFileReads. These lanes are IO
  # hogs by construction (a 3 M-row COPY, per-unit PostGIS, a full-corpus raw_json scan),
  # so they queue instead of competing. `cancel-in-progress: false` keeps the running lane;
  # GitHub keeps one pending run per group and supersedes older pending ones, so a cadenced
  # lane collapses to its newest tick rather than piling up.
  group: location-batch
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-latest
    concurrency:
      # INNER, per-lane: the design's `registry group`, exclusive — two loads of the same
      # registry_version must never overlap. Kept under the outer group, not replaced by it.
      group: location-registry
      cancel-in-progress: false
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_DB_SESSION_URL: ${{ secrets.SUPABASE_DB_SESSION_URL }}
      LOCATION_DB_DIRECT_URL: ${{ secrets.LOCATION_DB_DIRECT_URL }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      VINTAGE: ${{ inputs.vintage }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[geo]"

      - name: Run registry load
        run: |
          set -euo pipefail
          ARGS=""
          if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "$VINTAGE" ]; then ARGS="$ARGS --vintage $VINTAGE"; fi
          echo "python -m location_data.ruian_load $ARGS"
          python -m location_data.ruian_load $ARGS
