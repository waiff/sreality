name: Broker resolution (full sweep + backfill)

# Broker intelligence: the daily full-sweep reconcile + the one-shot backfill.
# Re-attributes EVERY sreality listing from raw_json (keyset-batched so the
# raw_json scan never times out over the pooler), recomputes all rollups, rebuilds
# firm memberships + firm counts, runs the cross-source merge step, REFRESHes the
# leaderboard matview, and clears the dirty queue — the self-healing backstop for
# anything the */10 incremental pass missed. Runs after the property recompute
# (04:15) so property_id is fresh for property_count. mode=backfill is the same
# code path (the first population); dispatch it once after this lands on main.
# Source-agnostic — no `# portal:` tag. Shares the broker-resolution concurrency
# group with the incremental job.
#
# Required secret: SUPABASE_DB_URL.

on:
  schedule:
    - cron: "35 4 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: full | backfill (same code path; backfill = first population)
        required: false
        default: "full"
        type: choice
        options:
          - "full"
          - "backfill"
      max_seconds:
        description: Wall-clock budget for the attribution scan; finalize cleanly before timeout
        required: false
        default: "1500"
        type: string

# Per-workflow group (NOT shared with the incremental) so the */10 incremental can
# never cancel this pending run. Cross-workflow mutual exclusion is the DB lock
# (broker_resolution_lock, migration 192), which this sweep waits on.
concurrency:
  group: broker-resolution-full
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    # Headroom for the worst case, re-derived with the retry bounds:
    #   prefix  ~58 min — lock wait (<= _LOCK_WAIT_MAX_SECONDS, 21 min) and
    #                     attribution share the --max-seconds 3000 (50 min) budget,
    #                     which is anchored at process start and checked at a chunk
    #                     boundary, so one chunk can overshoot it (measured 53.3 min);
    #                     plus the firm-link loop's own _FIRM_LINK_MIN_SECONDS (5 min)
    #                     floor, which it needs because attribution routinely spends
    #                     the whole budget before that loop starts.
    #   tail    ~50 min — merge + rollups + matview + candidates measured 17-25 min,
    #                     each phase capped at attempts=2 by resolve_brokers.py.
    #   ------------------
    #   ~108 min, inside 110. The two halves stack only in theory: the tail's 2x is
    #   every phase failing once, which has never co-occurred with a budget-exhausted
    #   prefix (worst real sweep to 2026-08-12: 78.4 min end to end).
    # Before the attempts=2 caps the same tail could burn 4 attempts (~100 min) and
    # bust the backstop, which would trade a red run for a silent `cancelled` — the
    # exact mode the resilience wave exists to eliminate. The job is serialized by
    # the DB lock and idempotent, so extra wall-clock has no downside; raise
    # timeout-minutes together with --max-seconds or the tail's retry budget, never
    # one alone.
    #
    # 2026-08-24: raised 110 -> 180, the other half of the 3000s -> 1500s budget cut.
    # Measured reality overtook the estimate above: the only full sweep to COMPLETE
    # since 2026-08-19 (run 1457) took 106 min, of which the unbudgeted rollup tail
    # alone was 67 — four minutes of headroom, so the very next nightly was cancelled
    # again even carrying the budget cut. Every run 08-20..08-24 has ended_at IS NULL.
    # The job is serialized by the DB lock and idempotent, so extra wall-clock costs
    # nothing; a cancelled reconcile costs the run bookkeeping, the end-of-sweep
    # candidate proposal and the matview refresh.
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[api]"
      - name: Resolve brokers (full sweep)
        run: |
          ARGS="--max-seconds ${{ inputs.max_seconds || '1500' }}"
          if [ "${{ inputs.mode }}" = "backfill" ]; then ARGS="$ARGS --backfill"; fi
          echo "python -m scripts.resolve_brokers $ARGS"
          python -m scripts.resolve_brokers $ARGS
