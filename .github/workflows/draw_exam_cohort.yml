name: "Labeling: draw exam cohort"

# Draws and seals the sealed exam (migration 458) — the images the per-tag probes
# are GRADED on and must never be trained on. Pure SQL against the embedding store:
# no GPU, no torch, no R2, no LLM key. The stratified half of the exam is added by
# the screening lane, which is the one that spends money.
#
# Dispatch-only, and it always will be. An exam that could be drawn on a schedule
# would eventually redraw itself; every grade taken before that would silently stop
# being comparable. Sealing is irreversible by design.
#
# Required secret: SUPABASE_DB_URL.

on:
  workflow_dispatch:
    inputs:
      cohort:
        description: "Cohort name, e.g. exam_v1."
        required: true
        default: "exam_v1"
        type: string
      pure_random:
        description: "Draw N images uniformly at random. 0 to skip."
        required: false
        default: "0"
        type: string
      action:
        description: "draw | status | seal. Sealing is IRREVERSIBLE."
        required: false
        default: "status"
        type: choice
        options: ["status", "draw", "seal"]
      dry_run:
        description: "Report what would happen; write nothing."
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

concurrency:
  group: draw-exam-cohort
  cancel-in-progress: false

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[api]"
      - name: Draw exam cohort
        env:
          COHORT: ${{ inputs.cohort }}
          PURE_RANDOM: ${{ inputs.pure_random }}
          ACTION: ${{ inputs.action }}
          DRY_RUN: ${{ inputs.dry_run }}
        # Inputs reach the script through env, never interpolated into the command,
        # so a value can never become shell. The cohort name is validated as a plain
        # identifier because it is the only free-text input.
        run: |
          set -euo pipefail
          case "${COHORT}" in
            ''|*[!a-zA-Z0-9_-]*) echo "::error::cohort must be [A-Za-z0-9_-]+"; exit 1 ;;
          esac
          ARGS="--cohort ${COHORT}"
          case "${ACTION}" in
            status) ARGS="${ARGS} --status" ;;
            seal)   ARGS="${ARGS} --seal" ;;
            draw)
              case "${PURE_RANDOM}" in
                ''|*[!0-9]*) echo "::error::pure_random must be a number"; exit 1 ;;
              esac
              ARGS="${ARGS} --pure-random ${PURE_RANDOM}" ;;
            *) echo "::error::unknown action ${ACTION}"; exit 1 ;;
          esac
          if [ "${DRY_RUN:-false}" = "true" ]; then ARGS="${ARGS} --dry-run"; fi
          echo "python -m scripts.draw_exam_cohort ${ARGS}"
          python -m scripts.draw_exam_cohort ${ARGS}
