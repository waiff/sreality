name: "Jobs: Location history backfill (W3)"

# Re-mines location claims from `listing_snapshots.raw_json` — the 1,574,313-row history
# substrate (design 06-migration-backfill.md §6.2.2, §6.4 W3). Gives the claims layer a
# real per-listing precision/coordinate time series for sreality (the only portal whose
# `_HASH_FIELDS` allowlist includes a location-adjacent signal) and locality/district TEXT
# history for the other eight — never a coordinate for them (see
# location_data/claims_remine.py's module docstring for the full ground-truth argument).
#
# DISPATCH-ONLY ON PURPOSE — no `schedule:` trigger. The initial full pass is a ~1.57M-row
# backfill against a shared production instance that four concurrent location lanes have
# already knocked over once (2026-08-10 incident, roadmap/location-data.md "Standing
# decisions"); it must not start on its own the moment this workflow merges. An operator
# dispatches `mode=full` explicitly once the backfill is cleared to run, budgeted via
# `max_seconds` the same way the intake lane's hourly cron budgets itself. A follow-up PR
# can add a `schedule:` cron for `mode=incremental` (mirroring location_claims_intake.yml's
# hourly cadence) once the initial backfill has completed and the operator wants ongoing
# catch-up against newly-scraped snapshots — not before.
#
# Reuses W1's readers, licence ladder and portal contracts wholesale (location_data.
# claims_remine imports from location_data.claims_intake rather than re-deriving them), so
# it needs the SAME preconditions: migrations 380-389 applied, portal contracts projected,
# and the Mapy affected-set inventory (migration 385) TERMINAL AND COMPLETE — the lane
# refuses to run otherwise (06 §6.1.2: a coordinate claim on a listing the inventory hasn't
# reached yet would read as "absent from the inventory", which is the exact verdict that
# admits a Mapy-derived coordinate as first-party).
#
# A run that hits its budget stamps `outcome='stopped'`, never `ok` — the incremental
# watermark reads `ok` only, so a budgeted run leaves the floor where it found it and the
# next run resumes from the keyset cursor on that batch row, exactly like W1's intake.
#
# Shadow-only: nothing here is read by Browse, the API or the extension. Required secret:
# SUPABASE_DB_URL.

on:
  workflow_dispatch:
    inputs:
      source:
        description: "one portal only (blank = all nine)"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - sreality
          - bezrealitky
          - bazos
          - idnes
          - mmreality
          - remax
          - ceskereality
          - realitymix
          - maxima
      mode:
        description: "full = walk every snapshot; incremental = only snapshots since the last ok batch"
        required: false
        default: full
        type: choice
        options: [full, incremental]
      max_seconds:
        description: "wall-clock budget; stops between batches (blank = none — DANGEROUS unbounded, prefer a number)"
        required: false
        default: "2700"
        type: string
      batch_size:
        description: "snapshots per batch (10000-30000; blank = 20000)"
        required: false
        default: ""
        type: string
      dry_run:
        description: "extract and report; write nothing"
        required: false
        default: false
        type: boolean

concurrency:
  # OUTER, cross-lane: shared with the registry load, the claim intake, the Mapy inventory
  # and the resolve drain, so at most ONE heavy location lane runs at a time. Same incident
  # this note has cited every time since 2026-08-10 (four heavy lanes concurrently dropped
  # backends across the shared production instance) — see location_registry_load.yml for
  # the full account.
  group: location-batch
  cancel-in-progress: false

jobs:
  remine:
    runs-on: ubuntu-latest
    concurrency:
      # INNER, per-lane: two concurrent re-mine runs would fight over the same watermark.
      # Never cancel in flight — a cancelled batch rolls back whole; the batch row of a
      # cancelled run stays `running` and needs no repair.
      group: location-remine
      cancel-in-progress: false
    timeout-minutes: 55
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # The [dev] extra carries PyYAML for the deploy-time contract projection; the
      # extractor itself reads the already-projected DB tables.
      - name: Install
        run: pip install -e ".[dev]"

      - name: Project the portal contracts from git
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python -m location_data.contracts --load --git-ref "$GITHUB_SHA"

      - name: Run the history backfill
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SOURCE: ${{ inputs.source }}
          MODE: ${{ inputs.mode }}
          MAX_SECONDS: ${{ inputs.max_seconds }}
          BATCH_SIZE: ${{ inputs.batch_size }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS="--mode ${MODE:-full}"
          if [ -n "$SOURCE" ]; then ARGS="$ARGS --source $SOURCE"; fi
          if [ -n "$MAX_SECONDS" ]; then ARGS="$ARGS --max-seconds $MAX_SECONDS"; fi
          if [ -n "$BATCH_SIZE" ]; then ARGS="$ARGS --batch-size $BATCH_SIZE"; fi
          if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          echo "python -m location_data.claims_remine $ARGS"
          python -m location_data.claims_remine $ARGS
