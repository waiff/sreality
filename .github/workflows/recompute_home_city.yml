name: "Jobs: recompute home city (daily)"

# Recompute properties.home_city_id (migration 374).
#
# DAILY, NOT HOURLY, since 2026-08-26 (Cardinality Doctrine W7b). Migration 436
# re-keyed city-quality membership onto listings.obec_id via
# curated_cities_matching(), so browse_stats_properties and Watchdog's
# _city_quality_clauses NO LONGER read this column. Its only remaining reader is
# listings_with_city_quality(), which is reachable solely through the
# ?cityQualityLegacy=1 revert flag -- an escape hatch, not a serving path.
#
# The cost was not small. Measured on production: 85,020 shared blocks per call
# = 680 MB, ~24 calls/day = ~15 GB/day of buffer traffic on an instance with 1 GB
# of shared_buffers, for a column nothing on the serving path reads. Daily keeps
# the escape hatch at most 24 h stale while returning ~96 percent of that.
#
# NOT unscheduled outright, deliberately: that freezes the column, and a revert
# flipped weeks later would silently under-match every property ingested since.
# Restore `45 * * * *` below if the legacy path is ever actually used.
#
# The same function rebuilds everything after a curated_cities /
# admin_boundaries change.
#
# Dispatch with full=true after adding/editing a curated city or its RUIAN
# obec link, since that shifts which properties match.
#
# Required GitHub secret:
#   SUPABASE_DB_URL  -- same one used by every other workflow.

on:
  schedule:
    # Daily, not hourly -- see the header. Offset off the hour to avoid the
    # :00 and :30 cron pile-ups.
    - cron: "45 3 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Rebuild every property (not just new ones)"
        type: boolean
        default: false

concurrency:
  group: recompute-home-city
  cancel-in-progress: false

jobs:
  recompute:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Recompute home city
        run: python -m scripts.recompute_home_city ${{ (github.event_name == 'workflow_dispatch' && inputs.full) && '--full' || '' }}
