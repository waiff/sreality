name: "Jobs: location refetch cohort (W4)"

# DISPATCH-ONLY. Drives `location_enrichment_state`, the refetch cohort W1's intake has
# been filling since 2026-08-12 (sreality rows whose payload is legacy-shape or 80 KB
# truncated). Two phases, and `mode` decides how far it goes:
#
#   reconcile  — retire rows whose work is DONE (payload is post-cutover now), IMPOSSIBLE
#                (listing delisted) or EXHAUSTED. Writes only `location_enrichment_state`,
#                enqueues nothing, fetches nothing. This is the safe first run: until it
#                has run once the cohort is a high-water mark that has never been cleaned,
#                so its size says nothing about how much work is actually left.
#   dispatch   — reconcile, then enqueue the still-pending rows onto the ordinary detail
#                queue at priority -1 and advance their schedule.
#
# NOT in the `location-batch` concurrency group, deliberately. That group is oversubscribed
# (measured: 57.5% of intake runs cancelled, #1084/#1086) and it exists to keep heavy
# corpus-wide DB sweeps off the instance at once. This lane is neither: reconcile is a
# bounded keyset scan projecting one jsonb field, and dispatch is an INSERT onto a queue.
# The scarce resource it actually contends for is portal EGRESS, and that is already
# governed downstream by the bounded drain it enqueues into — joining `location-batch`
# would queue it behind a 3-hour registry load for no safety at all.
#
# The refetch itself is NOT performed here. This lane only enqueues; the existing detail
# drain (realtime worker / per-portal drain) fetches at production politeness, and
# priority -1 keeps a 38k-row cohort strictly behind real-time discovery.
#
# Required secret: SUPABASE_DB_URL.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "reconcile (retire finished rows only) | dispatch (also enqueue refetches)"
        required: false
        default: "reconcile"
        type: choice
        options:
          - reconcile
          - dispatch
      limit:
        description: "max rows to enqueue in dispatch mode"
        required: false
        default: "5000"
        type: string
      batch_size:
        description: "reconcile scan batch"
        required: false
        default: "500"
        type: string
      max_seconds:
        description: "budget for the reconcile scan (blank = no budget)"
        required: false
        default: ""
        type: string
      dry_run:
        description: "classify and count, write nothing"
        required: false
        default: false
        type: boolean

concurrency:
  group: location-refetch-cohort
  cancel-in-progress: false

jobs:
  refetch-cohort:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      - name: Drive the cohort
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          ARGS="--limit ${{ inputs.limit }} --batch-size ${{ inputs.batch_size }}"
          if [ "${{ inputs.mode }}" = "reconcile" ]; then ARGS="$ARGS --reconcile-only"; fi
          if [ -n "${{ inputs.max_seconds }}" ]; then ARGS="$ARGS --max-seconds ${{ inputs.max_seconds }}"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          eval python -m location_data.refetch_cohort $ARGS
