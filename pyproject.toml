[project]
name = "sreality-tracker"
version = "0.1.0"
description = "Daily scraper for Czech rental listings from sreality.cz"
requires-python = ">=3.12"
dependencies = [
  "requests>=2.32",
  "psycopg[binary]>=3.2",
  "boto3>=1.34",
  # Deterministic HTML parsing for the bazos crawler (scraper/bazos_parser.py).
  # Single lexbor wheel, CSS selectors; stdlib html.parser is too low-level for
  # bazos's class-based markup. Not needed by the sreality JSON path.
  "selectolax>=0.3",
  # Perceptual image hashing (dHash) for the Tier-2 dedup sweep's image
  # corroborator (scraper/image_phash.py). Pillow-only — no numpy/scipy.
  # Pre-approved in docs/design/multi-portal-dedup.md.
  "Pillow>=10",
  # Runtime since W2a-3b: location_data/payload_norm.py reads each portal
  # contract's `persistence.volatile_paths` out of contracts/portals/*.yaml. That
  # declaration decides the projection `payload_sha256` addresses, and the address
  # is permanent — so it has to come from the deployed artefact, not from a DB
  # projection that may or may not have been refreshed yet. Already a dev/CI
  # dependency (workflow-docs codegen, the contract gate); this promotes it.
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]
api = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "anthropic>=0.40",
  # Gemini backend for the reasoning agent (api/providers/gemini.py).
  # `google-generativeai` is deprecated; google-genai is the current SDK.
  "google-genai>=0.3",
  # Required by FastAPI's UploadFile / File() — used by the
  # /buildings/{id}/attachments endpoint for operator-supplied images.
  "python-multipart>=0.0.9",
  # Verify Supabase Auth user JWTs (api/dependencies.py verify_jwt). Stdlib has
  # no JWT primitive; PyJWT is the minimal, standard choice. The [crypto] extra
  # pulls `cryptography`, required to verify the project's asymmetric ES256
  # signing keys via JWKS (Phase 1 auth).
  "pyjwt[crypto]>=2.8",
]
# Used only by scripts/ingest_boundaries.py; kept out of the default
# install so the scraper / API images stay slim. Pure-Python combo
# (pyshp + shapely + pyproj) intentionally avoids geopandas / GDAL —
# we only need to read shapefiles, reproject EPSG:5514 -> EPSG:4326,
# and simplify polygons.
geo = [
  "pyshp>=2.3",
  "shapely>=2.0",
  "pyproj>=3.6",
]
# Used only by scraper/sreality_auth.py to mint a logged-in Seznam session
# cookie for the ceny-nemovitosti `estate_prices` stats API (which the listing
# scraper never needs). Kept out of the default install so the scraper / API
# images stay slim — only the price-stats workflow installs it. A captured
# cookie (SREALITY_SESSION_COOKIE) bypasses it entirely.
pricestats = [
  "playwright>=1.40",
]
# CLIP visual tagging (scraper/clip_tagger.py; clip_tag.yml / clip_retag.yml /
# backfill_render_score.yml). Heavy (torch + transformers) — kept out of the default
# install; ONLY the tagging workflows install it, and they install the CPU-only torch
# wheel first, so this extra is NOT a runtime dep of the scraper/API images.
clip = [
  # Upper bound, not an exact pin: what determines a vector's VALUE is the
  # checkpoint (pinned by sha in data/clip_taxonomy.json), not the library
  # version — the same weights give the same numbers across 4.x. The <5 guard is
  # against a major release changing the from_pretrained/CLIPModel API under the
  # four tagging workflows, which is a breakage risk, not a drift risk.
  "transformers>=4.40,<5",
]
# Per-tag DINOv3 head training (toolkit/tag_heads.py) — training-only, never in a
# runtime image; inference from a trained artifact needs no ML library at all
# (docs/design/clip-linear-probe.md D5). Pre-approved in
# docs/design/new-dedup/PROGRAM.md's 2026-09-05 ledger ruling (b).
training = [
  "scikit-learn>=1.4",
]
# Nearest-neighbor diagnostics for the heads' eval harness (toolkit/tag_heads_eval.py)
# — analysis-only, read-only, never influences training or a threshold. Also
# pre-clears the dependency PROGRAM.md's W3 (candidate path B batch k-NN) will
# need later, per the same 2026-09-05 ledger ruling (b).
analysis = [
  "faiss-cpu>=1.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["scraper*", "toolkit*", "api*", "scripts*", "location_data*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
