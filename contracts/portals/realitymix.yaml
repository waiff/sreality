    locator: {reader: json_breadcrumb, css: "script[type='application/ld+json']",
              type: BreadcrumbList, level: kraj,
              anchor_slugs: [praha, hlavni-mesto-praha, stredocesky, jihocesky, plzensky,
                             karlovarsky, ustecky, liberecky, kralovehradecky, pardubicky,
                             vysocina, jihomoravsky, olomoucky, zlinsky, moravskoslezsky]}
    claim_type: kraj_name
    cardinality: one
    licence_class: portal
    blur_evidence: none
    required: when_present
    notes: "The anchor level itself — 'Karlovarský kraj' on 8662169."

  - id: rm.det.breadcrumb_obec
    locator_kind: jsonld
    extraction_method: breadcrumb_parse
    page_kind: detail
    locator: {reader: json_breadcrumb, css: "script[type='application/ld+json']",
              type: BreadcrumbList, level: obec,
              anchor_slugs: [praha, hlavni-mesto-praha, stredocesky, jihocesky, plzensky,
                             karlovarsky, ustecky, liberecky, kralovehradecky, pardubicky,
                             vysocina, jihomoravsky, olomoucky, zlinsky, moravskoslezsky]}
    claim_type: obec_name
    cardinality: one
    licence_class: portal
    blur_evidence: none
    on_conflict: emit_both
    required: when_present
    notes: >
      Two anchor levels down. This is the map-less path the operator ruling names: when
      `#print-map` or `data-address` is absent the breadcrumb chain is the only structured
      carrier left, and the registry resolves the name with an honest granularity label. No
      external geocoder is involved on any branch.

  - id: rm.det.breadcrumb_quarter
    locator_kind: jsonld
    extraction_method: breadcrumb_parse
    page_kind: detail
    locator: {reader: json_breadcrumb, css: "script[type='application/ld+json']",
              type: BreadcrumbList, level: quarter,
              anchor_slugs: [praha, hlavni-mesto-praha, stredocesky, jihocesky, plzensky,
                             karlovarsky, ustecky, liberecky, kralovehradecky, pardubicky,
                             vysocina, jihomoravsky, olomoucky, zlinsky, moravskoslezsky]}
    claim_type: cast_obce_name
    cardinality: one
    licence_class: portal
    blur_evidence: none
    on_conflict: emit_both
    required: best_effort
    notes: >
      Three anchor levels down — 'Stráň' on 8662169, 'Skvrňany' on the recon's Plzeň sample.
      `best_effort` because the level is genuinely optional: the Zlín pozemek's chain is
      kraj -> okres -> obec and stops, so the reader returns nothing rather than reading past
      the end of the chain. Typed `cast_obce_name` to agree with `rm.det.form_address`, which
      states the same string from a different surface.
