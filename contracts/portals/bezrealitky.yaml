# bezrealitky — the GraphQL advert JSON already in `listings.raw_json`; no page body.
# contract_version 2: the eleven-type vocabulary, one entry per type, `obec_name` live.
# Reads the advert's typed location fields; the country is the tail of `addressInput`.
#
# contract_version 4 — THE RÚIAN RUNG GETS FED (FIELD CAPTURE W9).
# This portal publishes `ruianId`, the state address register's own kód ADM for the
# building entrance, and it is the only portal in the fleet that does. `resolver/bind.py`'s
# R0 rung — base score 100, the highest in the ladder — exists to read exactly that: one
# lookup in `ruian_address_points` and the listing IS an exact address point, no name
# matching, no house-number arithmetic, no trigram. The rung has never fired from a
# contract. `bzr.det.ruian_id` was declared at version 1 and W1-c dropped it as collateral
# when the vocabulary slimmed to eleven types (see `contracts.CLAIM_TYPES`), so since then
# the single `address_point_id` claim in the whole corpus has been one operator correction.
#
# MEASURED 2026-09-21 (re-confirmed 2026-09-22 — the drift is ordinary churn): 2,836 of
# 5,716 active bezrealitky rows carry a non-empty `ruianId`; 99.7 % of them join a LIVE
# `ruian_address_points` row (2,819 of 2,827 on the 09-22 re-count), and on the rows that
# resolve below address-point precision today the joined point's obec agrees with the obec
# the resolver already reached on 742 of 745. 732 rows sit below address point right now
# (390 street, 216 cast_obce_or_quarter, 86 obec, 40 street_segment) and the rung lifts
# every one of them to an exact point. The other ~2,100 already reach a point the long way
# round, through street + house number; R0 will reach the same point in one step.
#
# WHY THIS BUMP CANNOT BLACK THE PORTAL OUT. Version 4 declares every version-3 entry
# byte-for-byte and adds one. The resolver's version rail is per CLAIM TYPE (resolver
# v5.3, W18-b): each type reads the newest contract version `<= active` that carries a
# claim OF THAT TYPE, so the eight existing types keep serving their version-3 claims until
# the re-mine reaches them, and `address_point_id` — which has no claim at any version —
# simply contributes nothing until it is mined. No type is dropped, so nothing stops being
# evidence. The re-mine is the PAYLOAD half of the claim lane and is change-driven, so the
# corpus-wide fill needs one dispatched `--mode full --source bezrealitky` walk.

portal: bezrealitky
contract_version: 4

persistence:
  # What this portal's body carries that changes without the listing changing —
  # PER page_kind, because a detail page is one property and an index page is a
  # LIST of them, and every rule below came from diffing DETAIL pages (02 §2.3.2
  # P1; W2a-3b/3c measured them, W2a-3d fixed the keying). `base:` names the
  # portal-agnostic floor `location_data.payload_norm` applies underneath —
  # `html` = third-party analytics loaders matched by src, page chrome, CSRF
  # material, per-response attributes; `none` = no floor. A page_kind ABSENT here
  # is not declared: it is normalised with that floor alone and counted in its own
  # `+base` cohort, which is the honest state for every surface but `detail`.
  # Declaring an index profile takes an index diff, which nobody has run.
  volatile_paths:
    detail:
      # base: none — the body is a GraphQL response carrying exactly the closed
      # field list `_DETAIL_QUERY` asks for: no ads, no tokens, no counters, and no
      # HTML chrome for the `html` floor to strip. Declared and EMPTY is a
      # measurement ("nothing here churns"), not an absence — it keeps this
      # surface's own cohort instead of the `+base` one, and the readout is what
      # will show whether the image URLs re-sign.
      base: none
  version_cap: 20

exclusion_zones:
  - locator_kind: description
    locator: {pattern: "Regus|IWG|globální síť"}
    reason: >
      Regus/IWG boilerplate ("globální síť … tisíce poboček") reads as foreign to a naive
      matcher on Karlín/Nusle listings [mine-bezrealitky finding 5].

regressions:
  - "1037096 — the payload the fixture gate scores (claim_intake_fixtures.BEZREALITKY)"

extractions:
  - id: bzr.det.gps
    locator_kind: graphql
    extraction_method: portal_structured_field
    page_kind: detail
    locator: {reader: point_pair, lat_pointer: /gps/lat, lon_pointer: /gps/lng}
    claim_type: coordinate
    precision_cap: {granularity_max: address_point, position_source_max: portal_pin}
    prior: {position_source: portal_pin, match_confidence: medium}
    guards: [reject_outside_cz_bbox]
    notes: "97.4% of 698 sampled active rows carry a UNIQUE pin — highest of the fleet."

  - id: bzr.det.city
    locator_kind: graphql
    extraction_method: portal_structured_field
    page_kind: detail
    locator: {reader: scalar, json_pointer: /city}
    claim_type: obec_name
    prior: {granularity: obec}
    notes: "The town, stated apart from `cityDistrict`, VERBATIM (W9)."

  - id: bzr.det.city_district
    locator_kind: graphql
    extraction_method: portal_structured_field
    page_kind: detail
    locator: {reader: scalar, json_pointer: /cityDistrict}
    claim_type: cast_obce_name
    prior: {granularity: cast_obce_or_quarter}
    notes: "Town-prefixed on Prague and Brno ('Praha - Libeň'), as the portal states it."

  - id: bzr.det.street
    locator_kind: graphql
    extraction_method: portal_structured_field
    page_kind: detail
    locator: {reader: scalar, json_pointer: /street}
    claim_type: street_name
    prior: {granularity: street}
    notes: "The only portal publishing street, house number and PSČ as separate fields."

  - id: bzr.det.house_number_cp
    locator_kind: graphql
    extraction_method: portal_structured_field
    page_kind: detail
    locator: {reader: scalar, json_pointer: /houseNumber}
    claim_type: house_number_cp
    transform: ["split_cp_co:cp"]
    notes: "'655/31' is a čp/čo PAIR; both halves are separate claims, never alternatives."

  - id: bzr.det.house_number_co
    locator_kind: graphql
    extraction_method: portal_structured_field
    page_kind: detail
    locator: {reader: scalar, json_pointer: /houseNumber}
    claim_type: house_number_co
    transform: ["split_cp_co:co"]

  - id: bzr.det.zip
    locator_kind: graphql
    extraction_method: portal_structured_field
    page_kind: detail
    locator: {reader: scalar, json_pointer: /zip}
    claim_type: psc
    transform: ["psc_normalise"]
    notes: "Inconsistent within the portal ('19000' vs '154 00'); the normalised form is the claim."

  - id: bzr.det.country
    locator_kind: graphql
    extraction_method: portal_structured_field
    page_kind: detail
    locator: {reader: scalar, json_pointer: /addressInput}
    claim_type: country
    transform: ["address_part_country"]
    prior: {granularity: country}
    notes: "`addressInput` ends in the country ('…, 194 00, Česko'); any other tail claims nothing."

  # APPENDED, never inserted: `contract_entry_id` is assigned by file position and
  # 02 §2.1.8 forbids reordering, so a new act goes on the end even though version 1 wrote
  # this one second. The id is the one version 1 used — ids are permanent and are never
  # reused for a DIFFERENT act, and this is the same act.
  - id: bzr.det.ruian_id
    locator_kind: graphql
    extraction_method: portal_structured_field
    page_kind: detail
    locator: {reader: scalar, json_pointer: /ruianId}
    claim_type: address_point_id
    prior: {granularity: address_point, position_source: registry_point}
    notes: >
      The state register's own kód ADM for the building entrance, published BARE — no
      namespace and no transform, because R0 reads it as an integer key into
      `ruian_address_points` (`bind._as_int`) and a decorated value would simply not
      parse. `scalar` is therefore the reader and not `namespaced_id`, whose whole point
      is to keep a PORTAL id from ever being queried across portals; this is not a portal
      id, it is the national register's. The prior states what the claim implies rather
      than assigning it — R0 takes the granularity, the street, the obec and the position
      from the register row it looks up, never from this line.
