# ceskereality — html_selector + jsonld + og_meta, plus a bulk MAP surface (02 §2.2.7).
#
# The map view /mapa/{sale}/{category}/ is "the single most valuable location signal any of
# the three portals publishes… currently 100% unused": 500 markers per request, each with
# an `exact` flag and an `nid` that IS `listings.source_id_native`, so the flag joins
# straight onto existing rows [live-C §1.5]. It is a W2 surface (a new endpoint, weekly
# cadence) — W1 cannot reach it.
#
# W1 reach is the slim parsed dict {id, title, broker, coords, params, locality_text,
# image_urls}: coordinate provenance but never the coordinate value [db-raw §3.4]. Provenance
# is `page` on 11,273 of an 11,474-row window, so most of this portal's coordinates ARE
# admissible as legacy-column claims.
#
# Blur here is DISPLAY-only (the Google embed is forced to zoom=13 while the underlying
# pair is exact) — do NOT read the embed zoom as precision [live-C §1.4].

#
# VERSION 2 (2026-08-11) — one W1 entry added, no v1 entry edited (entries are immutable
# per contract_version; a change is a bump, 02 §2.1.8). Measured cause: 3,418 ACTIVE
# ceskereality listings carried NO claim at all. Their payload DOES have the
# `locality_text` key that `cr.det.locality_text` reads — with a null value, which is this
# portal's silent-parse-failure signature (the same one `payload_schema_detector` below
# alarms on). `cr.det.legacy_locality` reaches them through 06 §6.1.3's class-B column.

#
# VERSION 3 (2026-08-13) — one W1 entry added, no v1/v2 entry edited (entries are immutable
# per contract_version; a change is a bump, 02 §2.1.8). Measured cause: after the v2
# locality recovery 3,280 ACTIVE ceskereality listings STILL carried no claim at all, and
# on 957 of them `listings.street` is the last W1-readable signal — `raw_json.locality_text`
# is present and NULL, `listings.locality` is NULL as well (0 of the 957 have one, so
# `cr.det.legacy_locality` cannot reach them either), and the slim dict has no street key.
# `cr.det.legacy_street` reads that column GUARDED on `street_source='parser'`, because
# 06 §6.1.3 classes this column per WRITER, not per column.

#
# VERSION 4 (2026-08-31) — NO entry added and none edited. This bump is the hash, not the
# claims. PR #1209 (9929efcf) rewrote two pieces of PROSE — `fetch.robots_note` on the map
# surface, and the `notes:` on `cr.det.canonical_region` — and prose is inside the governed
# bytes: `contract_body_hash` excludes `persistence:` and `shadow:` and nothing else, so a
# note is hashed exactly like a selector. v3 was already on record at 45db104c…; on disk it
# became 780cd716…, and from 2026-08-27 22:32Z `project()` refused that pair on every run,
# taking the whole claim-intake lane down with it — all nine portals, 14 consecutive hourly
# failures, because the projection is one transaction for the fleet.
#
# The new prose is the true one (the walk really did stop using the 7 macro-region
# subdomains as its axis on 2026-08-27, and the 12-page cap really is unfiltered-URL only),
# and entries are immutable per contract_version — so the remedy doctrine names is this
# bump, not a revert of an accurate sentence back to a stale one (02 §2.1.8). What v4
# extracts is byte-identical to v3.
#
# The gap that let it merge: `test_contract_fixture_diff` gates CLAIMS, and prose changes
# no claim, so it passed. `contracts/portals/contracts.lock.json` +
# `tests/location_data/test_contract_immutability.py` now pin the governed hash itself, so
# the next edit-without-a-bump fails on the push instead of in production.

#
# VERSION 5 (2026-09-05) — the W2 ACTIVATION. ONE entry added (`cr.det.title_okres`) and TWO
# earlier entries RESTATED with an archive reader (`cr.det.title_line`, `cr.det.data_city`).
# No earlier entry's MEANING changed and no id was reused (02 §2.1.8). Both restated entries
# were inert in v1-v4 — declared with no `locator.reader`, therefore never executed and never
# stamped on one claim — so restating them orphans nothing: the v4 rows keep their own ids
# and their own (empty) claim history, and v5 gets brand-new `portal_contract_entries` rows.
#
# Measured cause: this portal's streets are 2.1% diacritic-bearing (862/40,147) against 72.8%
# realitymix and 82.6% sreality — "effectively every ceskereality street is ASCII-folded,
# which breaks any exact string join to a RÚIAN street registry" [live-C §1.3]. The accented
# form survives in the `<title>`: on the two archived bodies re-read for this bump
# (tests/fixtures/location_w2a_refetch/ceskereality_b1.html, listing 3861311, and
# ceskereality_a1.html, listing 3680359) the title reads `…, ulice Májová, okres Karlovy Vary
# - ČESKÉREALITY.cz inzerce realit`. So ONE locator repairs the de-accented street AND carries
# the portal-declared okres that `data-city` also states and that production discards today.
#
# The title is also the DECLARED-GRANULARITY axis for this portal (operator ruling,
# 2026-08-27): a title carrying `, ulice X,` is street-tier, a title without one is town-tier
# — b1 has the street, a1 does not, and the claim set differs accordingly. The axis is
# recorded as each entry's `precision_cap.granularity_max`; nothing consumes it yet. The
# address-point tier of that rule (street + č.p.) lives in the perex and in JSON-LD
# `streetAddress` (1,104/72,267 = 1.5% coverage) and is NOT claimed here: the operator
# declined a second street-text claim for this portal, and `cr.det.perex` is permanently
# typed `street_name` while its live value is a variable-depth address LINE
# ("Májová 843, Ostrov"). Ids are never re-typed, so it stays inert.
#
# `cr.det.data_city` publishes obec and okres in ONE string, `Ostrov (okres Karlovy Vary)`, on
# 2 of 2 archived bodies — hence the shared `split_paren_okres` transform, which claims only
# the obec half. The okres is claimed from the title instead: in `data-city` the obec name
# often repeats inside the okres name (`Praha (okres Praha)`), so a transformed okres value
# could not carry an evidence span distinguishable from the obec's occurrence, and
# `find_span`'s own docstring calls a span pointing at the wrong occurrence worse than none.
#
# NO coordinate entry and NO `ARCHIVED_COORDINATE_RULES` row. This portal's pin already
# reaches the claims spine through `cr.det.legacy_pin` (`listings.geom`, admitted for
# `coords.source='page'`, which is read off this very `input#driving_calculator_from`), so
# re-mining it from the archived body would add a second fingerprint for the same position
# and would license a locator nobody asked to license.
#
# The map surface stays declared-with-no-reader. OQ1 IS ANSWERED (2026-08-27): both
# `/mapa/{deal}/{cat}/` — 500 markers per request in `div#mapCanvas[data-markers]`, `nid` IS
# `listings.source_id_native` — and `POST /real-estate/ajax/map-refresh/` with
# `filter[gpsSwLat/Lng,gpsNeLat/Lng,zoom,strana]` work, and the bbox POST returns markers
# carrying `exact` with NO category filter, so a bbox partition can harvest
# (nid, lat, lng, exact) corpus-wide rather than a first-500-per-category prefix. That is a
# BULK HARVEST LANE against a live endpoint, not an archived-body re-mine — there is no
# archived `page_kind: map` body to read — so `cr.map.exact` / `cr.map.coordinate` stay inert
# and the harvest is a recorded follow-up. `cr.idx.locality` stays inert for a different
# reason: the fixture-diff gate's archived arm scores `page_kind == "detail"` only, so an
# index entry would ship completely ungated.
#
# `exclusion_zones` gains `section.s-estates-slide`. On both archived bodies `.similar` and
# `.podobne` match ZERO nodes while the live "Podobné nemovitosti" carousel renders as
# `section.s-estates-slide` and carries up to 20 other listings with obec+street ("Ostrov,
# Štúrova"; "…, Masarykova"). The retired selectors are KEPT rather than deleted: they cost
# nothing and they record which markup the block used to have.
#
# `required: always` on `cr.det.data_city` is DECLARATIVE — no lane implements a raise-on-miss
# for it today. "Raise, not shrug" is discharged by the pinned-fixture non-vacuity test and by
# W2-13's per-source zero-claim tripwire, for which this entry is the named floor. This portal
# has the fleet's documented silent-parse-failure history: 8,432 active rows carry
# `description IS NULL` behind an http-200 archived body with `parse_error` NULL, and
# `parse_index` still reads a class that matches nothing.
#
# Ships SHADOWED. `shadow` is HEADER-grain, so this darkens ceskereality's LIVE W1 claims from
# the moment @5 activates until an operator runs
# `python -m location_data.contracts --unshadow ceskereality@5`. That is the price the
# sweep-lane rail (tests/location_data/test_contract_shadow.py) charges once a dispatcher for
# `claims_remine_archive` exists, and the operator ordered all seven portals paid in one wave
# so the claim-corpus re-insert is paid once.

portal: ceskereality
contract_version: 5
shadow: true
extractor_runtime: ">=1.0"
identity_ladder: [structured_address, portal_precise_coord, text_geocode]

fetch:
  surfaces:
    - page_kind: detail
      method: GET
      url_template: "https://www.ceskereality.cz/{sale}/{category}/{facet}/{obec}/{slug}-{native_id}.html"
      headers: {Accept-Language: cs}
      min_interval_s: 4
      archive: true
      cadence: "6h detail drain"
    - page_kind: map
      method: GET
      url_template: "https://www.ceskereality.cz/mapa/{sale}/{category}/"
      min_interval_s: 10
      archive: true
      cadence: "weekly"
      robots_note: "500 markers in one request; the index walk itself no longer needs a
        fan-out — the 12-page cap applies to UNFILTERED category URLs only, and the walk
        partitions on the 14 declared kraj slugs [live-C §1.5; re-measured 2026-08-27]."

persistence:
  # What this portal's body carries that changes without the listing changing —
  # PER page_kind, because a detail page is one property and an index page is a
  # LIST of them, and every rule below came from diffing DETAIL pages (02 §2.3.2
  # P1; W2a-3b/3c measured them, W2a-3d fixed the keying). `base:` names the
  # portal-agnostic floor `location_data.payload_norm` applies underneath —
  # `html` = third-party analytics loaders matched by src, page chrome, CSRF
  # material, per-response attributes; `none` = no floor. A page_kind ABSENT here
  # is not declared: it is normalised with that floor alone and counted in its own
  # `+base` cohort, which is the honest state for every surface but `detail`.
  # Declaring an index profile takes an index diff, which nobody has run.
  volatile_paths:
    detail:
      base: html
      css_selectors:
        # W2a-3b: 3/3 fetches differed on 5/5 listings, and on 4 of the 5 the ONLY
        # difference was one hidden token in the "nahlásit chybu" modal —
        #   input#bug-report-token  8659c.5BgBggKSAVY6… -> e25206d84de2b24c8.cM7EOua…
        # It is name="token", not _token, which is exactly why the floor's
        # input[name*="_token"] never caught it; the id is pinned rather than
        # widening that shared rule for every portal on one portal's evidence.
        - "input#bug-report-token"
        # The 5th listing additionally rotated "Podobné nemovitosti". That section is
        # a SIBLING of the gallery, not part of it: this listing's own photos live
        # under .s-estate-detail-intro__slider and are untouched, and so is the
        # Google-Maps <iframe> carrying q=50.7277,15.5971.
        - "section.s-estates-slide"
  version_cap: 20

payload_schema_detector:
  retired_selector: ".i-estate__header-locality"
  action: raise_parse_failure_alarm
  note: >
    parse_index reads a class that NO LONGER EXISTS (0 matches on 20 live cards) — "the
    index-walk currently harvests no locality at all, silently" [live-C §1.3]. Separately,
    8,432 active rows (12.1%) have description IS NULL while portal_raw_pages holds their
    full HTML with http_status 200 and parse_error NULL: "the parser returned nothing from
    a good page and reported success" [db-raw §3.4]. `required: always` entries must raise.

exclusion_zones:
  - locator_kind: jsonld
    locator: {type: individualProduct, json_pointer: /offers/offeredby/address}
    reason: "The agency office (the existing parser already avoids it)."
  - locator_kind: html_selector
    locator: {css: "footer"}
    reason: >
      "ČESKÝ INTERNET s.r.o. Kostelní 942/46 370 04 České Budějovice" plus five partner
      addresses — the ONLY PSČ and the only street+house-number pairs on 12 of 12 pages
      [mine-ceskereality].
  - locator_kind: html_selector
    locator: {css: ".similar, .podobne"}
    reason: "'Podobné nemovitosti' blocks carry up to 20 other listings with quarter+street
      (17 foreign streets on 3790435)."
  - locator_kind: html_selector
    locator: {css: "select[name*='region'], nav a[href*='zahranicni']"}
    reason: "The region dropdown and the footer nav item 'Zahraniční', on every page."
  - locator_kind: html_selector
    locator: {css: "section.s-estates-slide"}
    reason: >
      The LIVE "Podobné nemovitosti" carousel (v5). `.similar, .podobne` above matched ZERO
      nodes on both archived bodies re-read for this bump (3861311, 3680359) while this
      section carried other listings' obec+street ("Ostrov, Štúrova", "…, Masarykova"); the
      same class is already named in `persistence.volatile_paths` as this portal's churn
      node, so the markup was known and only the zone was stale.

precision_caps:
  map_exact_true: {granularity_max: address_point, position_source_max: portal_pin}
  map_exact_false: {granularity_max: obec, position_source_max: admin_centroid}
  decimals_ge_11: {family: agency_gps}
  decimals_le_6: {family: centroid}

precision_priors:
  granularity: unknown           # never "precise by default" until an `exact` flag is
  position_source: portal_pin    # actually fetched from the map surface (02 §2.4)
  match_confidence: low
  note: "49.3% of active listings share a coordinate with ≥1 other active listing
    (33,287/67,565; worst pin 188) [live-C §1.4]."

regressions:
  - "3180041 / 3781182 — full archived HTML, http_status 200, parse_error NULL, and the
     parser produced nothing"
  - "3849899 — 'Na Výrovně 2693' in the raw title with house_number NULL and street stored
     ASCII-folded as 'Na vyrovne'"

extractions:
  - id: cr.det.legacy_pin
    locator_kind: legacy_column
    extraction_method: legacy_column
    page_kind: none
    locator: {reader: geom_column, legacy_source_column: listings.geom}
    claim_type: coordinate
    licence_class: portal
    blur_evidence: none
    precision_cap: {granularity_max: address_point, position_source_max: portal_pin}
    prior: {granularity: unknown, position_source: portal_pin, match_confidence: low}
    guards: [reject_outside_cz_bbox]
    required: when_present
    notes: >
      Admitted only for coords.source='page' (read off input#driving_calculator_from's
      data-coord-lat/lng) or a carry_forward absent from the Mapy inventory. 12-dp values
      are a DMS→decimal artefact (agency GPS) and ≤6-dp values are a different family
      (centroid): 64.8% ≥11 decimals, 14.2% ≤6 [live-C §1.4].

  - id: cr.det.coords_stamp
    locator_kind: legacy_column
    extraction_method: legacy_column
    page_kind: none
    locator: {reader: coords_stamp_quality, legacy_source_column: raw_json.coords}
    claim_type: precision_declaration
    licence_class: portal
    blur_evidence: none
    required: when_present

  - id: cr.det.locality_text
    locator_kind: legacy_column
    extraction_method: legacy_column
    page_kind: none
    locator: {reader: scalar, json_pointer: /locality_text,
              legacy_source_column: raw_json.locality_text}
    claim_type: address_line_verbatim
    licence_class: portal
    blur_evidence: none
    required: when_present
    notes: "A variable-depth address line ('Pařížská 1067, Praha Staré Město' degrading to
      bare 'Jílovice') — stored verbatim, split by the resolver [live-C §1.2]."

  - id: cr.det.legacy_locality
    locator_kind: legacy_column
    extraction_method: legacy_column
    page_kind: none
    locator: {reader: legacy_text_column, legacy_source_column: listings.locality,
              claim_confidence: medium, write_path_unknown: true}
    claim_type: address_line_verbatim
    licence_class: portal
    blur_evidence: none
    prior: {match_confidence: medium}
    on_conflict: emit_both
    required: when_present
    notes: >
      06 §6.1.3 class B, and on this portal it is the entry that reaches the silent-parse
      cohort: `raw_json.locality_text` is PRESENT and NULL on rows where the detail parse
      returned nothing from a good page (8,432 active rows have description IS NULL under
      the same conditions [db-raw §3.4]), so `cr.det.locality_text` yields nothing for them
      while `listings.locality` still holds a string from an earlier successful parse.
      3,418 active rows had zero claims of any kind when coverage was measured 2026-08-11.
      `write_path_unknown: true` (§6.6 rule 3): the column has no provenance stamp and
      backfills write it outside the parser. Confidence capped at `medium` by §6.1.1.
      Emitted alongside the payload claim, not instead of it — where both exist the
      resolver sees two claims that agree, which is evidence, not duplication.

  - id: cr.det.legacy_street
    locator_kind: legacy_column
    extraction_method: legacy_column
    page_kind: none
    locator: {reader: legacy_text_column, legacy_source_column: listings.street,
              require_column_equals: {listings.street_source: parser},
              claim_confidence: medium, write_path_unknown: false}
    claim_type: street_name
    licence_class: portal
    blur_evidence: none
    prior: {match_confidence: medium}
    on_conflict: emit_both
    required: when_present
    notes: >
      06 §6.1.3 splits `listings.street` by `street_source` and the guard IS that split:
      `parser` is the portal-derived class-B arm (capped at `medium`, mandatory gazetteer
      revalidation); `resolver` is class D — a RÚIAN address-point inference, ~11 of ~21
      text-checkable ones wrong — and NULL is the unattributable legacy-write cohort. Both
      refused arms are quarantine, never a claim, so they are refused HERE rather than left
      for the resolver to unpick. Among the zero-claim rows the split is 957 parser / 13
      resolver / 662 NULL, and none of the 957 carries the `portal_street_backfill` marker
      that `scripts/backfill_portal_streets.py` stamps (it writes `street` without touching
      `street_source`, which is exactly why the guard is a stamp test and not a NOT NULL
      test).
      DELIBERATE TENSION with §6.1.3's ceskereality row, recorded rather than hidden: that
      row classes the whole column D→A because it is stored ASCII-folded (2.1% of values
      carry a diacritic vs 72.8-82.6% elsewhere) and is therefore "unusable for an exact
      gazetteer join". That objection does not reach the claims layer — every join here
      runs through `location_value_norm()` (migration 382) and `normalize_street_name()`,
      both `lower(unaccent(…))`, so the folded and the accented form produce the SAME key
      and nothing is lost relative to the join. What IS lost is the accented display form,
      and `cr.det.og_title` + `cr.det.title_line` are already declared as its W2 recovery
      path for 03's reconciler to compare against.
      `write_path_unknown: false` — unlike `cr.det.legacy_locality`. §6.6 rule 3 asks a
      claim that CANNOT name its writer to say so; this one names it in the guard.

  # ---- W2 HTML / map surfaces (v5: three of these now name an archive reader) ----

  - id: cr.map.exact
    locator_kind: map_config
    extraction_method: map_widget_parse
    page_kind: map
    locator: {css: "div#mapCanvas", attr: "data-markers",
              then: "/data", join_key: nid}
    claim_type: precision_declaration
    blur_evidence: declared
    licence_class: portal
    precision_cap:
      granularity_max: {exact_true: address_point, exact_false: obec}
      position_source_max: {exact_true: portal_pin, exact_false: admin_centroid}
      blurred_labels: [exact_false]
    required: when_present
    notes: >
      "Nezadaná poloha" literally means the agency did not enter a position. 436 exact /
      64 approximate out of 500 markers (12.8%), and `nid` IS source_id_native
      [live-C §1.5]. Cadence: weekly.

  - id: cr.map.coordinate
    locator_kind: map_config
    extraction_method: map_widget_parse
    page_kind: map
    locator: {css: "div#mapCanvas", attr: "data-markers", then: "/data"}
    claim_type: coordinate
    licence_class: portal
    blur_evidence: none
    precision_cap: {granularity_max: address_point, position_source_max: portal_pin}
    guards: [reject_outside_cz_bbox]
    required: best_effort

  - id: cr.det.perex
    locator_kind: html_selector
    extraction_method: html_selector_parse
    page_kind: detail
    locator: {css: "span.s-estate-detail-intro__perex", text: true}
    claim_type: street_name
    licence_class: portal
    blur_evidence: none
    required: when_present
    notes: "Identical to input#driving_calculator_from[value]. Today house_number comes only
      from JSON-LD streetAddress, absent on both pages -> 1,104/72,267 = 1.5% coverage."

  - id: cr.det.data_city
    locator_kind: html_selector
    extraction_method: html_selector_parse
    page_kind: detail
    locator: {reader: html_attr, css: "input#driving_calculator_from",
              attr: "data-city"}
    claim_type: obec_name
    licence_class: portal
    blur_evidence: none
    transform: [split_paren_okres]
    precision_cap: {granularity_max: obec, position_source_max: admin_centroid}
    required: always
    notes: >
      'Praha (okres Praha)' — a portal-DECLARED okres, discarded today while okres is
      instead derived from geom by trigger [live-C §1.3]. v5 activates the OBEC HALF only:
      `split_paren_okres` keeps the text before '(okres ', measured present on 2 of 2
      archived bodies ('Ostrov (okres Karlovy Vary)', 'Špindlerův Mlýn (okres Trutnov)').
      The okres half is claimed from the title (`cr.det.title_okres`) instead, because the
      obec name frequently repeats inside the okres name here and a transformed okres value
      could not carry an evidence span distinguishable from the obec's occurrence. The
      claimed value being a NORMALISED form is also why the reader quotes the raw attribute:
      quoting 'České Budějovice' resolved the span onto the node's OWN `value=` attribute
      instead of onto `data-city`.
      `required: always` is the alarm this portal's silent-parse-failure history asks for
      (8,432 active rows with a NULL description behind an http-200 body); no lane
      implements raise-on-miss today, so it is read by the pinned-fixture non-vacuity test
      and by W2-13's zero-claim tripwire.

  - id: cr.det.og_title
    locator_kind: og_meta
    extraction_method: html_selector_parse
    page_kind: detail
    locator: {property: "og:title"}
    claim_type: street_name
    licence_class: portal
    blur_evidence: none
    required: when_present
    notes: >
      The accented form. ceskereality streets in the DB are 2.1% diacritic-bearing
      (862/40,147) vs 72.8% realitymix and 82.6% sreality — "effectively every ceskereality
      street is ASCII-folded… which breaks any exact string join to a RÚIAN street
      registry" [live-C §1.3]. This entry is how the diacritics come back.

  - id: cr.det.title_line
    locator_kind: html_selector
    extraction_method: regex_text
    page_kind: detail
    locator: {reader: html_regex, css: "title",
              pattern: ", ulice (?P<street>[^,]+),", group: "street"}
    claim_type: street_name
    licence_class: portal
    blur_evidence: none
    precision_cap: {granularity_max: street, position_source_max: derived_geocode}
    required: best_effort
    notes: >
      okres+obec 12/12, street 3/12 — "the single most reliable structured locator on this
      portal" [mine-ceskereality]. v5 gives it the `html_regex` reader: this is the ACCENTED
      form (`Májová`, `Nádražní`), and it is the repair path for the 862/40,147 = 2.1%
      diacritic rate on `listings.street`. It is also the granularity signal: a title
      WITHOUT `, ulice X,` is a town-tier page (archived body 3680359, Špindlerův Mlýn,
      yields no claim here at all), which is why `required` stays `best_effort` — the 3/12
      street rate is over arbitrary pages, while the ≥90% target is over the archived subset
      of rows that HAVE a stored street. The first sweep reports the measured yield.
      The evidence quote is the WHOLE MATCH, not the bare street, so the span points at the
      pattern rather than at some other occurrence of a common street name.

  - id: cr.det.jsonld_area_served
    locator_kind: jsonld
    extraction_method: jsonld_parse
    page_kind: detail
    locator: {type: individualProduct, json_pointer: /offers/areaServed/address}
    claim_type: obec_name
    licence_class: portal
    blur_evidence: none
