# ceskereality — contract_version 6 (rule 25: eleven types, at most one entry each).
# The detail page states this portal's whole location on ONE element, the driving-calculator
# input; the /mapa/ marker JSON states the precision flag that caps its pin.

portal: ceskereality
contract_version: 6

exclusion_zones:
  - locator_kind: jsonld
    locator: {type: individualProduct, json_pointer: /offers/offeredby/address}
    reason: "The agency office (the existing parser already avoids it)."
  - locator_kind: html_selector
    locator: {css: "footer"}
    reason: >
      "ČESKÝ INTERNET s.r.o. Kostelní 942/46 370 04 České Budějovice" plus five partner
      addresses — the ONLY PSČ and the only street+house-number pairs on 12 of 12 pages
      [mine-ceskereality].
  - locator_kind: html_selector
    locator: {css: ".similar, .podobne"}
    reason: "'Podobné nemovitosti' blocks carry up to 20 other listings with quarter+street
      (17 foreign streets on 3790435)."
  - locator_kind: html_selector
    locator: {css: "select[name*='region'], nav a[href*='zahranicni']"}
    reason: "The region dropdown and the footer nav item 'Zahraniční', on every page."
  - locator_kind: html_selector
    locator: {css: "section.s-estates-slide"}
    reason: "The live 'Podobné nemovitosti' carousel — up to 20 other listings' obec+street
      ('Ostrov, Štúrova', '…, Masarykova')."

extractions:
  - id: cr.det.data_city
    locator_kind: html_selector
    extraction_method: html_selector_parse
    page_kind: detail
    locator: {reader: html_attr, css: "input#driving_calculator_from", attr: "data-city"}
    claim_type: obec_name
    licence_class: portal
    transform: [split_paren_okres, statutory_city_obec]
    notes: "The mandatory town — the half before '(okres ', an obvod folded to its city (R4)."

  - id: cr.det.city_okres
    locator_kind: html_selector
    extraction_method: html_selector_parse
    page_kind: detail
    locator: {reader: html_attr, css: "input#driving_calculator_from", attr: "data-city"}
    claim_type: okres_name
    licence_class: portal
    transform: ["split_paren_okres:okres"]
    notes: "The same attribute's '(okres X)' half — the tie-break between same-named obce."

  - id: cr.det.page_pin
    locator_kind: html_selector
    extraction_method: html_selector_parse
    page_kind: detail
    locator: {reader: html_point_attrs, css: "input#driving_calculator_from",
              attr: ["data-coord-lat", "data-coord-lng"], position_branch: portal_pin}
    claim_type: coordinate
    licence_class: portal
    precision_cap: {granularity_max: address_point, position_source_max: portal_pin}
    prior: {granularity: unknown, position_source: portal_pin, match_confidence: low}
    guards: [reject_outside_cz_bbox]
    notes: "The portal's own pin; the page's map embed echoes this pair as q=lat,lng."

  - id: cr.det.address_street
    locator_kind: html_selector
    extraction_method: html_selector_parse
    page_kind: detail
    locator: {reader: html_attr, css: "input#driving_calculator_from", attr: "value"}
    claim_type: street_name
    licence_class: portal
    transform: [address_part_street]
    notes: "The address line's leading segment, gated by the shared street tests."

  - id: cr.det.address_cp
    locator_kind: html_selector
    extraction_method: html_selector_parse
    page_kind: detail
    locator: {reader: html_attr, css: "input#driving_calculator_from", attr: "value"}
    claim_type: house_number_cp
    licence_class: portal
    transform: [address_part_house_number, "split_cp_co:cp"]
    notes: "The number glued to that same street segment — the finest key RÚIAN can bind."

  - id: cr.map.exact
    locator_kind: map_config
    extraction_method: portal_declared_quality
    page_kind: map
    locator: {reader: json_bool, css: "div#mapCanvas", attr: "data-markers",
              then: "/data", json_pointer: "/exact",
              labels: {"true": exact_true, "false": exact_false},
              match: {json_pointer: "/nid", equals_row_field: source_id_native}}
    subject_scope: {kind: id_match, on_miss: fail}
    claim_type: precision_declaration
    blur_evidence: declared
    licence_class: portal
    precision_cap: {blurred_labels: [exact_false]}
    notes: "The /mapa/ marker's own flag, subject-matched on `nid` == source_id_native."

persistence:
  # What this portal's body carries that changes without the listing changing —
  # PER page_kind, because a detail page is one property and an index page is a
  # LIST of them, and every rule below came from diffing DETAIL pages (02 §2.3.2
  # P1; W2a-3b/3c measured them, W2a-3d fixed the keying). `base:` names the
  # portal-agnostic floor `location_data.payload_norm` applies underneath —
  # `html` = third-party analytics loaders matched by src, page chrome, CSRF
  # material, per-response attributes; `none` = no floor. A page_kind ABSENT here
  # is not declared: it is normalised with that floor alone and counted in its own
  # `+base` cohort, which is the honest state for every surface but `detail`.
  # Declaring an index profile takes an index diff, which nobody has run.
  volatile_paths:
    detail:
      base: html
      css_selectors:
        # W2a-3b: 3/3 fetches differed on 5/5 listings, and on 4 of the 5 the ONLY
        # difference was one hidden token in the "nahlásit chybu" modal —
        #   input#bug-report-token  8659c.5BgBggKSAVY6… -> e25206d84de2b24c8.cM7EOua…
        # It is name="token", not _token, which is exactly why the floor's
        # input[name*="_token"] never caught it; the id is pinned rather than
        # widening that shared rule for every portal on one portal's evidence.
        - "input#bug-report-token"
        # The 5th listing additionally rotated "Podobné nemovitosti". That section is
        # a SIBLING of the gallery, not part of it: this listing's own photos live
        # under .s-estate-detail-intro__slider and are untouched, and so is the
        # Google-Maps <iframe> carrying q=50.7277,15.5971.
        - "section.s-estates-slide"
  version_cap: 20

