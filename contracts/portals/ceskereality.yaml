  - id: cr.det.title_okres
    locator_kind: html_selector
    extraction_method: regex_text
    page_kind: detail
    locator: {reader: html_regex, css: "title",
              pattern: ",\\s*okres\\s+(?P<okres>[^,]+?)\\s+-\\s+ČESKÉREALITY\\.cz",
              group: "okres"}
    claim_type: okres_name
    licence_class: portal
    blur_evidence: none
    precision_cap: {granularity_max: okres, position_source_max: admin_centroid}
    required: when_present
    notes: >
      NEW in v5. The portal-declared okres, which production discards entirely (okres is
      derived from geom by trigger [live-C §1.3]). Present on 12/12 mined pages and on 2/2
      archived bodies re-read for this bump. The pattern terminates on the SITE SUFFIX, not
      on a bare hyphen, because Czech okres names carry unspaced hyphens — `Frýdek-Místek`,
      `Praha-východ` — and a `[^-]` class would truncate them; verified against both.
      Taken from the title rather than from `cr.det.data_city`'s `(okres …)` half because
      the obec name repeats inside the okres name there and the span would be ambiguous.
      A branding change to the `<title>` suffix stops this claim silently; that is what
      W2-13's per-source zero-claim tripwire is for, and this entry is one of its floors.
