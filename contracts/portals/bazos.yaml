# bazos — contract v7 (W18: the street the ad NAMES).
# The detail page's Lokalita row: the town and the PSČ off the town anchor's href (its
# visible text is the OKRES), plus the ad's own maps link beside it — blur marker and pin.
#
# v7 adds the ONE fact bazos publishes that no other locator on this page carries: the
# STREET. It is the only portal of the nine with no street claim at all — 129,871 located
# rows, every one of them obec-grain — while the ad states a street outright on a third of
# them. The operator's ruling (2026-09-16, bazos 223293822): that street must reach the
# store, and where it disagrees with the ad's pin, the STREET decides the point.
#
# WHICH SURFACE, and why in this order (measured 2026-09-16):
#
#  * `/coords/street` FIRST. `scraper.bazos_parser` already mines a street on every page it
#    finds one on (`extract_street` + `_trailer_street_quarter`, kept since W4-c as the
#    coordinate's provenance): 50,523 of 146,990 rows carry one — "ul. Jiráskova" on the
#    operator's own ad. It is the parser's subject-scoped reading and it is NOT truncated,
#    which the title is. Folded and bound against the register of the same obec it matches
#    EXACTLY on 65.4 % of a 15k sample.
#  * `/title` SECOND, and second because bazos HARD-CAPS a title at 60 characters — 21,930
#    of them sit exactly on the cap, cut mid-word ("ul. Vršo", "ul. Bulhars"), which alone
#    costs 2,887 of the 20,909 cued titles. Of the titles that survive the cap and anchor to
#    an obec, 80.1 % (14,659) bind exactly. `/title` IS `h1.nadpisdetail`'s text
#    (`scraper/bazos_parser.py:485`), so this is the headline surface, read on the lane that
#    covers every row.
#  * The `<head>` title is deliberately NOT declared: it is the same capped string with the
#    OKRES and " | Bazoš.cz" appended, so it carries no street the headline lacks and would
#    feed a region name into the line.
#  * The DESCRIPTION is deliberately NOT declared either, and it is the next lever rather
#    than an oversight: `listings.description` is populated on 93 % of rows and 48 % contain
#    a cue, but the FIRST cue is usually prose ("500 m od ulice …", a broker's office
#    address) and only 19 % bind exactly. Measured, not guessed — W19's problem.
#
# WHAT IS CLAIMED is the whole line the portal wrote, not a street this file tried to cut
# out of it. `street_token` strips only the generic `ulice`/`ul.` wrapper (leading, with an
# optional `v`/`ve`/`na`, or trailing) and refuses a geo name, a foreign script and
# boilerplate. It keeps `náměstí`, `třída`, `nábřeží` and `sídliště` — those are part of
# the OFFICIAL name ("náměstí Míru", "třída Václava Klementa"), and 215 titles bind only
# because the word survives. It does not strip a trailing house number either: S1 turns
# that into a čp and R1 uses it to reach an address point.
#
# WHY A TEXT STREET IS SAFE NOW, where `regressions:` below records two reasons it was not:
#
#  * `Nový` (220870847) was hallucinated out of "Nový 2 pokojový byt" and geocoded 130 km
#    away. It is still CLAIMED — a claim states what the portal wrote — and resolver v5.2
#    never PUBLISHES it: a street reaches the answer row only when it binds to
#    `ruian_streets` inside the anchoring obec, and there is no Nový in Hořice.
#  * `28. října` (220059906) was stated three times and stored NULL, because
#    `looks_like_czech_street` refuses a numeric-leading name. So this entry declares NO
#    morphology gate. THE REGISTER IS THE GATE, and it spells `28. října`.
#
# A multi-segment line ("Prodej bytu 3+1, ul. Jiráskova, Mladá Boleslav") is split and bound
# SEGMENT BY SEGMENT inside the anchoring obec, whole-string-first and fail-closed, by the
# same binder W9 built for composite localities — two distinct streets in one line bind
# nothing. A title cut at the 60-char cap simply fails: a truncated stem is ambiguous by
# nature and there is no prefix matching anywhere in this lane.

portal: bazos
contract_version: 7

persistence:
  # What this portal's body carries that changes without the listing changing —
  # PER page_kind, because a detail page is one property and an index page is a
  # LIST of them, and every rule below came from diffing DETAIL pages (02 §2.3.2
  # P1; W2a-3b/3c measured them, W2a-3d fixed the keying). `base:` names the
  # portal-agnostic floor `location_data.payload_norm` applies underneath —
  # `html` = third-party analytics loaders matched by src, page chrome, CSRF
  # material, per-response attributes; `none` = no floor. A page_kind ABSENT here
  # is not declared: it is normalised with that floor alone and counted in its own
  # `+base` cohort, which is the honest state for every surface but `detail`.
  # Declaring an index profile takes an index diff, which nobody has run.
  volatile_paths:
    detail:
      base: html
      css_selectors:
        # The per-listing view counter the index parser already reads ("Vidělo: N
        # lidí"); it increments on every visit. Scoped to detail and nowhere else:
        # on an INDEX page it matches once per CARD (21 nodes on a live page), so
        # applied there it would eat one node out of every listing in the grid.
        - "div.inzeratyview"
  version_cap: 20

exclusion_zones:
  - locator_kind: html_selector
    locator: {css: ".podobne, #podobne"}
    reason: >
      The "Podobné inzeráty" block names EIGHT other streets on 220021475 (gen. Píky,
      Sokolská, Lidická 8/22, Peškova, Norská …) [mine-bazos].
  - locator_kind: html_selector
    locator: {css: "footer, .hlavicka"}
    reason: "Site chrome/footer."

regressions:
  - "220870847 — street='Nový' hallucinated from 'Nový 2 pokojový byt'; the phantom street
     drove the geocode ~130 km away"
  - "220059906 — '28. října' stated 3× and still stored NULL (numeric-leading street name)"

extractions:
  - id: bzs.det.obec_slug
    locator_kind: url_slug
    extraction_method: url_slug_parse
    page_kind: detail
    locator: {reader: html_attr_regex, css: "a[href*='/inzeraty/']", attr: href,
              pattern: "/inzeraty/(?P<obec>[^/]+?)(?:-\\d+)?/(?P<psc>\\d{5})/",
              group: obec, decode: percent}
    claim_type: obec_name
    licence_class: portal
    blur_evidence: none
    prior: {granularity: obec}
    subject_scope: {subject_scoped: true}
    notes: "The town anchor's HREF — its visible TEXT is the okres; a `-8`/`-26` tail is postal."

  - id: bzs.det.psc
    locator_kind: url_slug
    extraction_method: url_slug_parse
    page_kind: detail
    locator: {reader: html_attr_regex, css: "a[href*='/inzeraty/']", attr: href,
              pattern: "/inzeraty/(?P<obec>[^/]+?)(?:-\\d+)?/(?P<psc>\\d{5})/",
              group: psc, decode: percent}
    claim_type: psc
    licence_class: portal
    blur_evidence: none
    transform: ["psc_normalise"]
    subject_scope: {subject_scoped: true}
    notes: "The same href's five-digit tail — five digits by construction, unlike the text."

  - id: bzs.det.blur_hint
    locator_kind: html_selector
    extraction_method: portal_declared_quality
    page_kind: detail
    locator: {reader: html_marker, css: "a[href*='/place/']", attr: title,
              contains: "Přibližná lokalita", value_label: approximate_location}
    claim_type: precision_declaration
    licence_class: portal
    blur_evidence: declared
    precision_cap:
      granularity_max: obec
      position_source_max: portal_pin_blurred
      blurred_labels: [approximate_location]
    subject_scope: {subject_scoped: true}
    notes: "The maps link's title — bazos declaring its own pin approximate."

  - id: bzs.det.link_pin
    locator_kind: html_selector
    extraction_method: html_selector_parse
    page_kind: detail
    locator: {reader: html_point_attrs, css: "a[href*='/place/']", attr: [href, href],
              pattern: "/place/(?P<lat>-?\\d{1,2}\\.\\d+),(?P<lon>-?\\d{1,3}\\.\\d+)",
              position_branch: portal_pin}
    claim_type: coordinate
    licence_class: portal
    blur_evidence: none
    precision_cap: {granularity_max: obec, position_source_max: portal_pin_blurred}
    prior: {granularity: obec, position_source: portal_pin_blurred, match_confidence: low}
    guards: [reject_outside_cz_bbox]
    subject_scope: {subject_scoped: true}
    notes: "The ad's own pin; both decimals sit in ONE attribute — silent until the reader widens."

  - id: bzs.det.street_cue
    locator_kind: api_json
    extraction_method: portal_structured_field
    page_kind: detail
    locator:
      reader: scalar
      json_pointer: "/coords/street"
      # ORDERED alternatives inside the ONE entry — a claim type has one carrier per portal,
      # so the headline is a second PATH, never a second entry that would reach the resolver
      # as a vote nothing asked for. `/coords/street` answers on a third of rows and is
      # untruncated; `/title` is the 60-char-capped headline behind it.
      fallback:
        - {json_pointer: "/title"}
    claim_type: street_name
    licence_class: portal
    blur_evidence: none
    transform: ["street_token"]
    subject_scope: {subject_scoped: true}
    notes: "The street the ad states, as the portal wrote it — the parser's own reading
      first, the capped headline behind it. Only the generic ulice/ul. wrapper is stripped;
      the register decides what binds, and an unbound text is never published (v5.2)."
