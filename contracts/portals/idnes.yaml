# idnes — contract v4, one entry per claim type over the stored detail body (rule 25).
# It reads three surfaces of that body: the `dataLayer.push({"event":"viewDetail"…})` block
# (admin hierarchy AND the country, already split), the `.b-detail__info` address line, the
# MapTiler pin.
#
# v4 moves the ONE `country` entry off the address tail and onto the dataLayer's own
# `listing_localityState`. A foreign idnes body states its country twice — the tail of the
# address line in Czech ("Malinska, Primorsko-goranska zupanija, Chorvatsko") and the
# structured alpha-2 field ("HR") — but only the second one is complete: the portal offers
# 38 countries under `?s-l=STAT-xx` and `address_part_country`'s closed name table spells
# 18 of them, so Egypt, Thajsko, Malta, Švédsko and 16 others named a country the claim
# never carried. The field also survives a mangled line (one sampled Spanish body repeats
# its own address twice inside `.b-detail__info`). Measured 2026-09-12: 3,263 active idnes
# listings sat at `country_status='undetermined'` with a Croatian obec_name as their only
# claim.

portal: idnes
contract_version: 4

persistence:
  # What this portal's body carries that changes without the listing changing —
  # PER page_kind, because a detail page is one property and an index page is a
  # LIST of them, and every rule below came from diffing DETAIL pages (02 §2.3.2
  # P1; W2a-3b/3c measured them, W2a-3d fixed the keying). `base:` names the
  # portal-agnostic floor `location_data.payload_norm` applies underneath —
  # `html` = third-party analytics loaders matched by src, page chrome, CSRF
  # material, per-response attributes; `none` = no floor. A page_kind ABSENT here
  # is not declared: it is normalised with that floor alone and counted in its own
  # `+base` cohort, which is the honest state for every surface but `detail`.
  # Declaring an index profile takes an index diff, which nobody has run.
  volatile_paths:
    detail:
      base: html
      css_selectors:
        # W2a-3b: 3/3 fetches differed on 5/5 listings. All of it is the Nette
        # contact form ("Napište makléři") re-arming its anti-spam material per
        # response, plus the recommendation rail:
        #   input[name=tshee]     15237420345 -> 15237420357  (per-response counter)
        #   input[name=schpeckc]  62da6c7c… -> c26841cc…      (32-hex captcha hash)
        #   #schpeckIn            "3 ➕ 6" -> "1 ➕ 1"          (the captcha question)
        # The form's `_token_` was already covered by the floor's
        # input[name*="_token"]; these are what it missed.
        - 'input[name="tshee"]'
        - 'input[name="schpeckc"]'
        - "#schpeckIn"
        # "Podobné nabídky" holds OTHER listings' titles, prices, streets and
        # thumbnails — never this listing's — so its rotation is pure archive churn
        # (and mis-attributed location text if it stayed).
        - "div.grid-similar-offers"
        # stehuju.cz / vyklizim.cz partner slots (fixture-verified).
        - ".advertisement"
  version_cap: 20

exclusion_zones:
  - locator_kind: embedded_json
    locator: {css: "script[data-maptiler-json]", then: "/geojson/features[isSimilar=true]"}
    reason: "20 neighbour listings with addresses per page [live-B §1.2]."
  - locator_kind: html_selector
    locator: {css: ".b-similar, div.grid-similar-offers, .b-detail-contact, .broker, nav"}
    reason: "Both 'Podobné nabídky' shapes (the old block and the live rail that carries the
      neighbour addresses on every real body) and both broker blocks (the live
      `.b-detail-contact` carries the agency's own street), site nav — the two register gaps
      tests/location_data/test_html_scope.py pinned for this portal, closed."

extractions:
  - id: id.det.subject_feature
    locator_kind: embedded_json
    extraction_method: map_widget_parse
    page_kind: detail
    locator:
      reader: json_point
      css: "script[data-maptiler-json]"
      then: "/geojson/features"
      match: {json_pointer: "/properties/id", equals_row_field: source_id_native}
      exclude_where: {json_pointer: "/properties/isSimilar", equals: true}
      feature: "/geometry"
      position_branch: portal_pin
      reject_points: ["49.19186,16.61109", "49.19752,16.65812", "49.81150,15.61824"]
    claim_type: coordinate
    blur_evidence: none
    precision_cap: {granularity_max: address_point, position_source_max: portal_pin}
    prior: {position_source: portal_pin, match_confidence: low}
    subject_scope: {kind: id_match, on_miss: fail}
    guards: [reject_outside_cz_bbox]
    notes: "The subject feature's own Point, by id equality — never features[0]; the portal
      maps only exact-address listings, so a blurred page carries no feature and no pin."

  - id: id.det.no_exact_disclaimer
    locator_kind: html_selector
    extraction_method: portal_declared_quality
    page_kind: detail
    locator:
      reader: html_marker
      css: "body"
      contains: "Nemovitost nemá přesnou adresu, nachází se ve vyznačené oblasti."
      value_label: no_exact_address
    claim_type: precision_declaration
    blur_evidence: declared
    precision_cap: {granularity_max: cast_obce_or_quarter,
                    blurred_labels: ["no_exact_address"]}
    subject_scope: {subject_scoped: true}
    notes: "The portal's own blur sentence; a rewording stops matching instead of relabelling."

  - id: id.det.country
    locator_kind: embedded_json
    extraction_method: portal_structured_field
    page_kind: detail
    locator:
      reader: json_scalar
      css: "script"
      script_match: 'dataLayer\.push\(\s*(?P<config>\{\s*"event"\s*:\s*"viewDetail"[\s\S]*?\})\s*\)\s*;'
      match: {json_pointer: "/listing_id", equals_row_field: source_id_native}
      json_pointer: "/listing_localityState"
    claim_type: country
    transform: ["foreign_country_code"]
    subject_scope: {kind: id_match, on_miss: fail}
    notes: "The portal's own alpha-2, on the same subject-matched block as the town — so
      'HR' is claimed and the 'CZ' it stamps on every domestic row is not (foreign is a
      determination, never a default). The address tail carried this in v3 and lost every
      country its name table does not spell."

  - id: id.det.kraj
    locator_kind: embedded_json
    extraction_method: portal_structured_field
    page_kind: detail
    locator:
      reader: json_scalar
      css: "script"
      script_match: 'dataLayer\.push\(\s*(?P<config>\{\s*"event"\s*:\s*"viewDetail"[\s\S]*?\})\s*\)\s*;'
      match: {json_pointer: "/listing_id", equals_row_field: source_id_native}
      json_pointer: "/listing_localityRegion"
    claim_type: kraj_name
    subject_scope: {kind: id_match, on_miss: fail}
    notes: "'Liberecký kraj' / 'Hlavní město Praha' — the disambiguator for homonymous obce."

  - id: id.det.okres
    locator_kind: html_selector
    extraction_method: html_selector_parse
    page_kind: detail
    locator: {reader: html_text, css: ".b-detail__info"}
    claim_type: okres_name
    transform: ["address_part_okres"]
    subject_scope: {subject_scoped: true}
    notes: "Keyed on the line's own 'okres …' qualifier; the dataLayer's
      `listing_localityDistrict` is a městský obvod on Prague and is never read."

  - id: id.det.obec
    locator_kind: embedded_json
    extraction_method: portal_structured_field
    page_kind: detail
    locator:
      reader: json_scalar
      css: "script"
      script_match: 'dataLayer\.push\(\s*(?P<config>\{\s*"event"\s*:\s*"viewDetail"[\s\S]*?\})\s*\)\s*;'
      match: {json_pointer: "/listing_id", equals_row_field: source_id_native}
      json_pointer: "/listing_localityCity"
    claim_type: obec_name
    transform: ["statutory_city_obec"]
    subject_scope: {kind: id_match, on_miss: fail}
    notes: "THE TOWN (rule 25): already an obec here ('Praha' where the line says
      'Praha 5 - Hlubočepy'), and the R4 fold guards the day it is not."

  - id: id.det.cast_obce
    locator_kind: embedded_json
    extraction_method: portal_structured_field
    page_kind: detail
    locator:
      reader: json_scalar
      css: "script"
      script_match: 'dataLayer\.push\(\s*(?P<config>\{\s*"event"\s*:\s*"viewDetail"[\s\S]*?\})\s*\)\s*;'
      match: {json_pointer: "/listing_id", equals_row_field: source_id_native}
      json_pointer: "/listing_localityCityArea"
    claim_type: cast_obce_name
    subject_scope: {kind: id_match, on_miss: fail}
    notes: "The část obce / quarter beside the town; equal to it on an undivided obec."

  - id: id.det.street
    locator_kind: html_selector
    extraction_method: html_selector_parse
    page_kind: detail
    locator: {reader: html_text, css: ".b-detail__info"}
    claim_type: street_name
    transform: ["address_part_street"]
    subject_scope: {subject_scoped: true}
    notes: "The leading segment, and only when an obec segment follows it and the shared
      street tests admit it — a town-only line claims no street."

  - id: id.det.cp
    locator_kind: html_selector
    extraction_method: html_selector_parse
    page_kind: detail
    locator: {reader: html_text, css: ".b-detail__info"}
    claim_type: house_number_cp
    transform: ["address_part_house_number", "split_cp_co:cp"]
    subject_scope: {subject_scoped: true}
    notes: "The number glued to the street segment ('Krkonošská 512/3'), čp half."

  - id: id.det.co
    locator_kind: html_selector
    extraction_method: html_selector_parse
    page_kind: detail
    locator: {reader: html_text, css: ".b-detail__info"}
    claim_type: house_number_co
    transform: ["address_part_house_number", "split_cp_co:co"]
    subject_scope: {subject_scoped: true}
    notes: "The čo half of the same number; absent unless the page writes '512/3'."
