# sreality — contract_version 3 (slim, rule 25).
# Reads `listings.raw_json`: the v1 estate JSON the detail-drain persists verbatim.
# No page substrate — the SSR detail page 302s into a login.seznam.cz autologin loop.
#
# @3: that JSON comes in TWO shapes. The client changed what it stores mid-2026, and a
# listing first seen before the change and never content-changed since still carries the
# older one — its address is ONE line in `/locality/value` with the pin in `/map`, and
# @2 read only the flat post-cutover fields. 30,265 delisted rows and 80 live ones
# resolved to nothing because of it, which is a town-coverage hole (rule 25) that looked
# like a portal publishing no town. The older shape is not a second set of entries — one
# claim type has exactly one carrier per portal — it is a `locator.fallback` path on the
# entries that already carry those types, each with the normaliser ITS shape needs.
# Entry count is unchanged from @2.

portal: sreality
contract_version: 3

persistence:
  # What this portal's body carries that changes without the listing changing —
  # PER page_kind, because a detail page is one property and an index page is a
  # LIST of them, and every rule below came from diffing DETAIL pages (02 §2.3.2
  # P1; W2a-3b/3c measured them, W2a-3d fixed the keying). `base:` names the
  # portal-agnostic floor `location_data.payload_norm` applies underneath —
  # `html` = third-party analytics loaders matched by src, page chrome, CSRF
  # material, per-response attributes; `none` = no floor. A page_kind ABSENT here
  # is not declared: it is normalised with that floor alone and counted in its own
  # `+base` cohort, which is the honest state for every surface but `detail`.
  # Declaring an index profile takes an index diff, which nobody has run.
  volatile_paths:
    detail:
      # base: none — the body is the v1 estate JSON. The `html` floor is inert on a
      # JSON surface by construction (only json_pointers are read), so stating `none`
      # says what happens rather than relying on that.
      base: none
      json_pointers:
        # The JSON form of scraper.hashing's already-proven volatile key set — view
        # counters, re-promotion dates, session/recommendation blocks, the firmy.cz
        # review counters — plus the re-signed sdn.cz media URLs, which that module
        # documents as "re-signs wholesale … same image id, different path" and which
        # are the single largest source of sreality byte churn.
        #
        # One member of that set is deliberately absent: hashing.py also drops the
        # `items` entry NAMED "Aktualizace", a value predicate no JSON pointer can
        # express. It is a timestamp item, so it inflates the measured rate slightly —
        # the safe direction (over-, not under-stating churn).
        - /stats
        - /params/stats   # legacy camelCase raw_json puts the view counter here
        - /edited
        - /labels
        - /labels_extended
        - /is_topped
        - /is_topped_today
        - /logged_in
        - /note
        - /rus
        - /rus_reply
        - /user/image
        - /premise/logo
        - /premise/review_count
        - /premise/review_score
        - /premise/premise_paid_firmy
        - /premise/company/sos_custom_advert_card  # flips false<->true portal-side
        - /advert_images/-/url
        - /advert_images/-/kind
        - /advert_images/-/width
        - /advert_images/-/height
        - /videos/-/url
        - /items/-/topped
        # hashing.py's _ATTACHMENT_URL_PREFIX/_SUFFIX rule as a key glob: the
        # energy-certificate PDFs re-sign the way the image URLs do, and enumerating
        # today's members would miss tomorrow's.
        - /sdn_*_attachment_url
        - /_embedded/favourite
        - /_embedded/note
  version_cap: 20

exclusion_zones:
  - locator_kind: api_json
    locator: {json_pointer: /premise}
    reason: >
      The estate agency's OFFICE address, including its own gps_lat/gps_lon. A
      fully-formed decoy in 11 of 12 mined files, and in 3 of them the office is in the
      same city as the property [mine-syn §1c].
  - locator_kind: api_json
    locator: {json_pointer: /labels_extended}
    reason: "POI names are landmarks, never the subject street."

regressions:
  - "520268 — inaccuracy_type='street' over a ~15 km bbox"
  - "1588965452 — geometry blob truncated raw_json, locality object lost"
  - "3067969612 — zip:-1 sentinel"
  # @3: the frozen older shape, one row per arm of it.
  - "3526070348 — legacy locality.value, street-leading, map.type=coordinates"
  - "2052886604 — legacy accuracy='not_address', map.type=geometry, no street in the line"
  - "1600352844 — legacy hyphen obvod outside Praha (Brno - Dolní Heršpice)"

extractions:
  - id: sr.det.gps
    locator_kind: api_json
    extraction_method: portal_structured_field
    page_kind: detail
    locator:
      reader: point_pair
      lat_pointer: /locality/gps_lat
      lon_pointer: /locality/gps_lon
      fallback:
        # The older shape's pin. `/map/type` says which kind it is — `coordinates` on the
        # rows whose accuracy is `address`, `geometry` (the centroid of a drawn quarter
        # polygon) on the rest — and the caps below already read that distinction off the
        # precision label, so the point is stated once and graded once.
        - {lat_pointer: /map/lat, lon_pointer: /map/lon}
    claim_type: coordinate
    precision_cap:
      granularity_max: per_inaccuracy_type
      position_source_max: {gps: portal_pin, address: portal_pin,
                            _default: portal_pin_blurred}
    prior: {position_source: portal_pin, match_confidence: low}
    guards: [reject_outside_cz_bbox]
    notes: "The portal pin; both caps read the label on sr.det.inaccuracy_type."

  - id: sr.det.inaccuracy_type
    locator_kind: api_json
    extraction_method: portal_declared_quality
    page_kind: detail
    locator:
      reader: declared_quality
      json_pointer: /locality/inaccuracy_type
      # The older shape's own precision field. Two values across the sampled corpus,
      # `address` (shared with the post-cutover vocabulary) and `not_address`.
      fallback:
        - {json_pointer: /locality/accuracy}
    claim_type: precision_declaration
    precision_cap:
      granularity_max:
        gps: address_point
        address: address_point
        street: street
        ward: cast_obce_or_quarter
        quarter: cast_obce_or_quarter
        municipality: obec
        not_address: cast_obce_or_quarter
      blurred_labels: [street, ward, quarter, municipality, not_address]
    prior: {match_confidence: low}
    notes: "Grades the ANSWER's precision; a cap, never a certification."

  - id: sr.det.street
    locator_kind: api_json
    extraction_method: portal_structured_field
    page_kind: detail
    locator:
      reader: scalar
      json_pointer: /locality/street
      # A bare street name post-cutover; the LEADING segment of the address line before it.
      # `address_part_street` is the shared splitter, and it refuses rather than guesses —
      # a line whose leading segment does not survive the street tests claims no street and
      # leaves it to the resolver's binding.
      fallback:
        - {json_pointer: /locality/value, transform: [address_part_street]}
    claim_type: street_name
    prior: {granularity: street}

  - id: sr.det.housenumber
    locator_kind: api_json
    extraction_method: portal_structured_field
    page_kind: detail
    locator: {reader: scalar, json_pointer: /locality/housenumber}
    claim_type: house_number_cp
    notes: "čp and čo are a PAIR, not alternatives (1558/7)."

  - id: sr.det.streetnumber
    locator_kind: api_json
    extraction_method: portal_structured_field
    page_kind: detail
    locator: {reader: scalar, json_pointer: /locality/streetnumber}
    claim_type: house_number_co

  - id: sr.det.zip
    locator_kind: api_json
    extraction_method: portal_structured_field
    page_kind: detail
    locator: {reader: scalar, json_pointer: /locality/zip}
    claim_type: psc
    transform: ["sentinel_drop:-1", "psc_normalise"]
    notes: "31,046 whole-corpus rows store the literal '-1'."

  - id: sr.det.name_city
    locator_kind: api_json
    extraction_method: portal_structured_field
    page_kind: detail
    locator:
      reader: scalar
      json_pointer: /locality/city
      # The obec segment of the older shape's one address line. `address_part_obec` IS
      # `statutory_city_obec` on a single-segment value, so the two paths agree wherever
      # they overlap; what it adds is the comma walk and the `okres …` qualifier rail.
      fallback:
        - {json_pointer: /locality/value, transform: [address_part_obec]}
    claim_type: obec_name
    transform: [statutory_city_obec]
    prior: {granularity: obec}
    notes: "THE TOWN. /locality/city is already the obec; the transform is the rail."

  - id: sr.det.name_citypart
    locator_kind: api_json
    extraction_method: portal_structured_field
    page_kind: detail
    locator:
      reader: scalar
      json_pointer: /locality/citypart
      # The named tail the statutory-city fold drops: "Praha 4 - Podolí" states the town
      # and the quarter in one segment, and @2 kept only the town.
      fallback:
        - {json_pointer: /locality/value, transform: [address_part_cast_obce]}
    claim_type: cast_obce_name
    prior: {granularity: cast_obce_or_quarter}
    notes: "The RÚIAN část obce; /locality/quarter is the městská část."

  - id: sr.det.name_district
    locator_kind: api_json
    extraction_method: portal_structured_field
    page_kind: detail
    locator: {reader: scalar, json_pointer: /locality/district}
    claim_type: okres_name
    notes: "sreality's `district` is the okres level; remax's is a quarter."

  - id: sr.det.name_region
    locator_kind: api_json
    extraction_method: portal_structured_field
    page_kind: detail
    locator: {reader: scalar, json_pointer: /locality/region}
    claim_type: kraj_name

  - id: sr.det.name_country
    locator_kind: api_json
    extraction_method: portal_structured_field
    page_kind: detail
    locator: {reader: scalar, json_pointer: /locality/country}
    claim_type: country
    notes: "Foreign is a determination, never a default."
