# maxima @3 — every entry reads the STORED DETAIL BODY; nothing reads a `listings` column.
# Reads: the OpenLayers `JSON.parse('…')` map config (the drawn feature's position and its
# TYPE), the `div.locality` line (obec / část obce / street), and the description's "okres X".

portal: maxima
contract_version: 3

persistence:
  # What this portal's body carries that changes without the listing changing —
  # PER page_kind, because a detail page is one property and an index page is a
  # LIST of them, and every rule below came from diffing DETAIL pages (02 §2.3.2
  # P1; W2a-3b/3c measured them, W2a-3d fixed the keying). `base:` names the
  # portal-agnostic floor `location_data.payload_norm` applies underneath —
  # `html` = third-party analytics loaders matched by src, page chrome, CSRF
  # material, per-response attributes; `none` = no floor. A page_kind ABSENT here
  # is not declared: it is normalised with that floor alone and counted in its own
  # `+base` cohort, which is the honest state for every surface but `detail`.
  # Declaring an index profile takes an index diff, which nobody has run.
  volatile_paths:
    detail:
      # Declared, and the floor is the whole of it: no portal-specific volatile node
      # has been observed on this portal. That is a measurement, not a gap — an
      # empty declaration keeps this surface in its own cohort, so if maxima ever
      # starts churning the readout attributes it to maxima rather than to "no
      # profile was ever written".
      base: html
  version_cap: 20

exclusion_zones:
  - locator_kind: html_selector
    locator: {css: ".similar, .podobne"}
    reason: >
      "Podobné nemovitosti v naší nabídce" — the sibling block is the only extra content in
      detail_page_text, which "yielded 0 unique subject facts" and is "an active
      mis-attribution hazard" [mine-maxima].

regressions:
  - "f60012522 — Krásný Les: one locality segment, no map script; the okres that separates
     it from the other Krásný Les is stated only in the description."
  - "d40026367 / f60012682 — one plot on two pages; a Point then a Circle, vs a Circle only."

extractions:
  - id: mx.det.map_features
    locator_kind: map_config
    extraction_method: map_widget_parse
    page_kind: detail
    locator: {reader: json_geometry, css: "script",
              script_match: "JSON\\.parse\\('(?P<config>(?:[^'\\\\]|\\\\.)*)'\\)",
              decode: js_string, then: "/features/0", geometry_reader: openlayers,
              position_branch: portal_pin, reject_zoom_at_or_below: 12}
    claim_type: coordinate
    blur_evidence: none
    precision_cap:
      granularity_max: {Point: address_point, LineString: street_segment, Circle: obec}
      position_source_max: {Point: portal_pin, LineString: portal_pin,
                            Circle: portal_pin_blurred}
    prior: {position_source: portal_pin, match_confidence: low}
    guards: [reject_outside_cz_bbox]
    notes: "The DRAWN geometry — point, LineString midpoint, Circle centre — never `/center`
      (the view centre, 9.2 km out on d40031686); empty `features` misses structurally."

  - id: mx.det.map_geometry
    locator_kind: map_config
    extraction_method: portal_declared_quality
    page_kind: detail
    locator: {reader: json_scalar, css: "script",
              script_match: "JSON\\.parse\\('(?P<config>(?:[^'\\\\]|\\\\.)*)'\\)",
              decode: js_string, then: "/features/0", json_pointer: "/type"}
    claim_type: precision_declaration
    precision_cap: {blurred_labels: [LineString, Circle]}
    notes: "The feature TYPE is maxima's own precision statement; W1-c R5 makes the value the
      label and blurred_labels the blur axis, so Point states precision and
      LineString/Circle state blur."

  - id: mx.det.locality_obec
    locator_kind: html_selector
    extraction_method: html_selector_parse
    page_kind: detail
    locator: {reader: html_text, css: "div.locality"}
    claim_type: obec_name
    transform: ["comma_segment:1@*", "statutory_city_obec"]
    notes: "THE TOWN — segment 1 of every line shape on record, folded to the city when the
      portal writes an obvod there ('Praha 3' -> 'Praha', W1-c R4)."

  - id: mx.det.locality_quarter
    locator_kind: html_selector
    extraction_method: html_selector_parse
    page_kind: detail
    locator: {reader: html_text, css: "div.locality"}
    claim_type: cast_obce_name
    transform: ["comma_segment:2@3"]
    notes: "The MIDDLE segment of a three-segment line — the katastrální území /
      čtvrť ('Veveří', 'Žižkov'); a two-segment line has no unambiguous middle."

  - id: mx.det.locality_street
    locator_kind: html_selector
    extraction_method: html_selector_parse
    page_kind: detail
    locator: {reader: html_text, css: "div.locality"}
    claim_type: street_name
    transform: ["comma_segment:-1@3"]
    notes: "Last segment of a THREE-segment line only — scraper/street.py:285-289's own
      rule: the morphology gate is needed only for the ambiguous 2-segment case."

  - id: mx.det.description_okres
    locator_kind: html_selector
    extraction_method: regex_text
    page_kind: detail
    locator: {reader: html_regex, css: "#collapse-inzerat-text",
              pattern: "okres\\s+(?P<okres>[^,.;]+)", group: okres}
    claim_type: okres_name
    precision_cap: {granularity_max: okres, position_source_max: admin_centroid}
    notes: "Stated on 3 of the 12 mined rows (~25%) — thin, and the only signal
      that separates the two Krásný Les (f60012522: 'obec Krásný Les, okres Liberec')."
